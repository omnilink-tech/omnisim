name: Linux Fast Build And Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - released
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install build and test dependencies
      run: |
        sudo scripts/install/linux_optional_compilation_dependencies.sh
        sudo scripts/install/linux_test_dependencies.sh

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-omnisim-fast-${{ github.ref_name }}
        max-size: 500M

    - name: Build release without packaging
      run: |
        export OMNISIM_HOME=$PWD
        export USE_CCACHE=1
        export LIBGL_ALWAYS_SOFTWARE=true
        xvfb-run --auto-servernum make release -j4

    - name: Run smoke suite
      run: |
        export OMNISIM_HOME=$PWD
        export LIBGL_ALWAYS_SOFTWARE=true
        export WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true
        xvfb-run --auto-servernum python3 tests/smoke/run_smoke.py --nomake
