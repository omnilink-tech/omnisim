name: Developer Fast Path

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - released
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate developer surface
      run: |
        python scripts/dev/omnisim_dev.py --help
        python scripts/dev/omnisim_dev.py build --help
        python tests/smoke/run_smoke.py --help
        python tests/benchmarks/run_benchmarks.py --help

    - name: Validate docs exist
      run: |
        test -f docs/developer/architecture.md
        test -f docs/developer/agent-map.md
        test -f docs/developer/search-map.json
        test -f docs/developer/quickstart.md
        test -f docs/developer/phase-two-architecture-plan.md
