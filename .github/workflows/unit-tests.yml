name: unit-tests

# The engine-free unit lane, in CI.
#
# WHY THIS EXISTS
#   `make tests-unit` is ~1,200 pure-Python tests and it had never run anywhere
#   but the owner's laptop. That is where the OmniLink safety gate, the
#   deterministic interpreter and the bridge tool registry are pinned --
#   packages/omnisim-bridges/tests/test_gate.py, test_interpret.py and
#   test_gate_registry.py between them are the entire evidence that a physical
#   tool call under a question utterance is refused. A lane that only ever runs
#   on one machine is a lane that goes red without anyone noticing, which is
#   exactly what happened to the licence gate the day after v8.5.0 shipped.
#
# WHY IT NEEDS NO SIMULATOR
#   tests/conftest.py marks every module that launches or requires the engine
#   binary at collection time, so `-m "not engine"` (what the Makefile target
#   runs) deselects them. The root-level files come from the same logic
#   (`tests/conftest.py --list-engine-free`), never a hand-written list, so a
#   new engine test cannot sneak into this lane and turn it red for want of a
#   build. Nothing here compiles, downloads a runtime, or touches a GPU.
#
# NO PATH FILTER, DELIBERATELY
#   This lane ships in the public snapshot and runs on the public account.
#   A snapshot arrives as ONE squashed commit whose contents are whatever
#   changed, so a path filter would routinely skip it on exactly the push that
#   matters. It is cheap enough to run on everything.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The canonical install-root variable. The Makefile derives it from its
      # own directory when unset; setting it explicitly keeps the derivation
      # out of the picture and matches what every script in the tree reads.
      OMNISIM_HOME: ${{ github.workspace }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The lane's whole third-party surface, derived from the imports of the
      # 100 modules it collects: pytest, Pillow (the Makefile's interpreter
      # probe requires BOTH before it will pick an interpreter at all), numpy,
      # and the bridges package -- installed editable so the tests import the
      # tree under test rather than a copy, and bringing the `omnilink` SDK
      # with it. torch / warp / newton are imported by a handful of modules
      # that self-skip without them; they are deliberately NOT installed here
      # (gigabytes of GPU wheels for checks that cannot run on a CPU runner).
      #
      # `distro` is here because of a PLATFORM-GUARDED import that no Windows
      # machine can reveal: scripts/packaging/generate_projects_files.py does
      # `if sys.platform == 'linux': import distro`, and the packaging tests
      # import it. This lane's dependency list was derived by scanning imports on
      # Windows, where that branch never runs, so the first Linux run
      # (v9.0.0-rc.1, 2026-09-23) died at collection with
      # `No module named 'distro'`. The same list, installed into a clean venv,
      # collects all 2,291 tests on Windows -- the gap is Linux-only. Checked
      # the other guard spellings too (os.name == 'posix', platform.system(),
      # sys.platform != 'win32'): no other live code has one.
      - name: Install the lane's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy distro
          python -m pip install -e packages/omnisim-bridges

      # Fail here, with a legible message, rather than inside the Makefile's
      # interpreter probe -- which reports a missing dependency as "no python
      # with pytest+Pillow on PATH" and sends the reader hunting for the wrong
      # problem.
      - name: Check the interpreter the Makefile will pick
        run: |
          python -c "import pytest, PIL, numpy, omnisim_bridges; print('deps OK')"
          python tests/conftest.py --list-engine-free tests | tr ' ' '\n' | wc -l

      - name: make tests-unit
        run: make tests-unit
