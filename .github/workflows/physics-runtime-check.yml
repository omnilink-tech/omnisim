# Does the PINNED physics stack actually import and build a model, on each
# Python we ship against?
#
# WHY THIS EXISTS
#   The Linux CI build compiled, linked and installed cleanly, and then the
#   engine came up with NO PHYSICS:
#
#     WARNING: [OmNewtonBackend] FFI smoke (newton.ModelBuilder()) raised:
#              Union[arg, ...]: each arg must be a type. Got wp.array[wp.bool].
#     ERROR: [physics] NO PHYSICS BACKEND IS AVAILABLE
#
#   Every package involved declares `Requires-Python: >=3.10` and the Windows
#   bundle runs the identical pins happily -- on CPython 3.12.9. So the declared
#   floor is not the real floor, and nothing in this repo checked that.
#
#   This job is deliberately CHEAP (a pip install and one import, ~2-3 min)
#   because its whole job is to fail before the 15-25 minute engine build does,
#   and to say WHICH interpreter is at fault rather than leaving a green build
#   that produces a simulator with no physics -- the worst failure shape there
#   is, because the world still loads and simply stands still.
#
#   BOTH legs gate now. 22.04 used to be informational-and-expected-to-fail
#   ("documents the floor by demonstrating it"), which produced a permanently
#   red job on the public Actions tab -- a broken-looking project, and no fix.
#   The fix shipped instead: linux_bootstrap.sh's `python` phase installs 3.12
#   from deadsnakes on a distro whose python3 is <3.11, and the engine embeds
#   that interpreter. So the 22.04 leg now asserts BOTH halves of the truth:
#     1. the system 3.10 still fails at ModelBuilder() -- if this ever starts
#        PASSING, the floor moved and the docs + bootstrap gate are stale;
#     2. the bootstrap-installed 3.12 runs the identical pins to completion.
#
#   fail-fast is off on purpose: the point is to see EVERY interpreter's verdict
#   in one run, not to stop at the first bad one.
name: physics-runtime-check

on:
  pull_request:
    paths:
      - "scripts/packaging/newton_runtime_pins.py"
      - "scripts/install/linux_bootstrap.sh"
      - ".github/workflows/physics-runtime-check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/packaging/newton_runtime_pins.py"
      - "scripts/install/linux_bootstrap.sh"
      - ".github/workflows/physics-runtime-check.yml"
  workflow_dispatch:

concurrency:
  group: physics-runtime-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python. The interpreter that matters is the SYSTEM one,
      # because that is the one the engine embeds and links on Linux.
      - name: Report the system interpreter
        run: |
          python3 -VV
          echo "os=${{ matrix.os }}"

      # On a distro whose python3 is <3.11, this installs 3.12 from deadsnakes
      # -- the SAME phase a user's `linux_bootstrap.sh all` runs, so a green
      # tick here is evidence about their experience. No-op on 24.04.
      - name: Physics interpreter (the bootstrap's own python phase)
        run: bash scripts/install/linux_bootstrap.sh python

      - name: Install the pinned physics stack (from the repo SSOT)
        run: |
          # The interpreter the ENGINE would embed -- same selection the
          # bootstrap's build phase makes: newest >=3.11 present, else python3.
          PY=python3
          for cand in python3.13 python3.12 python3.11; do
            command -v "$cand" >/dev/null 2>&1 && { PY="$cand"; break; }
          done
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -VV
          FLAGS=""
          # PEP-668 pips (24.04) refuse a system install without this; older
          # pips reject the flag outright. Same probe linux_bootstrap.sh uses.
          if "$PY" -m pip install --help 2>/dev/null | grep -q break-system-packages; then
            FLAGS="--break-system-packages"
          fi
          "$PY" -m pip install $FLAGS --upgrade pip
          PINS="$("$PY" scripts/packaging/newton_runtime_pins.py | tr '\n' ' ')"
          echo "pins: $PINS"
          "$PY" -m pip install $FLAGS $PINS "mujoco==3.11.0" numpy

      # newton.ModelBuilder() is exactly the FFI smoke the engine performs at
      # startup (OmNewtonBackend). Importing is not enough -- the failure above
      # happened at construction, not at import.
      - name: Import and construct, the way the engine does
        run: |
          "$PY" - <<'PY_EOF'
          import sys
          print("python", sys.version)
          import warp, newton, mujoco, mujoco_warp
          print("warp       ", warp.config.version)
          print("newton     ", getattr(newton, "__version__", "?"))
          print("mujoco     ", mujoco.__version__)
          b = newton.ModelBuilder()
          print("ModelBuilder() OK ->", type(b).__name__)
          PY_EOF

      # The floor itself, kept as a MEASUREMENT with the assertion inverted:
      # the system 3.10 must STILL fail at ModelBuilder(). The day this step
      # goes red, newton runs on 3.10 and the deadsnakes machinery above (plus
      # every "22.04 needs the python phase" sentence in the docs) is stale.
      - name: Assert the 3.10 floor still holds (22.04 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python3 -VV
          # Measured on this runner image: after the deadsnakes install above,
          # `python3 -m pip` on the SYSTEM 3.10 dies with "No module named
          # pip.__main__" -- a partial pip. Reinstalling the distro's own
          # python3-pip restores it; without this the step fails on plumbing
          # before it ever reaches the measurement it exists to take.
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --reinstall python3-pip
          fi
          python3 -m pip --version
          FLAGS=""
          if python3 -m pip install --help 2>/dev/null | grep -q break-system-packages; then
            FLAGS="--break-system-packages"
          fi
          PINS="$(python3 scripts/packaging/newton_runtime_pins.py | tr '\n' ' ')"
          python3 -m pip install $FLAGS $PINS "mujoco==3.11.0" numpy
          set +e
          OUT=$(python3 -c "import newton; newton.ModelBuilder()" 2>&1)
          RC=$?
          set -e
          echo "$OUT" | tail -3
          if [ $RC -eq 0 ]; then
            echo "UNEXPECTED: newton now constructs on the system 3.10."
            echo "The documented floor moved -- update the docs and simplify the"
            echo "bootstrap's python phase before trusting this green."
            exit 1
          fi
          echo "$OUT" | grep -q "each arg must be a type" \
            || { echo "3.10 failed for a DIFFERENT reason than the documented one:"; echo "$OUT" | tail -10; exit 1; }
          echo "floor holds: newton still raises the documented TypeError on 3.10" 
