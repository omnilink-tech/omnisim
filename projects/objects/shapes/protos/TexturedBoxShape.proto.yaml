# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TexturedBoxShape
  source: projects/objects/shapes/protos/TexturedBoxShape.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/shapes/protos/TexturedBoxShape.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: 'A box Shape that splits its six faces between a textured pass and a flat-colour pass, so each face can be
      individually opted in or out of the texture. The per-face booleans (`frontFace`, `leftFace`, ...) select which faces
      receive `textureUrl`; the faces left out are painted with the uniform `faceColor` instead. The texture is laid out by
      the `textureMapping` field: - `cube` mapping: the six faces are unwrapped onto a cube cross. - `compact` cube mapping:
      the same, packed tightly. - `flat` mapping: the texture is projected onto the front face. - `metric` mapping: like `default`,
      but the texture keeps its aspect ratio instead of being stretched to each face. - `default` mapping: the whole texture
      on every face.'
  extern_protos:
  - omnisim://projects/objects/geometries/protos/TexturedBox.proto
  fields:
  - name: size
    type: SFVec3f
    access: field
    default: [0.1, 0.1, 0.1]
    hint: Defines the size of the box.
  - name: textureUrl
    type: MFString
    access: field
    default:
    - omnisim://projects/default/worlds/textures/old_brick_wall.jpg
    hint: Defines the texture used for the box.
  - name: textureFiltering
    type: SFInt32
    access: field
    default: 4
    hint: Defines the filtering level for the texture used for the box.
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines the texture transform for the texture used for the box.
  - name: textureMapping
    type: SFString
    access: field
    default: flat
    hint: Defines the texture mapping.
    enum: [cube, compact, flat, metric, default, none]
  - name: faceColor
    type: SFColor
    access: field
    default: [0.8, 0.8, 0.8]
    hint: Defines the color of the faces of the box.
  - name: frontFace
    type: SFBool
    access: field
    default: true
    hint: Defines whether the front face is included.
  - name: backFace
    type: SFBool
    access: field
    default: true
    hint: Defines whether the back face is included.
  - name: leftFace
    type: SFBool
    access: field
    default: true
    hint: Defines whether the left face is included.
  - name: rightFace
    type: SFBool
    access: field
    default: true
    hint: Defines whether the right face is included.
  - name: topFace
    type: SFBool
    access: field
    default: true
    hint: Defines whether the top face is included.
  - name: bottomFace
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bottom face is included.
