# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Toilet
  source: projects/objects/bathroom/protos/Toilet.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/bathroom/protos/Toilet.proto
    keywords: [interior/bathroom]
    description: 'A close-coupled toilet built from primitives: a porcelain pedestal and bowl, a coloured seat and lid, a
      cistern with a back panel and a brushed-aluminium flush button. The origin sits on the floor, under the bowl.'
  extern_protos:
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: toilet
  - name: lidColor
    type: SFColor
    access: field
    default: [0.45, 0.62, 0.81]
    hint: Defines the color of the lid.
