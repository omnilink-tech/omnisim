# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BathroomSink
  source: projects/objects/bathroom/protos/BathroomSink.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/bathroom/protos/BathroomSink.proto
    keywords: [furniture/bathroom]
    description: 'A vanity unit: a ceramic bowl standing on a counter plate over a cabinet, with a pillar tap behind it. The
      whole assembly is built from primitives. It stands off a wall at the origin and reaches out along +x, so a Wall at x
      = 0 puts the splashback exactly where it belongs.'
  extern_protos:
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - omnisim://projects/appearances/protos/MarbleTiles.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.05]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: sink
  - name: upperAppearance
    type: SFNode
    access: field
    default: VarnishedPine { }
    hint: Defines the appearance of the upper plate.
  - name: bottomAppearance
    type: SFNode
    access: field
    default: MarbleTiles { }
    hint: Defines the appearance of the upper plate.
