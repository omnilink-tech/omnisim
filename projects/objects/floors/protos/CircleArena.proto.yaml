# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: CircleArena
  source: projects/objects/floors/protos/CircleArena.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/floors/protos/CircleArena.proto
    keywords: [primitive/ground]
    template_language: javascript
    description: 'A round arena: a disc of floor at z = 0 ringed by a low wall standing on its rim.'
  extern_protos:
  - omnisim://projects/appearances/protos/Parquetry.proto
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  - omnisim://projects/objects/solids/protos/SolidPipe.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: circle arena
  - name: radius
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the radius of the arena.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: floorAppearance
    type: SFNode
    access: field
    default: Parquetry { type "chequered" }
    hint: Defines the appearance of the floor.
  - name: floorTileSize
    type: SFVec2f
    access: field
    default: [0.5, 0.5]
    hint: Defines the size of the texture used for the floor.
  - name: wallThickness
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines the thickness of the wall.
  - name: wallHeight
    type: SFFloat
    access: field
    default: 0.1
    hint: Defines the height of the wall.
  - name: wallAppearance
    type: SFNode
    access: field
    default: BrushedAluminium { }
    hint: Defines the appearance of the wall.
  - name: subdivision
    type: SFInt32
    access: field
    default: 48
    hint: Defines the subdivision of the wall cylinder.
  - name: floorTextureUrl
    type: MFString
    access: hiddenField
    default:
    - omnisim://projects/default/worlds/textures/checkered_parquetry.jpg
    - omnisim://projects/default/worlds/textures/metal.jpg
    hint: Deprecated in R2019-rev2
    leading_comments:
    - Deprecated in R2019a
  - name: wallTileSize
    type: SFVec2f
    access: hiddenField
    default: [0.5, 0.5]
