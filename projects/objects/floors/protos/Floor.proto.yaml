# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Floor
  source: projects/objects/floors/protos/Floor.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/floors/protos/Floor.proto
    keywords: [primitive/ground]
    template_language: javascript
    description: A flat rectangular ground plane of arbitrary size, with a repeating tiled appearance.
  extern_protos:
  - omnisim://projects/appearances/protos/Parquetry.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: floor
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: size
    type: SFVec2f
    access: field
    default: [10, 10]
    hint: Defines the size of the floor.
  - name: tileSize
    type: SFVec2f
    access: field
    default: [0.5, 0.5]
    hint: Defines the size of texture used for the floor.
  - name: appearance
    type: SFNode
    access: field
    default: Parquetry { type "chequered" }
    hint: Defines the appearance of the floor.
  - name: texture
    type: MFString
    access: hiddenField
    default:
    - omnisim://projects/default/worlds/textures/checkered_parquetry.jpg
    leading_comments:
    - Deprecated in R2019a
