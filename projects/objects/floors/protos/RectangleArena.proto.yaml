# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: RectangleArena
  source: projects/objects/floors/protos/RectangleArena.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/floors/protos/RectangleArena.proto
    keywords: [primitive/ground]
    template_language: javascript
    description: 'A rectangular test arena: a tiled Floor fenced in by four solid walls.'
  extern_protos:
  - omnisim://projects/appearances/protos/Parquetry.proto
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  - Floor.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: rectangle arena
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: floorSize
    type: SFVec2f
    access: field
    default: [1, 1]
    hint: Defines the size of the floor.
  - name: floorTileSize
    type: SFVec2f
    access: field
    default: [0.5, 0.5]
    hint: Defines the size of the texture used for the floor.
  - name: floorAppearance
    type: SFNode
    access: field
    default: Parquetry { type "chequered" }
    hint: Defines the appearance of the floor.
  - name: wallThickness
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines the thickness of the walls.
  - name: wallHeight
    type: SFFloat
    access: field
    default: 0.1
    hint: Defines the height of the walls.
  - name: wallAppearance
    type: SFNode
    access: field
    default: BrushedAluminium { }
    hint: Defines the appearance of the wall.
  - name: floorTextureUrl
    type: MFString
    access: hiddenField
    default:
    - omnisim://projects/default/worlds/textures/checkered_parquetry.jpg
    - omnisim://projects/default/worlds/textures/metal.jpg
    hint: Deprecated in R2019a-rev2
    leading_comments:
    - Deprecated in R2019a
  - name: wallColor
    type: SFColor
    access: hiddenField
    default: [0.8, 0.8, 0.8]
  - name: wallTileSize
    type: SFVec2f
    access: hiddenField
    default: [0.5, 0.5]
