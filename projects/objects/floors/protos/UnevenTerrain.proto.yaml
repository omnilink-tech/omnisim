# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: UnevenTerrain
  source: projects/objects/floors/protos/UnevenTerrain.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/floors/protos/UnevenTerrain.proto
    keywords: [primitive/ground]
    template_language: javascript
    description: 'A rolling ground plane whose height field is generated from fractal value noise: octaves of smoothly interpolated
      hash noise summed at halving amplitude. `randomSeed` picks the landscape, `flatCenter` presses a level pad into the
      middle for a robot to start on, and `flatBounds` lets the terrain fall away to zero at the edges.'
    tags: [nonDeterministic]
  extern_protos:
  - omnisim://projects/appearances/protos/SandyGround.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: uneven terrain
  - name: size
    type: SFVec3f
    access: field
    default: [50, 50, 5]
    hint: Defines the size of the terrain.
  - name: xDimension
    type: SFInt32
    access: field
    default: 50
    hint: Defines the number of points in the grid height array in the x direction.
  - name: yDimension
    type: SFInt32
    access: field
    default: 50
    hint: Defines the number of points in the grid height array in the y direction.
  - name: appearance
    type: SFNode
    access: field
    default: SandyGround { textureTransform TextureTransform { scale 50 50 } }
    hint: Defines the appearance of the terrain.
  - name: randomSeed
    type: SFInt32
    access: field
    default: 1
    hint: Defines the seed of the random number generator. A value smaller or equal to 0 sets a random seed.
  - name: flatCenter
    type: SFBool
    access: field
    default: false
    hint: Defines whether the center of the terrain should be flat.
  - name: flatBounds
    type: SFBool
    access: field
    default: false
    hint: Defines whether the bounds of the terrain should be flat.
  - name: perlinNOctaves
    type: SFInt32
    access: field
    default: 3
    hint: Defines the number of octaves of the perlin noise.
  - name: texture
    type: MFString
    access: deprecatedField
    default:
    - omnisim://projects/default/worlds/textures/sand.jpg
    hint: Deprecated in Webots R2020b
    leading_comments:
    - Deprecated in Webots R2019a
  - name: textureScale
    type: SFVec2f
    access: deprecatedField
    default: [1.0, 1.0]
