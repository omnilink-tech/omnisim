# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TerrainRock
  source: projects/objects/rocks/protos/TerrainRock.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/rocks/protos/TerrainRock.proto.py
    keywords: [exterior/obstacle, terrain]
    description: Smooth-collision rock for rough-terrain robot demos. Sphere boundingObject so wheels can roll over cleanly;
      the visual is a slightly less detailed sphere with a configurable color.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
    hint: Is `Solid.translation`.
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
    hint: Is `Solid.rotation`.
  - name: name
    type: SFString
    access: field
    default: terrain_rock
    hint: Is `Solid.name`.
  - name: radius
    type: SFFloat
    access: field
    default: 0.15
    hint: Sphere radius (visual + bounding). Default ~15 cm — climbable for a Husky.
  - name: color
    type: SFColor
    access: field
    default: [0.45, 0.4, 0.35]
    hint: Base color of the rock surface (PBR baseColor).
  - name: density
    type: SFFloat
    access: field
    default: 2500.0
    hint: Physics density in kg/m^3 (granite ~2500).
  - name: locked
    type: SFBool
    access: field
    default: true
    hint: Is `Solid.locked`. Default TRUE — these are terrain features, not props; we don't want a wheeled robot punting them
      around like billiard balls when the goal is to climb over them. Override to FALSE only if you specifically want loose
      rocks.
