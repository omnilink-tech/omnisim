# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: RockHD
  source: projects/objects/rocks/protos/RockHD.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/rocks/protos/RockHD.proto
    keywords: [exterior/obstacle, terrain]
    template_language: javascript
    description: 'Higher-poly rock for OmniSim rough-terrain demos. Loop-subdivided variant of Rock.proto''s regular mesh:
      78 vertices, 152 triangles (vs. Rock''''''''s 21/38). Wheels contact a near-smooth surface so rough-terrain robots can
      climb without snagging on sharp faceted edges.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: rock_hd
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
  - name: texture
    type: MFString
    access: field
    default:
    - omnisim://projects/default/worlds/textures/rock.jpg
