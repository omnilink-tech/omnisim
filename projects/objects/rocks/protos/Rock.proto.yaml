# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Rock
  source: projects/objects/rocks/protos/Rock.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/rocks/protos/Rock.proto
    keywords: [exterior/obstacle]
    template_language: javascript
    description: 'A boulder that sits flat on the ground: a lumpy dome cut off by the z = 0 plane, so it rests on terrain
      without floating or sinking. `regular` is a ~20 cm stone, `flat` a wide low slab. The lumps are generated, not sculpted,
      so the mesh follows `scale` exactly.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: rock
  - name: type
    type: SFString
    access: field
    default: regular
    hint: Defines the rock variant.
    enum: [regular, flat]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the scale of the rock.
  - name: texture
    type: MFString
    access: field
    default:
    - omnisim://projects/default/worlds/textures/rock.jpg
    hint: Defines the texture used for the rock.
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the base color of the rock.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
  - name: locked
    type: SFBool
    access: field
    default: false
    hint: Is `Solid.locked`.
extra:
  behavior:
    role: dynamic_obstacle
    notes: |2-

      Default `physics NULL` makes the rock static scenery. For OmniSim

      agent scenarios that need rocks to respond to robot contact, override

      `physics Physics { density 2500 }` (granite-ish, ~5kg for scale 1.0

      regular, ~70kg for scale 1.0 flat).
    recommended_overrides:
      physics: Physics { density 2500 }
      locked: false
    known_caveats:
    - |-
      boundingObject uses the full visual IndexedFaceSet, which generates 30-50+ contact points against a flat floor. ODE's
      default contact cap of 10 will clip — set WorldInfo.contactProperties maxContactJoints to ~50 for multi-rock scenes,
      or accept lossy collision response. Future work: ship a coarser boundingObject variant (e.g. RockSimpleBound) for dynamics-first
      use.
    - |-
      Pair with a robot whose URDF/PROTO has no near-massless links (< 0.01 kg). ODE warns on >1e4 mass ratios; combining
      heavy rocks with a Husky URDF that has a 0.001 kg top_plate_link produces a warning (not fatal but a stability hazard).
    demo_world: projects/samples/demos/worlds/showcase/husky_rocks_traverse.omniworld
