# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Gnome
  source: projects/objects/garden/protos/Gnome.proto
  header:
    license: Creative Commons Attribution 4.0 International License.
    license_url: https://creativecommons.org/licenses/by/4.0/legalcode
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/objects/garden/protos/Gnome.proto
    keywords: [exterior/garden]
    template_language: javascript
    description: A gnome with optional physics.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: gnome
  - name: enablePhysics
    type: SFBool
    access: field
    default: false
    hint: Defines whether the gnome should have physics.
