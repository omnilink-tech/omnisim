# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SoccerBall
  source: projects/objects/balls/protos/SoccerBall.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/balls/protos/SoccerBall.proto
    keywords: [household/toy]
    description: 'A plain white soccer ball: a single sphere with a matte white shell, a tight spherical bounding object and
      a physics node driven by the `mass` field. The origin sits at the centre of the ball.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.11]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: soccer ball
  - name: radius
    type: SFFloat
    access: field
    default: 0.113
    hint: Defines the radius of the ball.
  - name: mass
    type: SFFloat
    access: field
    default: 0.6
    hint: Defines the mass of the ball.
