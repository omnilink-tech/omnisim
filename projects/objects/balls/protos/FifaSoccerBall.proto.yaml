# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: FifaSoccerBall
  source: projects/objects/balls/protos/FifaSoccerBall.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/objects/balls/protos/FifaSoccerBall.proto
    keywords: [exterior/sport]
    template_language: javascript
    description: A black and white FIFA soccer ball with customizable size. This object is physics-enabled so it will roll
      or bounce when hit.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.12]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: fifa soccer ball
  - name: size
    type: SFInt32
    access: field
    default: 5
    hint: Defines the ball size and mass according to FIFA standards.
    enum: [1, 2, 3, 4, 5]
