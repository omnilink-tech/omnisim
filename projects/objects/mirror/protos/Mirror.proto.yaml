# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Mirror
  source: projects/objects/mirror/protos/Mirror.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/mirror/protos/Mirror.proto
    keywords: [household/living room]
    template_language: javascript
    description: 'A framed mirror faked with optics rather than ray tracing: a Camera set back behind the glass feeds a Display
      hung in the frame. The pane shows what the camera sees, so the reflection is independent of where the observer stands.'
  extern_protos:
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: mirror
  - name: controller
    type: SFString
    access: field
    default: mirror
    hint: Defines the controller of the mirror. This controller should simply enable the camera and attach it to the display.
  - name: window
    type: SFString
    access: field
    default: <none>
    hint: Is `Robot.window`.
  - name: supervisor
    type: SFBool
    access: field
    default: false
    hint: Is `Robot.supervisor`.
  - name: fieldOfView
    type: SFFloat
    access: field
    default: 0.785398
    hint: Defines the field of view of the mirror camera.
  - name: width
    type: SFFloat
    access: field
    default: 0.5
    hint: Defines the width of the mirror.
  - name: height
    type: SFFloat
    access: field
    default: 0.8
    hint: Defines the height of the mirror.
  - name: frameThickness
    type: SFFloat
    access: field
    default: 0.02
    hint: Defines the thickness of the mirror frame.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
  - name: frameAppearance
    type: SFNode
    access: field
    default: VarnishedPine { }
    hint: Defines the appearance of the mirror frame.
  - name: frameTexture
    type: MFString
    access: hiddenField
    default:
    - omnisim://projects/default/worlds/textures/wood.jpg
    leading_comments:
    - Deprecated in Webots R2019a
