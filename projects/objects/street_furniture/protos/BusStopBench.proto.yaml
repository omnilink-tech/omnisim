# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BusStopBench
  source: projects/objects/street_furniture/protos/BusStopBench.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    template_language: javascript
    description: 'The bench that goes inside a bus-stop shelter: a slatted seat and back, carried on a frame at each end.  The
      seat and the end frames used to be baked meshes, and those meshes were not ours to redistribute. They are rebuilt from
      primitives here, keeping the envelope the old ones had -- a 5.1 long seat on frames at each end, in the same y-up frame
      the bounding boxes were already written in -- so anything that placed this node still gets a bench of the same size
      in the same place. The shelter that actually ships is BusStop.proto, which builds its own bench and does not use this
      node; this one is kept because it is part of the public surface.'
    tags: [hidden]
  extern_protos:
  - omnisim://projects/appearances/protos/RoughPine.proto
  fields:
  - name: name
    type: SFString
    access: field
    default: bus stop bench
  - name: scale
    type: SFVec3f
    access: field
    default: [1, 1, 1]
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColor 0.3 0.45 0.33 metalness 0 }
    hint: Defines the appreance of the bench.
