# documentation url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/street_furniture/protos/Fence.proto
# keywords: exterior/street furniture
# A parametric fence: poles of a chosen profile spaced along a 3D path, tied together by any
# number of horizontal bars. The bars are swept from the 2D `horizontalBarShape` cross-section
# along the path, and the path itself can be smoothed with a Catmull-Rom spline (`subdivision`).
# template language: javascript

PROTO Fence [
  field SFVec3f      translation             0 0 0
  field SFRotation   rotation                0 0 1 0
  field SFString     name                    "fence"
  field SFString     model                   "fence"
  field MFColor      recognitionColors       [0.8 0.8 0.8]
  field SFFloat      height                  1.5                                                          # Defines the height of the fence.
  field SFFloat      poleGap                 0.5                                                          # Defines the distance between two consecutives poles.
  field SFFloat      poleRadius              0.04                                                         # Defines the radius of the poles.
  field SFString{"cylinder", "square", "diamond", "H"}
                     poleShape               "cylinder"                                                   # Defines the shape of the poles.
  field SFNode       poleAppearance          PBRAppearance {}                                             # Defines the appearance of the poles.
  field MFVec3f      path                    [0 0 0, 0 5 0]                                               # Defines the 3D path of the fence.
  field SFInt32      subdivision             -1                                                           # Defines the degree of interpolation using B-Splines (if the value is lower than 0, the interpolation is disabled).
  field SFInt32      horizontalBarsNumber    2                                                            # Defines the number of horizontal bars.
  field MFVec2f      horizontalBarShape      [0.02 0.06, 0.02 -0.06, -0.02 -0.06, -0.02 0.06, 0.02 0.06]  # Defines the shape 2D of the horizontal bars.
  field SFNode       horizontalBarAppearance PBRAppearance {}                                             # Defines the appearance of the horizontal bars.
  field SFNode       boundingObject          NULL                                                         # Is `Solid.boundingObject`.
  field SFFloat      creaseAngle             0.3                                                          # Defines the creaseAngle of the horizontal bar.
  hiddenField SFNode appearance              NULL                                                         # For backward compatibility warning.
]
{
  %<
    function r6(v) {
      return Math.round(v * 1e6) / 1e6;
    }

    function catmull(p0, p1, p2, p3, t) {
      const t2 = t * t;
      const t3 = t2 * t;
      function c(a, b, c2, d) {
        return 0.5 * ((2.0 * b) + (-a + c2) * t + (2.0 * a - 5.0 * b + 4.0 * c2 - d) * t2 + (-a + 3.0 * b - 3.0 * c2 + d) * t3);
      }
      return {x: c(p0.x, p1.x, p2.x, p3.x), y: c(p0.y, p1.y, p2.y, p3.y), z: c(p0.z, p1.z, p2.z, p3.z)};
    }

    const height = Math.max(0.05, fields.height.value);
    const poleGap = Math.max(0.05, fields.poleGap.value);
    const poleRadius = Math.max(0.005, fields.poleRadius.value);
    const poleShape = fields.poleShape.value;
    const subdivision = fields.subdivision.value;
    const barsNumber = Math.max(0, fields.horizontalBarsNumber.value);

    // an unset SFNode reaches the template as `undefined`, hence the loose comparison
    if (fields.appearance.value != null)
      console.error('Fence: the "appearance" field is deprecated, please use "poleAppearance" and "horizontalBarAppearance" instead.');

    // ---- path: drop duplicates, then optionally smooth with a Catmull-Rom spline ----
    let pts = [];
    const raw = fields.path.value;
    for (let i = 0; i < raw.length; ++i) {
      const p = {x: raw[i].x, y: raw[i].y, z: raw[i].z};
      if (pts.length === 0) {
        pts.push(p);
        continue;
      }
      const q = pts[pts.length - 1];
      if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) + Math.abs(p.z - q.z) > 1e-6)
        pts.push(p);
    }
    const ok = pts.length >= 2;
    if (!ok)
      console.error('Fence: the "path" field needs at least two distinct points; nothing was generated.');

    if (ok && subdivision >= 0) {
      const steps = Math.max(1, Math.min(20, subdivision));
      const src = pts;
      const last = src.length - 1;
      const out = [];
      for (let i = 0; i < last; ++i) {
        const p0 = src[Math.max(0, i - 1)];
        const p1 = src[i];
        const p2 = src[i + 1];
        const p3 = src[Math.min(last, i + 2)];
        for (let s = 0; s < steps; ++s)
          out.push(catmull(p0, p1, p2, p3, s / steps));
      }
      out.push(src[last]);
      pts = out;
    }

    const nPts = pts.length;

    // ---- arc length ------------------------------------------------------
    const cum = [0.0];
    let total = 0.0;
    for (let i = 1; i < nPts; ++i) {
      const dx = pts[i].x - pts[i - 1].x;
      const dy = pts[i].y - pts[i - 1].y;
      const dz = pts[i].z - pts[i - 1].z;
      total += Math.sqrt(dx * dx + dy * dy + dz * dz);
      cum.push(total);
    }

    function sample(s) {
      let d = Math.min(Math.max(s, 0.0), total);
      let i = 1;
      while (i < nPts - 1 && cum[i] < d)
        ++i;
      const span = cum[i] - cum[i - 1];
      const t = span > 1e-9 ? (d - cum[i - 1]) / span : 0.0;
      const a = pts[i - 1];
      const b = pts[i];
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        z: a.z + (b.z - a.z) * t,
        yaw: Math.atan2(b.y - a.y, b.x - a.x)
      };
    }

    // in-plane normal of the path at point i (averaged over the adjacent segments)
    function normalAt(i) {
      let dx = 0.0, dy = 0.0;
      if (i > 0) {
        dx += pts[i].x - pts[i - 1].x;
        dy += pts[i].y - pts[i - 1].y;
      }
      if (i < nPts - 1) {
        dx += pts[i + 1].x - pts[i].x;
        dy += pts[i + 1].y - pts[i].y;
      }
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-9)
        return {x: 0.0, y: 1.0};
      return {x: -dy / len, y: dx / len};
    }

    const poleCount = ok ? Math.min(600, Math.max(2, Math.floor(total / poleGap) + 1)) : 0;
    const poleStep = poleCount > 1 ? total / (poleCount - 1) : 0.0;

    // ---- horizontal bars: sweep the 2D cross-section along the path ------
    let cs = [];
    const rawShape = fields.horizontalBarShape.value;
    for (let i = 0; i < rawShape.length; ++i)
      cs.push({u: rawShape[i].x, v: rawShape[i].y});
    if (cs.length > 2) {
      const f0 = cs[0];
      const l0 = cs[cs.length - 1];
      if (Math.abs(f0.u - l0.u) < 1e-9 && Math.abs(f0.v - l0.v) < 1e-9)
        cs.pop();
    }
    let csArea = 0.0;
    for (let i = 0; i < cs.length; ++i) {
      const p = cs[i];
      const q = cs[(i + 1) % cs.length];
      csArea += p.u * q.v - q.u * p.v;
    }
    if (csArea < 0.0)
      cs.reverse();
    const nCs = cs.length;

    const barZ = [];
    for (let j = 0; j < barsNumber; ++j) {
      if (barsNumber === 1)
        barZ.push(height * 0.9);
      else
        barZ.push(height * (0.25 + 0.7 * j / (barsNumber - 1)));
    }
    const bars = ok && barsNumber > 0 && nCs >= 3;
    const ring = nPts * nCs;   // vertices per bar level
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model IS model
    recognitionColors IS recognitionColors
    children [
    %< if (bars) { >%
      DEF FENCE_BARS Shape {
        appearance IS horizontalBarAppearance
        geometry IndexedFaceSet {
          coord Coordinate {
            point [
            %< for (let j = 0; j < barsNumber; ++j) { >%
            %<   for (let i = 0; i < nPts; ++i) { >%
            %<     const nrm = normalAt(i); >%
            %<     for (let k = 0; k < nCs; ++k) { >%
              %<= r6(pts[i].x + cs[k].u * nrm.x) >% %<= r6(pts[i].y + cs[k].u * nrm.y) >% %<= r6(pts[i].z + barZ[j] + cs[k].v) >%
            %<     } >%
            %<   } >%
            %< } >%
            ]
          }
          coordIndex [
          %< for (let j = 0; j < barsNumber; ++j) { >%
          %<   const base = j * ring; >%
          %<   for (let i = 0; i < nPts - 1; ++i) { >%
          %<     for (let k = 0; k < nCs; ++k) { >%
          %<       const k2 = (k + 1) % nCs; >%
            %<= base + i * nCs + k >% %<= base + i * nCs + k2 >% %<= base + (i + 1) * nCs + k2 >% %<= base + (i + 1) * nCs + k >% -1
          %<     } >%
          %<   } >%
          %<   for (let k = 1; k < nCs - 1; ++k) { >%
            %<= base >% %<= base + k + 1 >% %<= base + k >% -1
          %<   } >%
          %<   const endBase = base + (nPts - 1) * nCs; >%
          %<   for (let k = 1; k < nCs - 1; ++k) { >%
            %<= endBase >% %<= endBase + k >% %<= endBase + k + 1 >% -1
          %<   } >%
          %< } >%
          ]
          creaseAngle IS creaseAngle
        }
      }
    %< } >%
    %< for (let p = 0; p < poleCount; ++p) { >%
    %<   const q = sample(p * poleStep); >%
    %<   const yaw = poleShape === 'diamond' ? q.yaw + Math.PI / 4 : q.yaw; >%
      Pose {
        translation %<= r6(q.x) >% %<= r6(q.y) >% %<= r6(q.z + 0.5 * height) >%
        rotation 0 0 1 %<= r6(yaw) >%
        children [
        %< if (p > 0) { >%
          USE FENCE_POLE
        %< } else if (poleShape === 'cylinder') { >%
          DEF FENCE_POLE Shape {
            appearance IS poleAppearance
            geometry Cylinder {
              radius %<= r6(poleRadius) >%
              height %<= r6(height) >%
              subdivision 12
            }
          }
        %< } else if (poleShape === 'H') { >%
          DEF FENCE_POLE Group {
            children [
              Pose {
                translation 0 %<= r6(0.85 * poleRadius) >% 0
                children [
                  Shape {
                    appearance IS poleAppearance
                    geometry Box {
                      size %<= r6(2.0 * poleRadius) >% %<= r6(0.3 * poleRadius) >% %<= r6(height) >%
                    }
                  }
                ]
              }
              Pose {
                translation 0 %<= r6(-0.85 * poleRadius) >% 0
                children [
                  Shape {
                    appearance IS poleAppearance
                    geometry Box {
                      size %<= r6(2.0 * poleRadius) >% %<= r6(0.3 * poleRadius) >% %<= r6(height) >%
                    }
                  }
                ]
              }
              Shape {
                appearance IS poleAppearance
                geometry Box {
                  size %<= r6(0.5 * poleRadius) >% %<= r6(1.7 * poleRadius) >% %<= r6(height) >%
                }
              }
            ]
          }
        %< } else { >%
          DEF FENCE_POLE Shape {
            appearance IS poleAppearance
            geometry Box {
              size %<= r6(2.0 * poleRadius) >% %<= r6(2.0 * poleRadius) >% %<= r6(height) >%
            }
          }
        %< } >%
        ]
      }
    %< } >%
    ]
    boundingObject IS boundingObject
  }
}
