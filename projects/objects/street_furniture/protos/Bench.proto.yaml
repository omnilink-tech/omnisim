# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Bench
  source: projects/objects/street_furniture/protos/Bench.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/street_furniture/protos/Bench.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: 'A park bench: pine boards bolted to a steel frame, 2.23 m long, with a reclined backrest.'
  extern_protos:
  - omnisim://projects/appearances/protos/OldSteel.proto
  - omnisim://projects/appearances/protos/RoughPine.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: bench
  - name: metalColor
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the metalic part.
  - name: woodColor
    type: SFColor
    access: field
    default: [0.5, 0.5, 0.5]
    hint: Defines the color of the wooden part.
  - name: recognitionColors
    type: MFColor
    access: field
    default:
    - 0.25
    - 0.17
    - .nan
    - 0.17
    - 0.17
    - 0.17
    hint: Is `Solid.recognitionColors`.
