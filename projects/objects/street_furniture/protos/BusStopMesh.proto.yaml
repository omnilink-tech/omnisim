# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BusStopMesh
  source: projects/objects/street_furniture/protos/BusStopMesh.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    description: 'The frame of a bus-stop shelter: four posts, a roof, a glazed back and end, and the light-box for a poster.  The
      structure, the poster box and the end glazing used to be baked meshes, and those meshes were not ours to redistribute.
      They have been rebuilt from primitives here, keeping the envelope the old ones had (8.9 x 5.3 on plan, 5.2 tall, in
      the same y-up frame the roof and the rear glass were already written in) so anything that placed this node still gets
      a shelter of the same size in the same place. The shelter that actually ships is BusStop.proto, which builds itself
      from primitives and does not use this node; this one is kept because it is part of the public surface.'
    tags: [hidden]
  extern_protos: []
  fields:
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColor 0.3 0.45 0.33 metalness 0 roughness 0.6 }
