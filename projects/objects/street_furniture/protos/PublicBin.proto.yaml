# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PublicBin
  source: projects/objects/street_furniture/protos/PublicBin.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/street_furniture/protos/PublicBin.proto
    keywords: [exterior/street furniture]
    description: 'An open park litter bin: a ground plate, a short stem and a colourable open-top basket.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: public bin
  - name: color
    type: SFColor
    access: field
    default: [0.27, 0.27, 0.27]
    hint: Defines the color of the bin.
  - name: recognitionColors
    type: MFColor
    access: field
    default:
    - 0.27
    - 0.27
    - 0.27
    hint: Is `Solid.recognitionColors`.
