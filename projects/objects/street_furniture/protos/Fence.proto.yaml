# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Fence
  source: projects/objects/street_furniture/protos/Fence.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/street_furniture/protos/Fence.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: 'A parametric fence: poles of a chosen profile spaced along a 3D path, tied together by any number of horizontal
      bars. The bars are swept from the 2D `horizontalBarShape` cross-section along the path, and the path itself can be smoothed
      with a Catmull-Rom spline (`subdivision`).'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: fence
  - name: model
    type: SFString
    access: field
    default: fence
  - name: recognitionColors
    type: MFColor
    access: field
    default:
    - 0.8
    - 0.8
    - 0.8
  - name: height
    type: SFFloat
    access: field
    default: 1.5
    hint: Defines the height of the fence.
  - name: poleGap
    type: SFFloat
    access: field
    default: 0.5
    hint: Defines the distance between two consecutives poles.
  - name: poleRadius
    type: SFFloat
    access: field
    default: 0.04
    hint: Defines the radius of the poles.
  - name: poleShape
    type: SFString
    access: field
    default: cylinder
    hint: Defines the shape of the poles.
    enum: [cylinder, square, diamond, H]
  - name: poleAppearance
    type: SFNode
    access: field
    default: PBRAppearance { }
    hint: Defines the appearance of the poles.
  - name: path
    type: MFVec3f
    access: field
    default:
    - 0
    - 0
    - .nan
    - 0
    - 5
    - 0
    hint: Defines the 3D path of the fence.
  - name: subdivision
    type: SFInt32
    access: field
    default: -1
    hint: Defines the degree of interpolation using B-Splines (if the value is lower than 0, the interpolation is disabled).
  - name: horizontalBarsNumber
    type: SFInt32
    access: field
    default: 2
    hint: Defines the number of horizontal bars.
  - name: horizontalBarShape
    type: MFVec2f
    access: field
    default:
    - 0.02
    - .nan
    - 0.02
    - .nan
    - -0.02
    - .nan
    - -0.02
    - .nan
    - 0.02
    - 0.06
    hint: Defines the shape 2D of the horizontal bars.
  - name: horizontalBarAppearance
    type: SFNode
    access: field
    default: PBRAppearance { }
    hint: Defines the appearance of the horizontal bars.
  - name: boundingObject
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.boundingObject`.
  - name: creaseAngle
    type: SFFloat
    access: field
    default: 0.3
    hint: Defines the creaseAngle of the horizontal bar.
  - name: appearance
    type: SFNode
    access: hiddenField
    default: null
    hint: For backward compatibility warning.
