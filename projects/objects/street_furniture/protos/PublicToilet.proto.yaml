# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PublicToilet
  source: projects/objects/street_furniture/protos/PublicToilet.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/street_furniture/protos/PublicToilet.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: 'A resizable self-cleaning public-toilet kiosk built from primitives: a soft-cornered cabin with a door on
      one end, a back-lit display panel on the rear face, and an advertising board on the front.'
  extern_protos:
  - omnisim://projects/objects/advertising_board/protos/AdvertisingBoard.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: public toilet
  - name: height
    type: SFFloat
    access: field
    default: 3.2
    hint: Defines the height of the toilet.
  - name: length
    type: SFFloat
    access: field
    default: 2.1
    hint: Defines the length of the toilet.
  - name: width
    type: SFFloat
    access: field
    default: 3.5
    hint: Defines the width of the toilet.
  - name: backDisplayTexture
    type: MFString
    access: field
    default:
    - omnisim://projects/default/worlds/textures/omnisim_billboard.png
    hint: Defines the texture used on the back display.
  - name: backDisplayLight
    type: SFBool
    access: field
    default: false
    hint: Defines whether the back display should have emissive color.
  - name: frontDisplay
    type: MFNode
    access: field
    default: '[ AdvertisingBoard { translation 0 0.1 -0.55 frontTexture [ "omnisim://projects/default/worlds/textures/omnisim_billboard.png"
      ] backTexture [ ] displayBackLight FALSE displayWidth 0.9 displayHeight 0.9 frameThickness 0.1 } ]'
