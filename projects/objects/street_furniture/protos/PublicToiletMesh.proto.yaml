    description: 'The shell of a self-cleaning public-toilet kiosk, as a bare geometry node.  This PROTO used to be nothing
      but a baked mesh, and that mesh was not ours to redistribute. It has been replaced with a constructed one: a soft-cornered
      prism, generated here, occupying the same envelope the old mesh did -- 3.1 m x 5.1 m on the ground, 5.0 m tall, about
