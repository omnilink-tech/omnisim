# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BusStop
  source: projects/objects/street_furniture/protos/BusStop.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/street_furniture/protos/BusStop.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: 'A bus-stop shelter built from primitives: four posts, a roof slab, a glazed rear panel, an end light-box
      carrying an advertising poster on each face, and an optional bench.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
  - name: name
    type: SFString
    access: field
    default: bus stop
  - name: bench
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bust stop should include a bench.
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColor 0.3 0.45 0.33 metalness 0 roughness 0.5 }
    hint: Defines the appearance of the bench.
  - name: internalAdvertisingTexture
    type: MFString
    access: field
    default:
    - textures/advertising.jpg
    hint: Defines the texture used for the internal advertising.
  - name: externalAdvertisingTexture
    type: MFString
    access: field
    default:
    - textures/advertising.jpg
    hint: Defines the texture used for the external advertising.
  - name: advertisingLightOn
    type: SFBool
    access: field
    default: true
    hint: Defines whether the advertising should have an emissive color.
