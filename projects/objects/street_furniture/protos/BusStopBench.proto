# tags: hidden
# The bench that goes inside a bus-stop shelter: a slatted seat and back, carried on a frame at each end.
#
# The seat and the end frames used to be baked meshes, and those meshes were not ours to
# redistribute. They are rebuilt from primitives here, keeping the envelope the old ones had -- a
# 5.1 long seat on frames at each end, in the same y-up frame the bounding boxes were already
# written in -- so anything that placed this node still gets a bench of the same size in the same
# place.
# The shelter that actually ships is BusStop.proto, which builds its own bench and does not use
# this node; this one is kept because it is part of the public surface.
# template language: javascript

EXTERNPROTO "omnisim://projects/appearances/protos/RoughPine.proto"

PROTO BusStopBench [
  field SFString name       "bus stop bench"
  field SFVec3f  scale      1 1 1
  field SFNode   appearance PBRAppearance { baseColor 0.3 0.45 0.33 metalness 0 }   # Defines the appreance of the bench.
]
{
  %<
    // NOTE the frame: y is UP here, x runs along the bench and z across it. That is not the
    // convention the rest of the library uses -- it is the one this node was modelled in, and it
    // is kept so what replaces the old mesh lands exactly where the old mesh was.
    const s = fields.scale.value;

    const length = 5.1;     // the run of the bench, along x
    const midX = -1.19;     // it was never centred on its own origin
    const seatY = -1.85;    // how high the seat sits
    const seatZ = -1.04;    // and how far back
    const seatDepth = 0.6;

    const endX = [1.2, -3.6];  // where the two end frames stand
    const footY = -2.33;       // the ground
    const topY = -1.12;        // the top of the frames, just above the seat

    function r6(v) {
      return Math.round(v * 1e6) / 1e6;
    }
  >%
  Group {
    children [
      DEF BENCH Solid {
        children [
          Transform {
            scale IS scale
            children [
              # --- the seat: three slats, which is what makes it read as a
              #     slatted bench rather than as a plank ----------------------
              %< for (let i = -1; i <= 1; ++i) { >%
              Pose {
                translation %<= midX >% %<= seatY >% %<= r6(seatZ + i * 0.21) >%
                children [
                %< if (i === -1) { >%
                  DEF BENCH_SLAT Shape {
                    appearance RoughPine {
                      textureTransform TextureTransform {
                        scale 2 2
                      }
                    }
                    geometry Box {
                      size %<= length >% 0.06 0.17
                    }
                  }
                %< } else { >%
                  USE BENCH_SLAT
                %< } >%
                ]
              }
              %< } >%
              # --- the back: two more slats, raked off the vertical -----------
              %< for (let i = 0; i <= 1; ++i) { >%
              Pose {
                translation %<= midX >% %<= r6(-1.62 + i * 0.26) >% %<= r6(-1.34 - i * 0.04) >%
                rotation 1 0 0 -0.15
                children [
                %< if (i === 0) { >%
                  DEF BENCH_BACK_SLAT Shape {
                    appearance RoughPine {
                      textureTransform TextureTransform {
                        scale 2 2
                      }
                    }
                    geometry Box {
                      size %<= length >% 0.22 0.06
                    }
                  }
                %< } else { >%
                  USE BENCH_BACK_SLAT
                %< } >%
                ]
              }
              %< } >%
            ]
          }
          # --- the frame at each end: an upright, an arm under the seat, a foot
          %< for (let e = 0; e < endX.length; ++e) { >%
          Transform {
            translation %<= r6(s.x * endX[e]) >% 0 0
            scale IS scale
            children [
            %< if (e === 0) { >%
              DEF BENCH_HOLDER Group {
                children [
                  Pose {
                    translation 0 %<= r6(0.5 * (footY + topY)) >% -1.2
                    children [
                      Shape {
                        appearance IS appearance
                        geometry Box {
                          size 0.11 %<= r6(topY - footY) >% 0.09
                        }
                      }
                    ]
                  }
                  Pose {
                    translation 0 %<= r6(seatY - 0.08) >% %<= r6(seatZ + 0.06) >%
                    children [
                      Shape {
                        appearance IS appearance
                        geometry Box {
                          size 0.11 0.09 %<= r6(seatDepth + 0.12) >%
                        }
                      }
                    ]
                  }
                  Pose {
                    translation 0 %<= r6(footY + 0.04) >% %<= r6(seatZ - 0.1) >%
                    children [
                      Shape {
                        appearance IS appearance
                        geometry Box {
                          size 0.11 0.08 %<= r6(seatDepth + 0.3) >%
                        }
                      }
                    ]
                  }
                ]
              }
            %< } else { >%
              USE BENCH_HOLDER
            %< } >%
            ]
          }
          %< } >%
        ]
        name IS name
        model "bus stop bench"
        boundingObject Group {
          children [
            DEF BENCH_SEAT_BOX Pose {
              translation %<= r6(s.x * midX) >% %<= r6(s.y * seatY) >% %<= r6(s.z * seatZ) >%
              children [
                Box {
                  size %<= r6(s.x * length) >% %<= r6(s.y * 0.1) >% %<= r6(s.z * seatDepth) >%
                }
              ]
            }
            DEF BENCH_BACK_BOX Pose {
              translation %<= r6(s.x * midX) >% %<= r6(s.y * -1.46) >% %<= r6(s.z * -1.38) >%
              rotation 1 0 0 -0.15
              children [
                Box {
                  size %<= r6(s.x * length) >% %<= r6(s.y * 0.69) >% %<= r6(s.z * 0.1) >%
                }
              ]
            }
          ]
        }
      }
    ]
  }
}
