# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Book
  source: projects/objects/school_furniture/protos/Book.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/school_furniture/protos/Book.proto
    keywords: [interior/office]
    description: 'A hardback book standing on its spine: two textured covers, a page block and a spine. The origin sits at
      the centre of the book.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.1]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: book
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the book.
  - name: textureUrl
    type: MFString
    access: field
    default:
    - textures/book.jpg
    hint: Defines the texture used for the book.
  - name: mass
    type: SFFloat
    access: field
    default: 0.3
    hint: Defines the mass of the book in kg.
