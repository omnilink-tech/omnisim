# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: OilBarrel
  source: projects/objects/obstacles/protos/OilBarrel.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/obstacles/protos/OilBarrel.proto
    keywords: [industrial/container]
    template_language: javascript
    description: 'A resizable steel drum: a rusted cylinder banded by two rolling hoops, with a filler cap on the lid. Static
      scenery by default; give it a `physics` node to let robots knock it over.'
  extern_protos:
  - omnisim://projects/appearances/protos/RustyMetal.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.44]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: oil barrel
  - name: height
    type: SFFloat
    access: field
    default: 0.88
    hint: Defines the height of the barrel.
  - name: radius
    type: SFFloat
    access: field
    default: 0.305
    hint: Defines the radius of the barrel.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
  - name: immersionProperties
    type: MFNode
    access: field
    default: []
    hint: Is `Solid.immersionProperties`.
