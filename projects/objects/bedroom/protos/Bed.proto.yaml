# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Bed
  source: projects/objects/bedroom/protos/Bed.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/bedroom/protos/Bed.proto
    keywords: [interior/bedroom]
    description: 'A 2.1 x 1.5 m double bed built from boxes: a legged frame with a headboard and a footboard, a mattress,
      two pairs of pillows and a duvet folded over the foot half. The origin sits on the floor, at the centre of the frame.'
  extern_protos:
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  - omnisim://projects/appearances/protos/PaintedWood.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: bed
  - name: frameAppearance
    type: SFNode
    access: field
    default: PaintedWood { colorOverride 0.11 0.11 0.11 }
    hint: Defines the appearance of the frame.
  - name: mattressAppearance
    type: SFNode
    access: field
    default: PBRAppearance { roughness 1 metalness 0 }
    hint: Defines the appearance of the mattress.
  - name: pillowAppearance
    type: SFNode
    access: field
    default: PBRAppearance { roughness 1 metalness 0 }
    hint: Defines the appearance of the pillows.
  - name: blanketAppearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColorMap ImageTexture { url "Bed/textures/duvet.jpg" } roughness 1 metalness 0 }
    hint: Defines the appearance of the blanket.
