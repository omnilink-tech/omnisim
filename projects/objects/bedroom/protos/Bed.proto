# keywords: interior/bedroom
# A 2.1 x 1.5 m double bed built from boxes: a legged frame with a headboard and a footboard, a mattress, two pairs of pillows and a duvet folded over the foot half. The origin sits on the floor, at the centre of the frame.

EXTERNPROTO "omnisim://projects/appearances/protos/BrushedAluminium.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/PaintedWood.proto"

PROTO Bed [
  field SFVec3f    translation        0 0 0
  field SFRotation rotation           0 0 1 0
  field SFString   name               "bed"
  field SFNode     frameAppearance    PaintedWood { colorOverride 0.11 0.11 0.11 }                                                      # Defines the appearance of the frame.
  field SFNode     mattressAppearance PBRAppearance { roughness 1 metalness 0 }                                                         # Defines the appearance of the mattress.
  field SFNode     pillowAppearance   PBRAppearance { roughness 1 metalness 0 }                                                         # Defines the appearance of the pillows.
  field SFNode     blanketAppearance  PBRAppearance { baseColorMap ImageTexture { url "Bed/textures/duvet.jpg" } roughness 1 metalness 0 }  # Defines the appearance of the blanket.
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    children [
      # ---------------------------------------------------------------- frame
      # four legs
      Pose {
        translation 0.99 0.69 0.075
        children [
          DEF BED_LEG Shape {
            appearance IS frameAppearance
            geometry Box {
              size 0.1 0.1 0.15
            }
          }
        ]
      }
      Pose {
        translation 0.99 -0.69 0.075
        children [
          USE BED_LEG
        ]
      }
      Pose {
        translation -0.99 0.69 0.075
        children [
          USE BED_LEG
        ]
      }
      Pose {
        translation -0.99 -0.69 0.075
        children [
          USE BED_LEG
        ]
      }
      # slatted base
      Pose {
        translation 0 0 0.21
        children [
          Shape {
            appearance IS frameAppearance
            geometry Box {
              size 2.1 1.5 0.12
            }
          }
        ]
      }
      # headboard (-x) and footboard (+x)
      Pose {
        translation -1.02 0 0.55
        children [
          Shape {
            appearance IS frameAppearance
            geometry Box {
              size 0.06 1.5 0.8
            }
          }
        ]
      }
      Pose {
        translation 1.02 0 0.35
        children [
          Shape {
            appearance IS frameAppearance
            geometry Box {
              size 0.06 1.5 0.4
            }
          }
        ]
      }
      # the two chromed screw caps that hold the headboard on
      Pose {
        translation -0.985 0.55 0.75
        rotation 0 1 0 1.5708
        children [
          DEF BED_SCREW Shape {
            appearance BrushedAluminium {
            }
            geometry Cylinder {
              radius 0.012
              height 0.01
              subdivision 12
            }
          }
        ]
      }
      Pose {
        translation -0.985 -0.55 0.75
        rotation 0 1 0 1.5708
        children [
          USE BED_SCREW
        ]
      }
      # ------------------------------------------------------------- mattress
      Pose {
        translation 0 0 0.38
        children [
          Shape {
            appearance IS mattressAppearance
            geometry Box {
              size 1.95 1.42 0.22
            }
          }
        ]
      }
      # -------------------------------------------------------------- pillows
      # back pillows, propped a little against the headboard
      Pose {
        translation -0.82 0.33 0.56
        rotation 0 1 0 -0.35
        children [
          DEF BED_BACK_PILLOW Shape {
            appearance IS pillowAppearance
            geometry Box {
              size 0.2 0.52 0.14
            }
          }
        ]
      }
      Pose {
        translation -0.82 -0.33 0.56
        rotation 0 1 0 -0.35
        children [
          USE BED_BACK_PILLOW
        ]
      }
      # front pillows, lying flat on the mattress
      Pose {
        translation -0.6 0.33 0.55
        children [
          DEF BED_FRONT_PILLOW Shape {
            appearance IS pillowAppearance
            geometry Box {
              size 0.28 0.55 0.12
            }
          }
        ]
      }
      Pose {
        translation -0.6 -0.33 0.55
        children [
          USE BED_FRONT_PILLOW
        ]
      }
      # -------------------------------------------------------------- blanket
      # the duvet covers the foot half of the mattress and hangs over both sides
      Pose {
        translation 0.34 0 0.525
        children [
          Shape {
            appearance IS blanketAppearance
            geometry Box {
              size 1.3 1.52 0.07
            }
          }
        ]
      }
      Pose {
        translation 0.34 0.755 0.4
        children [
          DEF BED_BLANKET_DRAPE Shape {
            appearance IS blanketAppearance
            geometry Box {
              size 1.3 0.03 0.2
            }
          }
        ]
      }
      Pose {
        translation 0.34 -0.755 0.4
        children [
          USE BED_BLANKET_DRAPE
        ]
      }
    ]
    name IS name
    model "bed"
    boundingObject Group {
      children [
        Pose {
          translation 0 0 0.28
          children [
            Box {
              size 2.1 1.5 0.56
            }
          ]
        }
        Pose {
          translation -1.02 0 0.55
          children [
            Box {
              size 0.06 1.5 0.8
            }
          ]
        }
      ]
    }
    locked TRUE
  }
}
