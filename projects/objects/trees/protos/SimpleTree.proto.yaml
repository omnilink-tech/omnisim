# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SimpleTree
  source: projects/objects/trees/protos/SimpleTree.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/trees/protos/SimpleTree.proto
    keywords: [exterior/tree]
    template_language: javascript
    description: 'A cheap, fully procedural outdoor tree: a tapered trunk carrying a crown whose shape and colour are picked
      from the tree type (a rounded canopy for broadleaves, a cone for conifers, a flat fan for the palm). Tree types are:
      - ''oak tree'' - ''crab apple tree'' - ''cherry tree'' - ''birch tree'' - ''palm tree'' - ''spruce'' - ''white pine''
      - ''hackberry tree'' - ''hazel tree''  The ''random'' type choose randomly a tree type each time the node is regenerated.'
    tags: [nonDeterministic]
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: tree
    hint: Defines the name of the tree.
  - name: type
    type: SFString
    access: field
    default: cherry tree
    hint: Defines the texture to be used. If set to `random`, a type will be randomly selected in the list.
    enum: [random, oak tree, crab apple tree, cherry tree, birch tree, palm tree, spruce, white pine, hackberry tree, hazel
        tree]
  - name: withSnow
    type: SFBool
    access: field
    default: false
    hint: Defines if the texture used should have snow on top.
  - name: height
    type: SFFloat
    access: field
    default: 4.0
    hint: Defines the height of the tree.
  - name: radius
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the radius of the tree.
  - name: subdivision
    type: SFInt32
    access: field
    default: 2
    hint: Defines the number of faces used to represent the tree.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines if the tree should have a bounding object (the bounding object is made of a simple cylinder).
  - name: locked
    type: SFBool
    access: field
    default: true
    hint: Is `Solid.locked`.
  - name: isPickable
    type: SFBool
    access: field
    default: true
