# documentation url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/trees/protos/SimpleTree.proto
# tags: nonDeterministic
# keywords: exterior/tree
# A cheap, fully procedural outdoor tree: a tapered trunk carrying a crown whose shape and colour are picked from the tree type (a rounded canopy for broadleaves, a cone for conifers, a flat fan for the palm).
# Tree types are:
#  - 'oak tree'
#  - 'crab apple tree'
#  - 'cherry tree'
#  - 'birch tree'
#  - 'palm tree'
#  - 'spruce'
#  - 'white pine'
#  - 'hackberry tree'
#  - 'hazel tree'
#
# The 'random' type choose randomly a tree type each time the node is regenerated.
# template language: javascript

PROTO SimpleTree [
  field SFVec3f    translation          0 0 0
  field SFRotation rotation             0 0 1 0
  field SFString   name                 "tree"          # Defines the name of the tree.
  field SFString{"random", "oak tree", "crab apple tree", "cherry tree", "birch tree", "palm tree", "spruce", "white pine", "hackberry tree", "hazel tree"}
                   type                 "cherry tree"   # Defines the texture to be used. If set to `random`, a type will be randomly selected in the list.
  field SFBool     withSnow             FALSE           # Defines if the texture used should have snow on top.
  field SFFloat    height               4               # Defines the height of the tree.
  field SFFloat    radius               2               # Defines the radius of the tree.
  field SFInt32    subdivision          2               # Defines the number of faces used to represent the tree.
  field SFBool     enableBoundingObject TRUE            # Defines if the tree should have a bounding object (the bounding object is made of a simple cylinder).
  field SFBool     locked               TRUE            # Is `Solid.locked`.
  field SFBool     isPickable           TRUE
]
{
%<
  import * as wbrandom from 'wbrandom.js';
  wbrandom.seed(context.id)

  // ---------------------------------------------------------------------
  // The species table. Each entry says how the tree is built:
  //   crown        'round' (ellipsoid canopy) | 'cone' (conifer) | 'fan' (palm)
  //   trunkPart    fraction of the total height taken by the bare trunk
  //   trunkColor   bark colour
  //   crownColor   foliage / blossom colour
  //   slenderness  trunk radius as a fraction of the crown radius
  // ---------------------------------------------------------------------
  const species = {
    'oak tree':        {crown: 'round', trunkPart: 0.40, trunkColor: [0.31, 0.24, 0.17], crownColor: [0.20, 0.36, 0.12], slenderness: 0.075},
    'crab apple tree': {crown: 'round', trunkPart: 0.38, trunkColor: [0.34, 0.25, 0.19], crownColor: [0.85, 0.49, 0.57], slenderness: 0.055},
    'cherry tree':     {crown: 'round', trunkPart: 0.42, trunkColor: [0.33, 0.24, 0.20], crownColor: [0.90, 0.70, 0.76], slenderness: 0.055},
    'birch tree':      {crown: 'round', trunkPart: 0.50, trunkColor: [0.82, 0.80, 0.75], crownColor: [0.42, 0.56, 0.20], slenderness: 0.040},
    'palm tree':       {crown: 'fan',   trunkPart: 0.78, trunkColor: [0.45, 0.37, 0.26], crownColor: [0.22, 0.45, 0.16], slenderness: 0.045},
    'spruce':          {crown: 'cone',  trunkPart: 0.12, trunkColor: [0.30, 0.22, 0.16], crownColor: [0.11, 0.28, 0.14], slenderness: 0.060},
    'white pine':      {crown: 'cone',  trunkPart: 0.18, trunkColor: [0.34, 0.26, 0.20], crownColor: [0.19, 0.38, 0.27], slenderness: 0.055},
    'hackberry tree':  {crown: 'round', trunkPart: 0.44, trunkColor: [0.35, 0.30, 0.24], crownColor: [0.25, 0.42, 0.15], slenderness: 0.060},
    'hazel tree':      {crown: 'round', trunkPart: 0.24, trunkColor: [0.36, 0.28, 0.20], crownColor: [0.38, 0.50, 0.16], slenderness: 0.045}
  };

  let height = fields.height.value;
  if (height <= 0) {
    height = fields.height.defaultValue;
    console.error('\'height\' must be strictly positive. Value reset to ' + height + '.');
  }

  let radius = fields.radius.value;
  if (radius <= 0) {
    radius = fields.radius.defaultValue;
    console.error('\'radius\' must be strictly positive. Value reset to ' + radius + '.');
  }

  let subdivision = fields.subdivision.value;
  if (subdivision < 2) {
    subdivision = fields.subdivision.defaultValue;
    console.error('\'subdivision\' must be bigger or equal to 2. Value reset to ' + subdivision + '.');
  }

  let type = fields.type.value;
  const keys = Object.keys(species);
  if (type !== 'random' && !species.hasOwnProperty(type)) {
    type = fields.type.defaultValue;

    let candidates = '';
    for (let i = 0; i < keys.length; ++i)
      candidates += '\'' + keys[i] + '\', ';
    candidates += 'or \'random\'';
    console.error('\'type\' must be a value in the list: ' + candidates + '. Value reset to \'' + type + '\'.');
  } else if (type === 'random')
    type = keys[wbrandom.integer(keys.length) - 1];

  const tree = species[type];
  const snow = fields.withSnow.value;

  // Snow does not repaint the tree, it settles on it: wash the foliage most of
  // the way towards white and leave the bark alone.
  const paint = function(rgb, towardsWhite) {
    if (!towardsWhite)
      return rgb;
    return [rgb[0] + (0.93 - rgb[0]) * 0.78, rgb[1] + (0.94 - rgb[1]) * 0.78, rgb[2] + (0.95 - rgb[2]) * 0.78];
  };
  const trunkColor = tree.trunkColor;
  const crownColor = paint(tree.crownColor, snow);

  // `subdivision` is a coarseness knob, not a polygon count: keep the tree cheap
  // (a forest may hold hundreds of them) but never let it fall below a triangle.
  const facets = Math.max(6, subdivision * 4);

  // Vertical layout. The crown starts a little below the top of the bare trunk
  // so the two never separate, and always tops out at exactly `height`.
  const trunkHeight = height * tree.trunkPart;
  const crownBase = trunkHeight * (tree.crown === 'fan' ? 0.97 : 0.72);
  const crownHeight = Math.max(0.05 * height, height - crownBase);
  const crownCenter = crownBase + 0.5 * crownHeight;
  const trunkRadius = Math.max(0.02, radius * tree.slenderness);

  // A palm's fronds splay out flat rather than filling a ball.
  const crownFlatten = tree.crown === 'fan' ? 0.30 : 1.0;
>%
Solid {
  translation IS translation
  rotation IS rotation
  children [
    DEF TRUNK Pose {
      translation 0 0 %<= 0.5 * trunkHeight >%
      children [
        Shape {
          appearance PBRAppearance {
            baseColor %<= trunkColor[0] >% %<= trunkColor[1] >% %<= trunkColor[2] >%
            metalness 0
            roughness 1
          }
          geometry Cylinder {
            height %<= trunkHeight >%
            radius %<= trunkRadius >%
            subdivision %<= facets >%
            top FALSE
          }
          isPickable IS isPickable
        }
      ]
    }
    DEF CROWN Transform {
      translation 0 0 %<= crownCenter >%
      # the cone is already built to size; the canopy sphere gets squashed into
      # the crown's own height envelope (and squashed flat again for a palm)
      scale 1 1 %<= tree.crown === 'cone' ? 1 : (0.5 * crownHeight * crownFlatten) / radius >%
      children [
        Shape {
          appearance PBRAppearance {
            baseColor %<= crownColor[0] >% %<= crownColor[1] >% %<= crownColor[2] >%
            metalness 0
            roughness 1
          }
          %< if (tree.crown === 'cone') { >%
          geometry Cone {
            bottomRadius %<= radius >%
            height %<= crownHeight >%
            subdivision %<= facets >%
          }
          %< } else { >%
          geometry Sphere {
            radius %<= radius >%
            subdivision %<= facets >%
            ico FALSE
          }
          %< } >%
          isPickable IS isPickable
        }
      ]
    }
  ]
  name IS name
  model %<= '"' + type + '"' >%
  recognitionColors [
    %< if (snow) { >%
      0.82 0.82 0.84
    %< } else { >%
      %< if (type === 'crab apple tree') { >%
        0.85 0.49 0.57
      %< } else { >%
        0.1 0.4 0
      %< } >%
    %< } >%
  ]
  %< if (fields.enableBoundingObject.value) { >%
    boundingObject Pose {
      translation 0 0 %<= height * 0.5 >%
      children [
        Cylinder {
          height %<= height >%
          radius 0.1
        }
      ]
    }
  %< } >%
  locked IS locked
}
}
