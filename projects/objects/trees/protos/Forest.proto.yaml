# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Forest
  source: projects/objects/trees/protos/Forest.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    keywords: [exterior/tree]
    template_language: javascript
    description: 'A procedural forest: trees are either read from position files (`treesFiles`) or scattered at `density`
      trees per square metre inside the polygon given by `shape`. Every tree is built from primitives (a tapered trunk plus
      a rounded, conical or splayed crown, picked from its species) and instanced with DEF/USE, so a few hundred trees stay
      cheap. An optional textured ground sheet is laid over the polygon. Tree types are: - ''oak tree'' - ''crab apple tree''
      - ''cherry tree'' - ''birch tree'' - ''palm tree'' - ''spruce'' - ''white pine'' - ''hackberry tree'' - ''hazel tree''  The
      ''random'' type mixes the species over the whole forest.'
    tags: [nonDeterministic]
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: treesFiles
    type: MFString
    access: field
    default: []
    hint: Can be used to define the paths to several files in which are defined the positions of the trees (one tree per line,
      using the format 'X, Y, Z'). The path to these files must be defined with respect to the world file.
  - name: shape
    type: MFVec2f
    access: field
    default:
    - -20
    - .nan
    - 20
    - .nan
    - 0
    - 25
    hint: Alternatively, the position of each trees can be defined using the shape field. This field defines the shape of
      the forest, in that case the position of the trees is randomly generated from this shape.
  - name: density
    type: SFFloat
    access: field
    default: 0.2
    hint: If the forest is defined using the `shape` field, this field defines the density of three to be generated (in trees
      per meter square).
  - name: type
    type: SFString
    access: field
    default: random
    hint: Defines the type of threes, in case of `random` type, the forest will be mixed.
    enum: [random, oak tree, crab apple tree, cherry tree, birch tree, palm tree, spruce, white pine, hackberry tree, hazel
        tree]
  - name: randomSeed
    type: SFInt32
    access: field
    default: 0
    hint: Defines the seed of the random number generator. A value of 0 sets the seed to the node id and a value smaller than
      0 sets a time based random seed.
  - name: groundTexture
    type: MFString
    access: field
    default:
    - textures/dry_leaf.jpg
    hint: Defines the texture of the forest ground. If this field is empty the forest ground is not displayed.
  - name: withSnow
    type: SFBool
    access: field
    default: false
    hint: Defines whether the texture used should have snow on top.
  - name: maxHeight
    type: SFFloat
    access: field
    default: 6.0
    hint: Defines the maximum height of the trees.
  - name: minHeight
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the minimum height of the trees.
  - name: maxRadius
    type: SFFloat
    access: field
    default: 3.0
    hint: Defines the maximum radius of the trees.
  - name: minRadius
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the minimum radius of the trees.
