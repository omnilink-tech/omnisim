# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Tree
  source: projects/objects/trees/protos/Tree.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/trees/protos/Tree.proto
    keywords: [exterior/tree]
    description: 'A cheap billboard tree: two crossed alpha-cut quads carrying the tree texture, stretched to the requested
      radius and height by the `scale` field.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: tree
    hint: Defines the name of the tree.
  - name: scale
    type: SFVec3f
    access: field
    default: [1, 1, 4]
    hint: The first and middle components of the scale define the radius of the tree and the last one defines it's height.
  - name: texture
    type: MFString
    access: field
    default:
    - textures/cherry_tree.png
    hint: Defines the texture used for the tree.
  - name: boundingObject
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.boundingObject`.
  - name: locked
    type: SFBool
    access: field
    default: true
    hint: Is `Solid.locked`.
  - name: isPickable
    type: SFBool
    access: field
    default: true
