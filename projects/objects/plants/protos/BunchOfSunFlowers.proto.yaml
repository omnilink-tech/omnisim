# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BunchOfSunFlowers
  source: projects/objects/plants/protos/BunchOfSunFlowers.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/plants/protos/BunchOfSunFlowers.proto
    keywords: [interior/plant]
    description: 'A bunch of sunflowers in a terracotta pot: three green stems, each carrying a leaf tuft and an alpha-cut
      sunflower head made of crossed billboards. The origin sits on the floor, under the pot.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: bunch of sunflowers
  - name: flowerTextureUrl
    type: MFString
    access: field
    default:
    - textures/bunch_of_sun_flowers_flower.png
    hint: Defines the textures used for the flowers.
  - name: leavesTextureUrl
    type: MFString
    access: field
    default:
    - textures/bunch_of_sun_flowers_leaves.png
    hint: Defines the textures used for the leaves.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
