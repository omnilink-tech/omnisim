# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PottedTree
  source: projects/objects/plants/protos/PottedTree.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/plants/protos/PottedTree.proto
    keywords: [interior/plant]
    description: 'A 2 m indoor potted tree: a textured terracotta pot, a bark trunk and a crown made of crossed alpha-cut
      foliage billboards. The origin sits on the floor, under the pot.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: potted tree
  - name: potAndTreeColor
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the pot and the three.
  - name: potAndTreeTextureUrl
    type: MFString
    access: field
    default:
    - textures/potted_tree_pot_and_tree.jpg
    hint: Defines the textures used for of the pot and the three.
  - name: leavesColor
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the leaves.
  - name: leavesTextureUrl
    type: MFString
    access: field
    default:
    - textures/potted_tree_leaves.png
    hint: Defines the textures used for of the leaves.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
