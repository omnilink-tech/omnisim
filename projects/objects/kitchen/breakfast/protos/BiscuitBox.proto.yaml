# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BiscuitBox
  source: projects/objects/kitchen/breakfast/protos/BiscuitBox.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/kitchen/breakfast/protos/BiscuitBox.proto
    keywords: [household/kitchen]
    template_language: javascript
    description: 'A graspable carton of biscuits: a resizable cardboard box wrapped in the `textureUrl` artwork, with a tight
      bounding object and a mass-driven physics node. The origin sits under the box.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: biscuit box
  - name: size
    type: SFVec3f
    access: field
    default: [0.08, 0.24, 0.04]
    hint: Defines the size of the box.
  - name: textureUrl
    type: MFString
    access: field
    default:
    - textures/biscuit_box.jpg
    hint: Defines the texture used for the box.
  - name: mass
    type: SFFloat
    access: field
    default: 0.4
    hint: Defines the mass of the box in kg.
