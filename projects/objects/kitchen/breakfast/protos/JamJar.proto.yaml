# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: JamJar
  source: projects/objects/kitchen/breakfast/protos/JamJar.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/kitchen/breakfast/protos/JamJar.proto
    keywords: [household/kitchen]
    template_language: javascript
    description: 'A graspable jar of jam: a translucent glass cylinder holding a dark red preserve, closed by a screw lid
      wrapped in the `textureLidUrl` artwork. The origin sits under the jar.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: jam jar
  - name: textureLidUrl
    type: MFString
    access: field
    default:
    - textures/blue_jar_lid.jpg
    hint: Defines the texture used for the lid of the jar.
  - name: mass
    type: SFFloat
    access: field
    default: 0.5
    hint: Defines the mass of the jar in kg.
