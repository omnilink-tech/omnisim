# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Can
  source: projects/objects/drinks/protos/Can.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/drinks/protos/Can.proto
    keywords: [household/kitchen]
    description: 'A standard beverage can (63.5 mm across, 122.2 mm tall): a wrapped aluminium cylinder with a bare metal
      lid. A small, gripper-sized dynamic object for manipulation scenes.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.06]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: can
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
  - name: textureUrl
    type: MFString
    access: field
    default:
    - textures/can_base_color.jpg
