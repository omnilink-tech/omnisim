# A standard beverage can (63.5 mm across, 122.2 mm tall): a wrapped aluminium cylinder
# with a bare metal lid. A small, gripper-sized dynamic object for manipulation scenes.

PROTO Can [
  field SFVec3f translation 0 0 0.06
  field SFRotation rotation 0 0 1 0
  field SFString name "can"
  field SFColor color 1 1 1
  field MFString textureUrl "textures/can_base_color.jpg"
  field SFFloat mass 0.35
]
{
Solid {
  translation IS translation
  rotation IS rotation
  recognitionColors [ 0.666667 0 0 ]
  children [
    # The wrapped body. `color` tints the printed label, so leaving it white shows the
    # label artwork unaltered.
    Shape {
      appearance PBRAppearance {
        baseColor IS color
        baseColorMap ImageTexture {
          url IS textureUrl
        }
        roughnessMap ImageTexture {
          url "textures/can_roughness.jpg"
        }
        roughness 0.2
        metalness 0.8
      }
      geometry Cylinder {
        height 0.1222
        radius 0.03175
        subdivision 24
      }
    }
    # The lid: bare, unprinted aluminium, slightly narrower than the body and standing a
    # little proud of it, which is what gives a can its recognisable rim.
    Pose {
      translation 0 0 0.0631
      children [
        Shape {
          appearance PBRAppearance {
            baseColor 0.77 0.78 0.80
            roughness 0.35
            metalness 1
          }
          geometry Cylinder {
            height 0.006
            radius 0.0287
            subdivision 24
          }
        }
      ]
    }
  ]
  name IS name
  model "can"
  boundingObject Cylinder {
    height 0.1222
    radius 0.03175
    subdivision 20
  }
  physics Physics {
    density -1
    mass IS mass
  }
}
}
