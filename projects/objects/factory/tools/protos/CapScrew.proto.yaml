# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: CapScrew
  source: projects/objects/factory/tools/protos/CapScrew.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/tools/protos/CapScrew.proto
    keywords: [industrial/ironmongery]
    template_language: javascript
    description: 'A socket-head cap screw of configurable radius and length: a cylindrical head with a hex socket and a threaded
      shank. The shank runs along the local +x axis, the head sits at the origin.'
  extern_protos:
  - omnisim://projects/appearances/protos/OldSteel.proto
  - omnisim://projects/appearances/protos/ScrewThread.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.01]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: cap screw
  - name: appearance
    type: SFNode
    access: field
    default: OldSteel { }
    hint: Defines the appearance of the screw.
  - name: screwRadius
    type: SFFloat
    access: field
    default: 0.006
    hint: Defines the radius of the screw.
  - name: screwLength
    type: SFFloat
    access: field
    default: 0.05
    hint: Defines the length of the screw.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: enablePhysics
    type: SFBool
    access: field
    default: true
    hint: Defines whether the screw should have physics.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the screw should have a bounding object.
