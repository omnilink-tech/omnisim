# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PlatformCart
  source: projects/objects/factory/tools/protos/PlatformCart.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/tools/protos/PlatformCart.proto
    keywords: [industrial/cart]
    template_language: javascript
    description: 'A platform cart with overall dimensions 90Lx50Wx85H cm: a flat deck on four swivel casters with a tubular
      push handle. The `slot` field adds children at the deck surface.'
  extern_protos:
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: platform cart
  - name: slot
    type: MFNode
    access: field
    default: []
    hint: Extends the cart with new nodes in the slot.
  - name: physics
    type: SFNode
    access: field
    default: Physics { }
    hint: Is `Solid.physics`.
