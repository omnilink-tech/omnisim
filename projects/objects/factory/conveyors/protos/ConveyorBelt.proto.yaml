# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ConveyorBelt
  source: projects/objects/factory/conveyors/protos/ConveyorBelt.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/conveyors/protos/ConveyorBelt.proto
    keywords: [industrial/conveyor]
    template_language: javascript
    description: 'A parametric belt conveyor: a welded steel table carrying a rubber band that runs at a constant speed. The
      band is a Track whose LinearMotor device is named "belt_motor"; the bundled `conveyor_belt` controller drives it at
      `speed` m/s and stops it after `timer` seconds (0 = run forever).'
  extern_protos:
  - omnisim://projects/appearances/protos/CorrugatedMetal.proto
  - omnisim://projects/appearances/protos/Rubber.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: conveyor belt
  - name: window
    type: SFString
    access: field
    default: <none>
  - name: size
    type: SFVec3f
    access: field
    default: [1.5, 0.5, 0.6]
  - name: appearance
    type: SFNode
    access: field
    default: CorrugatedMetal { textureTransform TextureTransform { scale 2 2 } }
    hint: Defines the appearance of the conveyor belt.
  - name: borderThickness
    type: SFFloat
    access: field
    default: 0.03
    hint: Defines the thickness of the metal part around the conveyor belt.
  - name: borderHeight
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines the height of the border around the conveyor.
  - name: speed
    type: SFFloat
    access: field
    default: 0.5
    hint: Defines the rubber band speed in meters per second.
  - name: acceleration
    type: SFFloat
    access: field
    default: -1.0
    hint: Defines the acceleration of the conveyor belt.
  - name: timer
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines for how long the conveyor belt should move (it will move forever if set to 0).
