# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: WoodenPallet
  source: projects/objects/factory/pallet/protos/WoodenPallet.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/pallet/protos/WoodenPallet.proto
    keywords: [industrial/other]
    template_language: javascript
    description: 'A configurable EUR-style wooden pallet: a top deck of `lathNumber` laths, three stringers and three bottom
      deckboards. The origin is at the centre of its footprint, on the floor.'
  extern_protos:
  - omnisim://projects/appearances/protos/RoughPine.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: wooden pallet
  - name: size
    type: SFVec3f
    access: field
    default: [1.2, 0.8, 0.14]
    hint: Defines the size of the pallet.
  - name: lathNumber
    type: SFInt32
    access: field
    default: 6
    hint: Defines the number of lath of the pallet.
  - name: lathWidth
    type: SFFloat
    access: field
    default: 0.08
    hint: Defines the width of one lath.
  - name: mass
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the mass of the pallet in kg. A value smaller or equal to 0 remove the physics of the pallet.
  - name: boundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bounding object should be enabled.
  - name: locked
    type: SFBool
    access: field
    default: false
    hint: Is `Solid.locked`.
