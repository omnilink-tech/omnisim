# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: WoodenPalletStack
  source: projects/objects/factory/pallet/protos/WoodenPalletStack.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/pallet/protos/WoodenPalletStack.proto
    keywords: [industrial/other]
    template_language: javascript
    description: 'A stack of wooden pallets, each built from real slats: a top deck of `palletLathNumber` boards over three
      bearers over a three-runner bottom deck. Pallets are dealt onto the pile with a small random misalignment, so no two
      stacks in a warehouse look alike.'
    tags: [nonDeterministic]
  extern_protos:
  - omnisim://projects/appearances/protos/RoughPine.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: wooden pallet stack
  - name: palletNumber
    type: SFInt32
    access: field
    default: 8
    hint: Defines the number of pallet in the stack (vertically).
  - name: palletSize
    type: SFVec3f
    access: field
    default: [1.2, 0.8, 0.14]
    hint: Defines the size of one pallet.
  - name: palletLathNumber
    type: SFInt32
    access: field
    default: 6
    hint: Defines the number of lath of each pallets.
  - name: palletLathWidth
    type: SFFloat
    access: field
    default: 0.08
    hint: Defines the width of the pallet laths.
  - name: lateralMisalignment
    type: SFFloat
    access: field
    default: 0.1
    hint: Defines the maximum lateral misalignment between two pallets.
  - name: longitudinalMisalignment
    type: SFFloat
    access: field
    default: 0.05
    hint: Defines the maximum longitudinal misalignment between two pallets.
  - name: palletMass
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the mass of one pallet in kg. A value smaller or equal to 0 remove the physics of the stack.
  - name: boundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bounding object should be enabled.
  - name: locked
    type: SFBool
    access: field
    default: false
    hint: Is `Solid.locked`.
