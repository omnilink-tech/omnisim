# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PlasticCrate
  source: projects/objects/factory/containers/protos/PlasticCrate.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/containers/protos/PlasticCrate.proto
    keywords: [industrial/container]
    template_language: javascript
    description: 'A stackable plastic crate: a solid floor and four latticed walls (a rail top and bottom with ribs between),
      sitting on its base at z = 0.'
  extern_protos:
  - omnisim://projects/appearances/protos/MattePaint.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: plastic crate
  - name: size
    type: SFVec3f
    access: field
    default: [0.6, 0.6, 0.6]
  - name: color
    type: SFColor
    access: field
    default: [0.9, 0.2, 0.2]
  - name: mass
    type: SFFloat
    access: field
    default: 0.0
