# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: CardboardBox
  source: projects/objects/factory/containers/protos/CardboardBox.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/containers/protos/CardboardBox.proto
    keywords: [industrial/container]
    template_language: javascript
    description: 'A cardboard box: six thin corrugated panels, the top one hinged on the back edge so the box can be opened.'
  extern_protos:
  - omnisim://projects/appearances/protos/Cardboard.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.3]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: cardboard box
  - name: size
    type: SFVec3f
    access: field
    default: [0.6, 0.6, 0.6]
    hint: Defines the size of the cardboard box.
  - name: mass
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the mass of the cardboard box in kg. A value smaller or equal to 0 remove the physics of the cardboard box.
  - name: locked
    type: SFBool
    access: field
    default: false
    hint: Is `Solid.locked`.
  - name: lidAngle
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the opening of the cardboard box in radians. A value equal to 0 closes the box and uses a simple box for
      the bounding object, preventing it from containing objects.
