# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: WoodenBox
  source: projects/objects/factory/containers/protos/WoodenBox.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/containers/protos/WoodenBox.proto
    keywords: [industrial/container]
    template_language: javascript
    description: 'A wooden shipping crate: a resizable box finished in rough pine, static by default and dynamic as soon as
      a positive `mass` is given.'
  extern_protos:
  - omnisim://projects/appearances/protos/RoughPine.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.3]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: wooden box
  - name: size
    type: SFVec3f
    access: field
    default: [0.6, 0.6, 0.6]
    hint: Defines the size of the wooden box.
  - name: mass
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the mass of the wooden box in kg. A value smaller or equal to 0 remove the physics of the wooden box.
  - name: immersionProperties
    type: MFNode
    access: field
    default: []
    hint: Is `Solid.immersionProperties`.
  - name: locked
    type: SFBool
    access: field
    default: false
    hint: Is `Solid.locked`.
