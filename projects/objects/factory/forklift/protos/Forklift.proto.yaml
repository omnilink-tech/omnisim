# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Forklift
  source: projects/objects/factory/forklift/protos/Forklift.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/factory/forklift/protos/Forklift.proto
    keywords: [industrial/cart]
    template_language: javascript
    description: 'A counterbalance forklift truck built from primitives: chassis and counterweight, driver cage, a two-rail
      mast carrying a fork carriage, and four wheels. Origin is 0.81 m above the ground, so the truck rests on the floor when
      placed at `translation x y 0.81`.'
  extern_protos:
  - omnisim://projects/appearances/protos/GlossyPaint.proto
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  - omnisim://projects/appearances/protos/OldSteel.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.81]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: forklift
  - name: enablePhysics
    type: SFBool
    access: field
    default: true
    hint: Defines whether the forklift should have physics.
