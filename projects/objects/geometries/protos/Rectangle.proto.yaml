# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Rectangle
  source: projects/objects/geometries/protos/Rectangle.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/geometries/protos/Rectangle.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: Single/double sided and adjustable rectangle shape.
  extern_protos: []
  fields:
  - name: size
    type: SFVec2f
    access: field
    default: [0.1, 0.1]
    hint: Defines the size of the rectangle shape.
  - name: doubleSided
    type: SFBool
    access: field
    default: true
    hint: Defines whether the shape has two sides or not.
