# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TexturedParallelepiped
  source: projects/objects/geometries/protos/TexturedParallelepiped.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/geometries/protos/TexturedParallelepiped.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: 'A parallelepiped mesh generated from three half-edge vectors, with a choice of texture mapping and per-face
      visibility. The solid is the set of points k*ex + j*ey + i*ez for k, j, i in [-1, 1], where the three half-edges follow
      from `size` and `angles`: - `angles.x`: angle in y direction between the front and back faces of the prism - `angles.y`:
      angle between the base and the side edges of the parallelogram face - `angles.z`: angle in z direction between the front
      and back faces of the prism Available texture mappings: - `cube` mapping: the six faces are cut out of a cross-shaped
      4 x 3 cube map (see projects/samples/geometries/worlds/textures/cube_mapping.jpg) - `compact` cube mapping: the same
      six faces, cut out of a tightly packed 3 x 2 cube map - `flat` mapping: the whole image is projected on the front face
      - `metric` mapping: the image keeps its aspect ratio and is laid over the faces at a single scale, so it is never stretched
      to fit - `default` mapping: the whole image is repeated on every face - `none`: no texture coordinates are emitted If
      a boolean field (front, back, left, right, top, bottom) is FALSE, then the corresponding face is not drawn. A demo of
      these mappings is available in projects/samples/geometries/worlds/textured_boxes.wbt.'
  extern_protos: []
  fields:
  - name: size
    type: SFVec3f
    access: field
    default: [0.1, 0.1, 0.1]
    hint: Defines the size of the parallelepiped.
  - name: angles
    type: SFVec3f
    access: field
    default: [0.0, 0.7854, 0.0]
    hint: Defines the angles of the parallelepiped.
  - name: mapping
    type: SFString
    access: field
    default: flat
    hint: Defines the texture mapping.
    enum: [cube, compact, flat, metric, default, none]
  - name: front
    type: SFBool
    access: field
    default: true
    hint: Defines whether the front face should be included.
  - name: back
    type: SFBool
    access: field
    default: true
    hint: Defines whether the back face should be included.
  - name: left
    type: SFBool
    access: field
    default: true
    hint: Defines whether the left face should be included.
  - name: right
    type: SFBool
    access: field
    default: true
    hint: Defines whether the right face should be included.
  - name: top
    type: SFBool
    access: field
    default: true
    hint: Defines whether the top face should be included.
  - name: bottom
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bottom face should be included.
