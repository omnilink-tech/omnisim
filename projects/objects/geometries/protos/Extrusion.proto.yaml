# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Extrusion
  source: projects/objects/geometries/protos/Extrusion.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/geometries/protos/Extrusion.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: 'A swept-surface geometry: the 2D ''crossSection'' polygon is carried along the 3D ''spine'' path, scaled
      and rotated at each spine point, and the swept hull is emitted as an IndexedFaceSet.'
  extern_protos: []
  fields:
  - name: crossSection
    type: MFVec2f
    access: field
    default:
    - 1
    - .nan
    - 1
    - .nan
    - -1
    - .nan
    - -1
    - .nan
    - 1
    - 1
    hint: Defines the 2D cross-section of the extrusion.
  - name: spine
    type: MFVec3f
    access: field
    default:
    - 0
    - 0
    - .nan
    - 0
    - 0
    - 1
    hint: Defines the 3D extrusion path.
  - name: scale
    type: MFVec2f
    access: field
    default:
    - 1.0
    - 1.0
    hint: Defines the scale at each point of the spine.
  - name: orientation
    type: MFRotation
    access: field
    default:
    - 0
    - 0
    - 1
    - 0
    hint: Defines the orientation of the cross-section at each point of the spine.
  - name: beginCap
    type: SFBool
    access: field
    default: true
    hint: Defines whether the extrusion should have a cap at the begining.
  - name: endCap
    type: SFBool
    access: field
    default: true
    hint: Defines whether the extrusion should have a cap at the end.
  - name: ccw
    type: SFBool
    access: field
    default: true
    hint: Is `IndexedFaceSet.ccw`.
  - name: convex
    type: SFBool
    access: field
    default: true
    hint: Is `IndexedFaceSet.convex`.
  - name: creaseAngle
    type: SFFloat
    access: field
    default: 0.0
    hint: Is `IndexedFaceSet.creaseAngle`.
  - name: splineSubdivision
    type: SFInt32
    access: field
    default: 4
    hint: If bigger than 1, defines the B-Spline subdivion of the extrusion along it's path.
