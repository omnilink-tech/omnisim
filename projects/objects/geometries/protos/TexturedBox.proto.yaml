# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TexturedBox
  source: projects/objects/geometries/protos/TexturedBox.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/geometries/protos/TexturedBox.proto
    keywords: [primitive/geometry]
    description: 'A rectangular box geometry with a selectable texture mapping and per-face visibility. Available texture
      mappings: - `cube` mapping: the six faces are cut from a cross-shaped cube map - `compact` cube mapping: the same, from
      a tightly packed 3 x 2 cube map - `flat` mapping: the whole texture is projected onto the front face - `metric` mapping:
      like `default`, but the texture keeps its aspect ratio instead of being stretched to each face - `default` mapping:
      the whole texture is repeated on every face - `none`: no texture mapping Setting a face field (front, back, left, right,
      top, bottom) to FALSE removes that face from the mesh. A demo of these mappings is available in projects/samples/geometries/worlds/textured_boxes.wbt.'
  extern_protos:
  - TexturedParallelepiped.proto
  fields:
  - name: size
    type: SFVec3f
    access: field
    default: [0.1, 0.1, 0.1]
    hint: Defines the size of the box.
  - name: mapping
    type: SFString
    access: field
    default: flat
    hint: Defines the texture mapping.
    enum: [cube, compact, flat, metric, default, none]
  - name: front
    type: SFBool
    access: field
    default: true
    hint: Defines whether the front face should be included.
  - name: back
    type: SFBool
    access: field
    default: true
    hint: Defines whether the back face should be included.
  - name: left
    type: SFBool
    access: field
    default: true
    hint: Defines whether the left face should be included.
  - name: right
    type: SFBool
    access: field
    default: true
    hint: Defines whether the right face should be included.
  - name: top
    type: SFBool
    access: field
    default: true
    hint: Defines whether the top face should be included.
  - name: bottom
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bottom face should be included.
