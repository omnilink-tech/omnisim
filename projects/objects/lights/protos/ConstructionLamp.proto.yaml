# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ConstructionLamp
  source: projects/objects/lights/protos/ConstructionLamp.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/lights/protos/ConstructionLamp.proto
    keywords: [industrial/light]
    template_language: javascript
    description: 'A portable site floodlight: a three-legged steel tripod carrying a tilted lamp head whose reflector emits
      a configurable SpotLight. The feet rest on the ground plane of the local frame.'
  extern_protos:
  - omnisim://projects/appearances/protos/MetalPipePaint.proto
  - omnisim://projects/appearances/protos/RustyMetal.proto
  - omnisim://projects/appearances/protos/ReflectiveSurface.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.07]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: construction lamp
  - name: supportAppearance
    type: SFNode
    access: field
    default: MetalPipePaint { }
    hint: Defines the appearance of the light support.
  - name: spotLightColor
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the spot light.
  - name: spotLightIntensity
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the intensity of the spot light.
  - name: spotLightRadius
    type: SFFloat
    access: field
    default: 100.0
    hint: Defines the radius of the spot light.
  - name: spotLightCastShadows
    type: SFBool
    access: field
    default: false
    hint: Defines whether the spot light should cast shadows.
