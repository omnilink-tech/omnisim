# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: DoubleFluorescentLamp
  source: projects/objects/lights/protos/DoubleFluorescentLamp.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/lights/protos/DoubleFluorescentLamp.proto
    keywords: [household/light, industrial light]
    template_language: javascript
    description: 'A twin-tube fluorescent ceiling fitting: a brushed-aluminium housing carrying two glowing tubes. It contains
      no Light node -- the tubes only glow, through the emissive color of their appearance, so add a PointLight to the world
      if the fitting should actually illuminate the scene. The housing hangs below the origin, which sits on the ceiling plane.'
  extern_protos:
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: double fuorescent lamp
  - name: intensity
    type: SFFloat
    access: field
    default: 10.0
    hint: Defines the intensity of the emissive color.
