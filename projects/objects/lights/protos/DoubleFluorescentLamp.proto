# keywords: household/light, industrial light
# A twin-tube fluorescent ceiling fitting: a brushed-aluminium housing carrying two glowing tubes.
# It contains no Light node -- the tubes only glow, through the emissive color of their appearance,
# so add a PointLight to the world if the fitting should actually illuminate the scene.
# The housing hangs below the origin, which sits on the ceiling plane.
# template language: javascript

EXTERNPROTO "omnisim://projects/appearances/protos/BrushedAluminium.proto"

PROTO DoubleFluorescentLamp [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "double fuorescent lamp"
  field SFFloat    intensity       10                        # Defines the intensity of the emissive color.
]
{
  %<
    const housingLength = 1.3;
    const housingWidth = 0.22;
    const housingHeight = 0.08;

    const tubeLength = 1.2;
    const tubeRadius = 0.018;
    const tubeY = 0.05;
    const tubeZ = -housingHeight - tubeRadius + 0.01;

    const intensity = Math.max(0.0, fields.intensity.value);
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "double fluorescent lamp"
    children [
      # ---- housing, hanging just under the ceiling ----
      Pose {
        translation 0 0 %<= -0.5 * housingHeight >%
        children [
          Shape {
            appearance DEF DFL_METAL BrushedAluminium {
              colorOverride 0.82 0.83 0.85
            }
            geometry Box {
              size %<= housingLength >% %<= housingWidth >% %<= housingHeight >%
            }
          }
        ]
      }
      # ---- end caps ----
      %< for (let i = 0; i < 2; ++i) {
           const cx = (i === 0 ? 1.0 : -1.0) * 0.5 * (tubeLength + 0.04);
      >%
      Pose {
        translation %<= cx >% 0 %<= tubeZ >%
        children [
          %< if (i === 0) { >%
          DEF DFL_CAP Shape {
            appearance USE DFL_METAL
            geometry Box {
              size 0.04 %<= housingWidth - 0.02 >% %<= 2.2 * tubeRadius >%
            }
          }
          %< } else { >%
          USE DFL_CAP
          %< } >%
        ]
      }
      %< } >%
      # ---- the two tubes ----
      %< for (let i = 0; i < 2; ++i) {
           const ty = (i === 0 ? tubeY : -tubeY);
      >%
      Pose {
        translation 0 %<= ty >% %<= tubeZ >%
        rotation 0 1 0 1.5708
        children [
          %< if (i === 0) { >%
          DEF DFL_TUBE Shape {
            appearance PBRAppearance {
              baseColor 1 1 0.98
              roughness 0.35
              metalness 0
              emissiveColor 1 1 0.95
              emissiveIntensity %<= intensity >%
            }
            geometry Cylinder {
              radius %<= tubeRadius >%
              height %<= tubeLength >%
              subdivision 16
            }
          }
          %< } else { >%
          USE DFL_TUBE
          %< } >%
        ]
      }
      %< } >%
    ]
  }
}
