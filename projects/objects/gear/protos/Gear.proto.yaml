# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Gear
  source: projects/objects/gear/protos/Gear.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/gear/protos/Gear.proto
    keywords: [industrial/ironmongery]
    template_language: javascript
    description: 'A parametric spur gear: a disc-shaped body with a bore, carrying `teeth` teeth laid out around the pitch
      circle. The gear spins about its local x axis; the origin is at the centre of the disc.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.045]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColor 0.533333, 0.541176, 0.521569, roughness 0.5 }
  - name: name
    type: SFString
    access: field
    default: gear
    hint: Defines the solid's name.
  - name: teeth
    type: SFInt32
    access: field
    default: 8
    hint: Defines number of teeth, [8, inf).
  - name: width
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines gear thickness, (0, inf).
  - name: innerRadius
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines the radius of the center hole.
  - name: pitchRadius
    type: SFFloat
    access: field
    default: 0.04
    hint: Defines the radius at center of the teeth.
  - name: toothDepth
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines depth of tooth.
  - name: density
    type: SFFloat
    access: field
    default: 0.001
    hint: Defines the density of the gear. If zero, physics is disabled.
  - name: bodyBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Enables gear body collision area (cylinder).
  - name: teethBoundingObject
    type: SFBool
    access: field
    default: false
    hint: Enables a boundingObject on each tooth.
