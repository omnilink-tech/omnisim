# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Sheep
  source: projects/objects/animals/protos/Sheep.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/animals/protos/Sheep.proto
    keywords: [animal/farm]
    template_language: javascript
    description: 'A static sheep, assembled from primitive shapes: a woolly barrel of overlapping spheres on four short legs,
      with a small dark head and drooping ears (about 1.2 m long, 1.0 m tall). The `color` field sets the fleece colour.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: name
    type: SFString
    access: field
    default: sheep
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the sheep.
