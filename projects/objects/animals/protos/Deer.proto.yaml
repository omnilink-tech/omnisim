# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Deer
  source: projects/objects/animals/protos/Deer.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/animals/protos/Deer.proto
    keywords: [animal/wild]
    template_language: javascript
    description: 'A static deer, assembled from primitive shapes: a slender body on four thin legs, an arched neck, branching
      antlers and a pale scut (about 1.6 m long, 1.3 m at the head). The `color` field modulates the coat albedo.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: name
    type: SFString
    access: field
    default: deer
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the deer.
