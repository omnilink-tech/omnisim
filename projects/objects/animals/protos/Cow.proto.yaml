# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Cow
  source: projects/objects/animals/protos/Cow.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/animals/protos/Cow.proto
    keywords: [animal/farm]
    template_language: javascript
    description: 'A static patched cow, assembled from primitive shapes: a chunky barrel on four hoofed legs, a horned head,
      an udder and a tufted tail (about 2.2 m long, 1.5 m at the horns). The `color` field sets the hide colour, `patchColor`
      selects brown or black patches.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: name
    type: SFString
    access: field
    default: cow
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the cow.
  - name: patchColor
    type: SFString
    access: field
    default: braun
    hint: Define the cow type.
    enum: [braun, black]
