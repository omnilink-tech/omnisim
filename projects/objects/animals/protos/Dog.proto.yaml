# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Dog
  source: projects/objects/animals/protos/Dog.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/animals/protos/Dog.proto
    keywords: [animal/pet]
    template_language: javascript
    description: 'A static dog, assembled from primitive shapes: a barrel body on four legs, a snouted head with perky ears
      and a raised tail (about 0.8 m long, 0.6 m at the ears). The `color` field modulates the coat albedo.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: name
    type: SFString
    access: field
    default: dog
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the dog.
