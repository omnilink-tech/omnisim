# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Horse
  source: projects/objects/animals/protos/Horse.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/animals/protos/Horse.proto
    keywords: [animal/farm]
    template_language: javascript
    description: 'A static horse, assembled from primitive shapes: a deep barrel on four long legs, an arched neck with a
      crested mane, a long head and a hanging tail (about 2.3 m long, 1.7 m at the ears). The `colorBody` field modulates
      the coat albedo, `colorHair` the mane and tail.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: name
    type: SFString
    access: field
    default: horse
  - name: colorBody
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the body of the horse.
  - name: colorHair
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the hair of the horse.
