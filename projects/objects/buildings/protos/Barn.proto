# keywords: building/farm
# template language: javascript
# A red timber barn built from primitives: boarded walls with white corner trim, two sliding
# doors and a hay hatch on the +y gable, small side windows, a pitched corrugated-metal roof
# with overhanging eaves, solid gable ends and a ridge cupola. Every dimension is multiplied
# by the `scale` field. The base of the barn sits at z = 0.

EXTERNPROTO "omnisim://projects/appearances/protos/PaintedWood.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/CorrugatedMetal.proto"

PROTO Barn [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFFloat    scale        1      # Defines the global scaling factor.
  field SFString   name         "barn"
]
{
  %<
    const s = Math.abs(fields.scale.value) > 0 ? Math.abs(fields.scale.value) : 1.0;
    const width = 10.0 * s;        // along x (gable span)
    const len = 16.0 * s;          // along y (ridge direction)
    const wallH = 4.5 * s;
    const rise = 3.5 * s;          // ridge above the eaves
    const hx = width / 2.0;
    const hy = len / 2.0;
    const ridgeZ = wallH + rise;
    const slope = Math.sqrt(hx * hx + rise * rise);
    const pitch = Math.atan2(rise, hx);
    const overhang = 0.5 * s;

    // a solid triangular prism, both windings emitted so it reads from either side
    function gable(cy, d) {
      const pts = [
        [-hx, -d, 0], [hx, -d, 0], [0, -d, rise],
        [-hx, d, 0], [hx, d, 0], [0, d, rise]
      ];
      let p = '';
      for (let i = 0; i < pts.length; ++i)
        p += (i ? ', ' : '') + pts[i][0].toFixed(3) + ' ' + pts[i][1].toFixed(3) + ' ' + pts[i][2].toFixed(3);
      const idx = '0 1 2 -1, 2 1 0 -1, 3 4 5 -1, 5 4 3 -1, 0 2 5 3 -1, 3 5 2 0 -1, ' +
                  '1 4 5 2 -1, 2 5 4 1 -1, 0 3 4 1 -1, 1 4 3 0 -1';
      let g = '      Pose {\n        translation 0 ' + cy.toFixed(3) + ' ' + wallH.toFixed(3) + '\n';
      g += '        children [\n          Shape {\n            appearance USE WALL_APP\n';
      g += '            geometry IndexedFaceSet {\n';
      g += '              coord Coordinate { point [ ' + p + ' ] }\n';
      g += '              coordIndex [ ' + idx + ' ]\n';
      g += '              creaseAngle 0.5\n';
      g += '            }\n          }\n        ]\n      }\n';
      return g;
    }
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "barn"
    children [
      # ---- boarded walls ----------------------------------------------------
      Pose {
        translation 0 0 %<= (wallH / 2.0).toFixed(3) >%
        children [
          Shape {
            appearance DEF WALL_APP PaintedWood {
              colorOverride 0.55 0.13 0.11
              textureTransform TextureTransform { scale 6 3 }
            }
            geometry Box { size %<= width.toFixed(3) >% %<= len.toFixed(3) >% %<= wallH.toFixed(3) >% }
          }
        ]
      }

      # ---- gable ends -------------------------------------------------------
      %<= gable(-hy + 0.06 * s, 0.06 * s) >%
      %<= gable(hy - 0.06 * s, 0.06 * s) >%

      # ---- pitched roof (two rotated slabs) ---------------------------------
      Pose {
        translation %<= (-hx / 2.0).toFixed(3) >% 0 %<= (wallH + rise / 2.0).toFixed(3) >%
        rotation 0 1 0 %<= (-pitch).toFixed(4) >%
        children [
          DEF ROOF_PANEL Shape {
            appearance DEF ROOF_APP CorrugatedMetal {
              colorOverride 0.42 0.44 0.45
              textureTransform TextureTransform { scale 6 10 }
            }
            geometry Box { size %<= (slope + overhang).toFixed(3) >% %<= (len + 2 * overhang).toFixed(3) >% %<= (0.22 * s).toFixed(3) >% }
          }
        ]
      }
      Pose {
        translation %<= (hx / 2.0).toFixed(3) >% 0 %<= (wallH + rise / 2.0).toFixed(3) >%
        rotation 0 1 0 %<= pitch.toFixed(4) >%
        children [ USE ROOF_PANEL ]
      }
      # ridge cap
      Pose {
        translation 0 0 %<= (ridgeZ + 0.1 * s).toFixed(3) >%
        children [
          Shape {
            appearance USE ROOF_APP
            geometry Box { size %<= (0.5 * s).toFixed(3) >% %<= (len + 2 * overhang).toFixed(3) >% %<= (0.18 * s).toFixed(3) >% }
          }
        ]
      }

      # ---- white corner trim ------------------------------------------------
      %< for (let k = 0; k < 4; ++k) {
           const tx = (k % 2 === 0 ? -1 : 1) * hx;
           const ty = (k < 2 ? -1 : 1) * hy; >%
      Pose {
        translation %<= tx.toFixed(3) >% %<= ty.toFixed(3) >% %<= (wallH / 2.0).toFixed(3) >%
        children [
          %< if (k === 0) { >%
          DEF CORNER_TRIM Shape {
            appearance DEF TRIM_APP PaintedWood {
              colorOverride 0.92 0.92 0.90
              textureTransform TextureTransform { scale 1 3 }
            }
            geometry Box { size %<= (0.35 * s).toFixed(3) >% %<= (0.35 * s).toFixed(3) >% %<= wallH.toFixed(3) >% }
          }
          %< } else { >%
          USE CORNER_TRIM
          %< } >%
        ]
      }
      %< } >%

      # ---- sliding doors and hay hatch on the +y gable ----------------------
      Pose {
        translation %<= (-1.3 * s).toFixed(3) >% %<= (hy + 0.08 * s).toFixed(3) >% %<= (1.75 * s).toFixed(3) >%
        children [
          DEF BARN_DOOR Shape {
            appearance DEF DOOR_APP PaintedWood {
              colorOverride 0.36 0.09 0.08
              textureTransform TextureTransform { scale 2 3 }
            }
            geometry Box { size %<= (2.4 * s).toFixed(3) >% %<= (0.16 * s).toFixed(3) >% %<= (3.5 * s).toFixed(3) >% }
          }
        ]
      }
      Pose {
        translation %<= (1.3 * s).toFixed(3) >% %<= (hy + 0.08 * s).toFixed(3) >% %<= (1.75 * s).toFixed(3) >%
        children [ USE BARN_DOOR ]
      }
      # door rail
      Pose {
        translation 0 %<= (hy + 0.12 * s).toFixed(3) >% %<= (3.65 * s).toFixed(3) >%
        children [
          Shape {
            appearance USE TRIM_APP
            geometry Box { size %<= (6.0 * s).toFixed(3) >% %<= (0.12 * s).toFixed(3) >% %<= (0.18 * s).toFixed(3) >% }
          }
        ]
      }
      # hay hatch in the gable
      Pose {
        translation 0 %<= (hy + 0.02 * s).toFixed(3) >% %<= (wallH + 1.2 * s).toFixed(3) >%
        children [
          Shape {
            appearance USE DOOR_APP
            geometry Box { size %<= (1.6 * s).toFixed(3) >% %<= (0.16 * s).toFixed(3) >% %<= (1.6 * s).toFixed(3) >% }
          }
        ]
      }

      # ---- side windows -----------------------------------------------------
      %< for (let i = 0; i < 3; ++i) {
           const wy = (i - 1) * 4.5 * s; >%
      Pose {
        translation %<= (hx + 0.04 * s).toFixed(3) >% %<= wy.toFixed(3) >% %<= (2.9 * s).toFixed(3) >%
        rotation 0 0 1 1.5708
        children [
          %< if (i === 0) { >%
          DEF SIDE_WINDOW Shape {
            appearance DEF GLASS_APP PBRAppearance {
              baseColor 0.16 0.18 0.19
              roughness 0.3
              metalness 0.4
            }
            geometry Box { size %<= (1.3 * s).toFixed(3) >% %<= (0.12 * s).toFixed(3) >% %<= (1.1 * s).toFixed(3) >% }
          }
          %< } else { >%
          USE SIDE_WINDOW
          %< } >%
        ]
      }
      Pose {
        translation %<= (-hx - 0.04 * s).toFixed(3) >% %<= wy.toFixed(3) >% %<= (2.9 * s).toFixed(3) >%
        rotation 0 0 1 1.5708
        children [ USE SIDE_WINDOW ]
      }
      %< } >%

      # ---- ridge cupola -----------------------------------------------------
      Pose {
        translation 0 %<= (-3.5 * s).toFixed(3) >% %<= (ridgeZ + 0.75 * s).toFixed(3) >%
        children [
          Shape {
            appearance USE TRIM_APP
            geometry Box { size %<= (1.2 * s).toFixed(3) >% %<= (1.2 * s).toFixed(3) >% %<= (1.4 * s).toFixed(3) >% }
          }
        ]
      }
      Pose {
        translation 0 %<= (-3.5 * s).toFixed(3) >% %<= (ridgeZ + 1.75 * s).toFixed(3) >%
        children [
          Shape {
            appearance USE ROOF_APP
            geometry Cone { bottomRadius %<= (1.0 * s).toFixed(3) >% height %<= (0.8 * s).toFixed(3) >% subdivision 4 }
          }
        ]
      }
    ]
    boundingObject Pose {
      translation 0 0 %<= (ridgeZ / 2.0).toFixed(3) >%
      children [
        Box { size %<= width.toFixed(3) >% %<= len.toFixed(3) >% %<= ridgeZ.toFixed(3) >% }
      ]
    }
    locked TRUE
  }
}
