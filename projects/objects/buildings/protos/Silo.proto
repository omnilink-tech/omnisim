# keywords: building/farm
# template language: javascript
# A parametric farm silo: a concrete footing, a corrugated-metal drum ringed by the seams of
# its bolted courses, a service ladder, a conical roof and a roof vent. Built entirely from
# primitives. The base of the silo sits at z = 0.

EXTERNPROTO "omnisim://projects/appearances/protos/CorrugatedMetal.proto"

PROTO Silo [
  field SFVec3f    translation          0 0 0    # Is `Pose.translation`.
  field SFRotation rotation             0 0 1 0  # Is `Pose.rotation`.
  field SFFloat    radius               3        # Defines the radius of the silo.
  field SFFloat    height               17       # Defines the height of the silo.
  field SFFloat    roofHeight           2        # Defines the height of the silo's roof.
  field SFString   name                 "silo"   # Is `Solid.name`.
  field SFBool     enableBoundingObject TRUE     # Defines whether the silo should have a bounding object.
  field SFBool     locked               FALSE    # Is `Solid.locked`.
]
{
  %<
    const radius = Math.max(0.1, fields.radius.value);
    const height = Math.max(0.2, fields.height.value);
    const roofHeight = Math.max(0.05, fields.roofHeight.value);
    const courses = Math.max(2, Math.round(height / 2.0));   // bolted courses
    const courseStep = height / courses;
    const rungs = Math.max(2, Math.round(height / 1.0));
    const subdivision = 24;

    let boundStr = '';
    if (fields.enableBoundingObject.value) {
      boundStr = 'boundingObject Pose {\n      translation 0 0 ' + (height / 2.0).toFixed(3) + '\n' +
                 '      children [\n        Cylinder { radius ' + radius.toFixed(3) + ' height ' +
                 height.toFixed(3) + ' subdivision ' + subdivision + ' }\n      ]\n    }';
    }
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "silo"
    children [
      # ---- concrete footing -------------------------------------------------
      Pose {
        translation 0 0 0.2
        children [
          Shape {
            appearance DEF CONCRETE_APP PBRAppearance {
              baseColor 0.55 0.54 0.52
              roughness 0.95
              metalness 0
            }
            geometry Cylinder { radius %<= (radius + 0.3).toFixed(3) >% height 0.4 subdivision %<= subdivision >% }
          }
        ]
      }

      # ---- corrugated drum --------------------------------------------------
      Pose {
        translation 0 0 %<= (height / 2.0).toFixed(3) >%
        children [
          Shape {
            appearance DEF SHELL_APP CorrugatedMetal {
              colorOverride 0.80 0.81 0.82
              textureTransform TextureTransform { scale %<= Math.max(2, Math.round(radius * 2)) >% %<= Math.max(2, Math.round(height / 2)) >% }
            }
            geometry Cylinder { radius %<= radius.toFixed(3) >% height %<= height.toFixed(3) >% subdivision %<= subdivision >% }
          }
        ]
      }

      # ---- seam ring at every course ----------------------------------------
      %< for (let c = 1; c < courses; ++c) { >%
      Pose {
        translation 0 0 %<= (c * courseStep).toFixed(3) >%
        children [
          %< if (c === 1) { >%
          DEF SEAM_RING Shape {
            appearance DEF TRIM_APP PBRAppearance {
              baseColor 0.62 0.63 0.64
              roughness 0.5
              metalness 0.8
            }
            geometry Cylinder { radius %<= (radius + 0.05).toFixed(3) >% height 0.12 subdivision %<= subdivision >% top FALSE bottom FALSE }
          }
          %< } else { >%
          USE SEAM_RING
          %< } >%
        ]
      }
      %< } >%

      # ---- service ladder ---------------------------------------------------
      Pose {
        translation %<= (radius + 0.12).toFixed(3) >% -0.22 %<= (height / 2.0).toFixed(3) >%
        children [
          DEF LADDER_RAIL Shape {
            appearance USE TRIM_APP
            geometry Box { size 0.06 0.06 %<= height.toFixed(3) >% }
          }
        ]
      }
      Pose {
        translation %<= (radius + 0.12).toFixed(3) >% 0.22 %<= (height / 2.0).toFixed(3) >%
        children [ USE LADDER_RAIL ]
      }
      %< for (let r = 0; r < rungs; ++r) {
           const rz = 0.4 + r * ((height - 0.6) / rungs); >%
      Pose {
        translation %<= (radius + 0.12).toFixed(3) >% 0 %<= rz.toFixed(3) >%
        children [
          %< if (r === 0) { >%
          DEF LADDER_RUNG Shape {
            appearance USE TRIM_APP
            geometry Box { size 0.05 0.5 0.04 }
          }
          %< } else { >%
          USE LADDER_RUNG
          %< } >%
        ]
      }
      %< } >%

      # ---- conical roof + vent ----------------------------------------------
      Pose {
        translation 0 0 %<= (height + roofHeight / 2.0).toFixed(3) >%
        children [
          Shape {
            appearance USE SHELL_APP
            geometry Cone { bottomRadius %<= (radius + 0.12).toFixed(3) >% height %<= roofHeight.toFixed(3) >% subdivision %<= subdivision >% }
          }
        ]
      }
      Pose {
        translation 0 0 %<= (height + roofHeight + 0.25).toFixed(3) >%
        children [
          Shape {
            appearance USE TRIM_APP
            geometry Cylinder { radius %<= Math.max(0.12, radius * 0.1).toFixed(3) >% height 0.5 subdivision 12 }
          }
        ]
      }
      # discharge chute at the foot of the drum
      Pose {
        translation %<= (-radius - 0.35).toFixed(3) >% 0 1.1
        children [
          Shape {
            appearance USE TRIM_APP
            geometry Box { size 0.8 %<= Math.max(0.6, radius * 0.4).toFixed(3) >% 2.2 }
          }
        ]
      }
    ]
    %<= boundStr >%
    locked IS locked
  }
}
