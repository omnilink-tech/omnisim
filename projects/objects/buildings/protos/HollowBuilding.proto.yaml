# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: HollowBuilding
  source: projects/objects/buildings/protos/HollowBuilding.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/HollowBuilding.proto
    keywords: [building/apartment]
    template_language: javascript
    description: 'A six-storey courtyard block: four wings around an open 20 x 20 m courtyard. Windows are modelled as geometry
      (a tiled grid of glass panes), not as a facade texture. The base of the building sits at z = 0.'
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: hollow building
