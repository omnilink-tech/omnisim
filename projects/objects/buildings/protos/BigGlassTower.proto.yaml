# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BigGlassTower
  source: projects/objects/buildings/protos/BigGlassTower.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/BigGlassTower.proto
    keywords: [building/skyscraper]
    template_language: javascript
    description: 'An 80 m curtain-wall office tower: concrete podium, glazed shaft whose mullion grid is modelled as geometry
      (no facade textures), a parapet crown and a roof mast. The entrance side faces +y and the base of the tower sits at
      z = 0.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: big glass tower
