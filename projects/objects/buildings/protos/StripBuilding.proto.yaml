# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: StripBuilding
  source: projects/objects/buildings/protos/StripBuilding.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/StripBuilding.proto
    keywords: [building/apartment]
    template_language: javascript
    description: A terraced strip of shop-and-flat units generated along the +y axis until the requested `length` is reached
      (the last unit is never cut, so the strip is slightly longer). Unit width, height and render colour are drawn from a
      seeded pseudo-random sequence, so the same `randomSeed` always yields the same strip. Shopfronts, windows and parapets
      are primitive geometry -- no facade textures. The base of the strip sits at z = 0.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: strip building
  - name: length
    type: SFFloat
    access: field
    default: 100.0
    hint: Defines the minimum length of the strip (actual length is slightly bigger because buildings are not cut).
  - name: randomSeed
    type: SFInt32
    access: field
    default: 1
    hint: Defines the seed of the random number generator. A value smaller or equal to 0 sets a random seed.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the buildings should have bounding objects.
