# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Barn
  source: projects/objects/buildings/protos/Barn.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/Barn.proto
    keywords: [building/farm]
    template_language: javascript
    description: 'A red timber barn built from primitives: boarded walls with white corner trim, two sliding doors and a hay
      hatch on the +y gable, small side windows, a pitched corrugated-metal roof with overhanging eaves, solid gable ends
      and a ridge cupola. Every dimension is multiplied by the `scale` field. The base of the barn sits at z = 0.'
  extern_protos:
  - omnisim://projects/appearances/protos/PaintedWood.proto
  - omnisim://projects/appearances/protos/CorrugatedMetal.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: name
    type: SFString
    access: field
    default: barn
