# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ResidentialTower
  source: projects/objects/buildings/protos/ResidentialTower.proto
  header:
    license: Creative Commons Attribution 4.0 International License.
    license_url: https://creativecommons.org/licenses/by/4.0/legalcode
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/ResidentialTower.proto
    keywords: [building/residential]
    template_language: javascript
    description: A residential tower with variable number of floor and optional boundingObject.
  extern_protos:
  - ResidentialTowerBase.proto
  - ResidentialTowerFloor.proto
  - ResidentialTowerRoof.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: residential tower
  - name: numberOfFloors
    type: SFInt32
    access: field
    default: 3
    hint: Defines the number of floors of the tower.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the towwer should have a bounding object.
