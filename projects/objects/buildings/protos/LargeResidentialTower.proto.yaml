    license_url: https://creativecommons.org/licenses/by/4.0/legalcode
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/objects/buildings/protos/LargeResidentialTower.proto
    keywords: [building/residential]
    template_language: javascript
    description: A large residential tower with variable number of floors and optional boundingObject.
  extern_protos:
