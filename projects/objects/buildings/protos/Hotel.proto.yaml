# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Hotel
  source: projects/objects/buildings/protos/Hotel.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/Hotel.proto
    keywords: [building/hotel]
    template_language: javascript
    description: 'A twelve-storey hotel: glazed lobby with a porte-cochere on the +y side, a punched-window grid with continuous
      balcony slabs on the long facades, a cornice, a parapet and a roof sign. Windows and balconies are geometry, not a facade
      texture. The base sits at z = 0.'
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: hotel
