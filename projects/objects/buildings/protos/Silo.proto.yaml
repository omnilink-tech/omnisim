# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Silo
  source: projects/objects/buildings/protos/Silo.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/Silo.proto
    keywords: [building/farm]
    template_language: javascript
    description: 'A parametric farm silo: a concrete footing, a corrugated-metal drum ringed by the seams of its bolted courses,
      a service ladder, a conical roof and a roof vent. Built entirely from primitives. The base of the silo sits at z = 0.'
  extern_protos:
  - omnisim://projects/appearances/protos/CorrugatedMetal.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
    hint: Is `Pose.translation`.
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
    hint: Is `Pose.rotation`.
  - name: radius
    type: SFFloat
    access: field
    default: 3.0
    hint: Defines the radius of the silo.
  - name: height
    type: SFFloat
    access: field
    default: 17.0
    hint: Defines the height of the silo.
  - name: roofHeight
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the height of the silo's roof.
  - name: name
    type: SFString
    access: field
    default: silo
    hint: Is `Solid.name`.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the silo should have a bounding object.
  - name: locked
    type: SFBool
    access: field
    default: false
    hint: Is `Solid.locked`.
