# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: CommercialBuilding
  source: projects/objects/buildings/protos/CommercialBuilding.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/CommercialBuilding.proto
    keywords: [building/office]
    template_language: javascript
    description: 'An eight-storey commercial block in warm ochre render: glazed shopfront colonnade at street level, a punched-window
      grid modelled as geometry on every upper storey, a signage band and a parapet. No facade textures. The base sits at
      z = 0 and the entrance faces +y.'
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: commercial building
