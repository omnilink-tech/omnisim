# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ResidentialBuilding
  source: projects/objects/buildings/protos/ResidentialBuilding.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/ResidentialBuilding.proto
    keywords: [building/apartment]
    template_language: javascript
    description: 'A seven-storey brick apartment block: punched windows with stone sills modelled as geometry, balconies on
      the street side, a cornice, a parapet and two chimneys. No facade textures (the brick comes from the Apache-2.0 RedBricks
      appearance). The base sits at z = 0 and the entrance faces +y.'
  extern_protos:
  - omnisim://projects/appearances/protos/RedBricks.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: residential building
