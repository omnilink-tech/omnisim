# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Museum
  source: projects/objects/buildings/protos/Museum.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/Museum.proto
    keywords: [building/public]
    template_language: javascript
    description: 'A neo-classical museum: a stepped stylobate, a marble block with pilasters and tall recessed windows, an
      eight-column portico with an entablature and a triangular pediment. All geometry is primitive (columns are cylinders);
      no facade textures. The base sits at z = 0 and the portico faces +y.'
  extern_protos:
  - omnisim://projects/appearances/protos/Marble.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: museum
