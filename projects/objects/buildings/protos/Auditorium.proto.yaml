# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Auditorium
  source: projects/objects/buildings/protos/Auditorium.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/buildings/protos/Auditorium.proto
    keywords: [building/public]
    template_language: javascript
    description: 'A round concert-hall / auditorium: stone plinth, glazed drum with radial mullion fins, a cornice ring, a
      shallow metal dome and a columned entrance porch on the +y side. Everything is primitive geometry -- no facade textures.
      The base sits at z = 0.'
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: auditorium
