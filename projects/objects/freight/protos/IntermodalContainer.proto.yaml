# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: IntermodalContainer
  source: projects/objects/freight/protos/IntermodalContainer.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/freight/protos/IntermodalContainer.proto
    keywords: [industrial/container]
    description: 'A standard 20-foot ISO shipping container: a boxed shell with corrugated side ribs, eight corner castings
      and a twin-leaf door end, all built from primitives.'
  extern_protos:
  - omnisim://projects/appearances/protos/GlossyPaint.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
    hint: Is `Pose.translation`.
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
    hint: Is `Pose.rotation`.
  - name: name
    type: SFString
    access: field
    default: container
    hint: Is `Solid.name`.
  - name: color
    type: SFColor
    access: field
    default: [0.9, 0.1, 0.1]
    hint: Defines the color.
