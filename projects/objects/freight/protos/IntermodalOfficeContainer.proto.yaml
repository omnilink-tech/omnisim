# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: IntermodalOfficeContainer
  source: projects/objects/freight/protos/IntermodalOfficeContainer.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/freight/protos/IntermodalOfficeContainer.proto
    keywords: [industrial/container]
    description: 'A 20-foot intermodal container converted into a site office: a painted shell with corner posts, three glazed
      windows per side, an end door and an entry step. 6.06 x 2.44 x 2.59 m, origin at the base.'
  extern_protos:
  - omnisim://projects/appearances/protos/GlossyPaint.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
    hint: Is `Pose.translation`.
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
    hint: Is `Pose.rotation`.
  - name: name
    type: SFString
    access: field
    default: office
    hint: Is `Solid.name`.
  - name: primaryColor
    type: SFColor
    access: field
    default: [0.9, 0.1, 0.1]
    hint: Defines the primary color.
  - name: secondaryColor
    type: SFColor
    access: field
    default: [0.6, 0.6, 0.6]
    hint: Defines the secondary color.
