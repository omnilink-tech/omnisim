# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Desk
  source: projects/objects/tables/protos/Desk.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/tables/protos/Desk.proto
    keywords: [furniture/table]
    template_language: javascript
    description: 'An office desk (0.7 x 1.2 x 0.72 m): a rimmed top on four splayed tubular legs, with a modesty panel across
      the back.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: desk
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the desk.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
