# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Table
  source: projects/objects/tables/protos/Table.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/tables/protos/Table.proto
    keywords: [furniture/table]
    template_language: javascript
    description: 'A customizable table: a rectangular tray resting on one square leg under each corner, every part a Solid
      in its own right.'
  extern_protos:
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - omnisim://projects/objects/solids/protos/SolidBox.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: table
  - name: size
    type: SFVec3f
    access: field
    default: [1, 1.8, 0.74]
    hint: Defines the size of the table.
  - name: feetSize
    type: SFVec2f
    access: field
    default: [0.1, 0.1]
    hint: Defines the size of the feet.
  - name: feetPadding
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the padding of the feet.
  - name: frameThickness
    type: SFFloat
    access: field
    default: 0.05
    hint: Defines the thickness of the frame.
  - name: trayAppearance
    type: SFNode
    access: field
    default: VarnishedPine { textureTransform TextureTransform { scale 10 10 } }
    hint: Defines the appearance of the tray.
  - name: legAppearance
    type: SFNode
    access: field
    default: VarnishedPine { textureTransform TextureTransform { scale 4 5 } }
    hint: Defines the appearance of the feet.
