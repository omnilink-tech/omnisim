# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: RubberDuck
  source: projects/objects/toys/protos/RubberDuck.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/toys/protos/RubberDuck.proto
    keywords: [household/toy]
    template_language: javascript
    description: 'A buoyant bath-toy rubber duck assembled from primitive shapes: a rounded hull, a cocked tail, a small head
      with an orange beak (7.4 x 11.5 x 10.1 cm). The origin lies at the bottom of the hull; `bodyColor` sets both the rubber
      colour and the camera recognition color.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.02]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: rubber duck
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the global scaling factor.
  - name: bodyColor
    type: SFColor
    access: field
    default: [1, 0.8, 0]
    hint: Defines the color of the rubber duck.
  - name: density
    type: SFFloat
    access: field
    default: 400.0
    hint: Defines density of the rubber duck in kg / m^3.
  - name: immersionProperties
    type: MFNode
    access: field
    default: '[ ImmersionProperties { fluidName "water" viscousResistanceForceCoefficient 400 viscousResistanceTorqueCoefficient
      0.5 } ]'
