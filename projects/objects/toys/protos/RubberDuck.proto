# documentation url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/toys/protos/RubberDuck.proto
# keywords: household/toy
# A buoyant bath-toy rubber duck assembled from primitive shapes: a rounded hull, a cocked tail, a small head with an orange beak (7.4 x 11.5 x 10.1 cm).
# The origin lies at the bottom of the hull; `bodyColor` sets both the rubber colour and the camera recognition color.
# template language: javascript

PROTO RubberDuck [
  field SFVec3f    translation         0 0 0.02
  field SFRotation rotation            0 0 1 0
  field SFString   name                "rubber duck"
  field SFFloat    scale               1                          # Defines the global scaling factor.
  field SFColor    bodyColor           1 0.8 0                    # Defines the color of the rubber duck.
  field SFFloat    density             400                        # Defines density of the rubber duck in kg / m^3.
  field MFNode     immersionProperties [                          # Is `Solid.immersionProperties`.
      ImmersionProperties {
        fluidName "water"
        viscousResistanceForceCoefficient 400
        viscousResistanceTorqueCoefficient 0.5
      }
    ]
]
{
  %<
    let s = fields.scale.value;
    if (s <= 0) {
      s = fields.scale.defaultValue;
      console.error("'scale' must be strictly positive, value reset to " + s + ".");
    }
    const bc = fields.bodyColor.value;
    // Every dimension below is expressed in metres and driven through the scale factor.
    function d(v) { return (v * s).toFixed(6); }
    function v3(x, y, z) { return d(x) + " " + d(y) + " " + d(z); }
    // The wings are a shaded variant of the rubber colour.
    const wingColor = (bc.r * 0.82).toFixed(4) + " " + (bc.g * 0.82).toFixed(4) + " " + (bc.b * 0.82).toFixed(4);
    const recognition = bc.r.toFixed(4) + " " + bc.g.toFixed(4) + " " + bc.b.toFixed(4);
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "rubber duck"
    recognitionColors [
      %<= recognition >%
    ]
    immersionProperties IS immersionProperties
    children [
      DEF DUCK_HULL Group {
        children [
          Pose {
            translation %<= v3(0, 0, 0.037) >%
            children [
              Shape {
                appearance DEF DUCK_RUBBER PBRAppearance {
                  baseColor IS bodyColor
                  roughness 0.45
                  metalness 0
                }
                geometry Sphere {
                  radius %<= d(0.037) >%
                  subdivision 3
                }
              }
            ]
          }
          Pose {
            translation %<= v3(0.020, 0, 0.034) >%
            children [
              Shape {
                appearance USE DUCK_RUBBER
                geometry Sphere {
                  radius %<= d(0.030) >%
                  subdivision 3
                }
              }
            ]
          }
          Pose {
            translation %<= v3(-0.048, 0, 0.052) >%
            rotation 0 1 0 0.6
            children [
              Shape {
                appearance USE DUCK_RUBBER
                geometry Box {
                  size %<= v3(0.030, 0.018, 0.016) >%
                }
              }
            ]
          }
        ]
      }
      DEF DUCK_WINGS Group {
        children [
          Pose {
            translation %<= v3(-0.004, 0.033, 0.045) >%
            children [
              DEF DUCK_WING Shape {
                appearance DEF DUCK_WING_MAT PBRAppearance {
                  baseColor %<= wingColor >%
                  roughness 0.5
                  metalness 0
                }
                geometry Box {
                  size %<= v3(0.045, 0.006, 0.026) >%
                }
              }
            ]
          }
          Pose {
            translation %<= v3(-0.004, -0.033, 0.045) >%
            children [
              USE DUCK_WING
            ]
          }
        ]
      }
      DEF DUCK_HEAD Group {
        children [
          Pose {
            translation %<= v3(0.016, 0, 0.066) >%
            rotation 0 1 0 0.25
            children [
              Pose {
                children [
                  Shape {
                    appearance USE DUCK_RUBBER
                    geometry Cylinder {
                      height %<= d(0.030) >%
                      radius %<= d(0.014) >%
                      subdivision 12
                    }
                  }
                ]
              }
            ]
          }
          Pose {
            translation %<= v3(0.024, 0, 0.080) >%
            children [
              Shape {
                appearance USE DUCK_RUBBER
                geometry Sphere {
                  radius %<= d(0.021) >%
                  subdivision 3
                }
              }
            ]
          }
          Pose {
            translation %<= v3(0.043, 0, 0.077) >%
            rotation 0 1 0 1.5708
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.95 0.45 0.05
                  roughness 0.5
                  metalness 0
                }
                geometry Cone {
                  bottomRadius %<= d(0.011) >%
                  height %<= d(0.024) >%
                  subdivision 12
                }
              }
            ]
          }
          Pose {
            translation %<= v3(0.036, 0.0125, 0.087) >%
            children [
              DEF DUCK_EYE Shape {
                appearance PBRAppearance {
                  baseColor 0.05 0.04 0.04
                  roughness 0.25
                  metalness 0
                }
                geometry Sphere {
                  radius %<= d(0.0045) >%
                  subdivision 2
                }
              }
            ]
          }
          Pose {
            translation %<= v3(0.036, -0.0125, 0.087) >%
            children [
              USE DUCK_EYE
            ]
          }
        ]
      }
    ]
    boundingObject Pose {
      translation %<= v3(0, 0, 0.045) >%
      children [
        Box {
          size %<= v3(0.105, 0.072, 0.090) >%
        }
      ]
    }
    physics Physics {
      density IS density
    }
  }
}
