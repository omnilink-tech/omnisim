# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Orange
  source: projects/objects/fruits/protos/Orange.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/fruits/protos/Orange.proto
    keywords: [household/kitchen]
    description: 'A 10 cm orange: a matte orange sphere topped with a short green stalk. The origin sits at the centre of
      the fruit, so a world places it at z = radius.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.05]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: orange
  - name: mass
    type: SFFloat
    access: field
    default: 0.15
    hint: Defines the mass of the orange in kg.
