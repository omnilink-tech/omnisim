# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Apple
  source: projects/objects/fruits/protos/Apple.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/fruits/protos/Apple.proto
    keywords: [household/kitchen]
    template_language: javascript
    description: 'An apple (0.1 x 0.1 x 0.1 m at scale 1): a slightly squashed red sphere with a woody stem sunk into its
      dimple.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0.05]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: apple
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
  - name: mass
    type: SFFloat
    access: field
    default: 0.15
    hint: Defines the mass of the apple in kg.
  - name: immersionProperties
    type: MFNode
    access: field
    default: []
    hint: Is `Solid.immersionProperties`.
