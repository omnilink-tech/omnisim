# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: StraightStairs
  source: projects/objects/stairs/protos/StraightStairs.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/stairs/protos/StraightStairs.proto
    keywords: [building/component]
    template_language: javascript
    description: 'A straight flight of stairs: ''nSteps'' treads carried by two side stringers, with an optional handrail
      on each side.'
  extern_protos:
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - StraightStairsRail.proto
  - omnisim://projects/objects/geometries/protos/TexturedParallelepiped.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: straight stairs
  - name: stepSize
    type: SFVec3f
    access: field
    default: [0.4, 1.27, 0.03]
    hint: Defines the size of one step.
  - name: stepRise
    type: SFFloat
    access: field
    default: 0.15
    hint: Defines the height difference between two consecutives steps.
  - name: nSteps
    type: SFInt32
    access: field
    default: 5
    hint: Defines the number of steps.
  - name: stringerWidth
    type: SFFloat
    access: field
    default: 0.02
    hint: Defines the width of the stringers.
  - name: stepAppearance
    type: SFNode
    access: field
    default: VarnishedPine { textureTransform TextureTransform { scale 4 4 } }
    hint: Defines the appearance of the steps.
  - name: stringerAppearance
    type: SFNode
    access: field
    default: VarnishedPine { textureTransform TextureTransform { scale 4 4 } }
    hint: Defines the appearance of the stringers.
  - name: leftRail
    type: MFNode
    access: field
    default: StraightStairsRail { }
    hint: Defines the left rail.
  - name: rightRail
    type: MFNode
    access: field
    default: StraightStairsRail { }
    hint: Defines the right rail.
  - name: startingStairs
    type: SFBool
    access: field
    default: true
    hint: Defines whether the bottom part of the stairs should be flat.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
