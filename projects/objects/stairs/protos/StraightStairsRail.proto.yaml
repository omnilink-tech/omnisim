# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: StraightStairsRail
  source: projects/objects/stairs/protos/StraightStairsRail.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/stairs/protos/StraightStairsRail.proto
    keywords: [building/component]
    template_language: javascript
    description: 'A handrail for a straight flight of stairs: a newel post at each end, a sloped top bar between them, and
      a row of balusters hanging under the bar.'
  extern_protos:
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - omnisim://projects/objects/geometries/protos/TexturedParallelepiped.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: straight stairs rail
  - name: run
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the horizontal lenght of the rail.
  - name: rise
    type: SFFloat
    access: field
    default: 0.75
    hint: Defines the vertical lenght of the rail.
  - name: width
    type: SFFloat
    access: field
    default: 0.04
    hint: Defines the width of the rail.
  - name: newelHeight
    type: SFFloat
    access: field
    default: 0.93
    hint: Defines the height of the top bar.
  - name: balusterHeight
    type: SFFloat
    access: field
    default: 0.8
    hint: Defines the height of the balusters.
  - name: balusterRadius
    type: SFFloat
    access: field
    default: 0.01
    hint: Defines the radius of the balusters.
  - name: nBalusters
    type: SFInt32
    access: field
    default: 20
    hint: Defines the number of balusters.
  - name: appearance
    type: SFNode
    access: field
    default: VarnishedPine { textureTransform TextureTransform { scale 4 4 } }
    hint: Defines the appearance of the rail.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
