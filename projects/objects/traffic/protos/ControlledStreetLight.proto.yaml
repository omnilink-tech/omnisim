# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ControlledStreetLight
  source: projects/objects/traffic/protos/ControlledStreetLight.proto
  header:
    license: Creative Commons Attribution 3.0 United States License (original model by Andrew Kator & Jennifer Legaz).
    license_url: https://creativecommons.org/licenses/by/3.0/legalcode
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/objects/traffic/protos/ControlledStreetLight.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: Simple model of a controlled street light including a customizable SpotLight.
  extern_protos:
  - StreetLight.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: street light
  - name: controller
    type: SFString
    access: field
    default: defective_street_light
    hint: Defines the controller used to make the LED blink.
  - name: window
    type: SFString
    access: field
    default: <none>
    hint: Is `Robot.window`.
  - name: supervisor
    type: SFBool
    access: field
    default: false
    hint: Is `Robot.supervisor`.
  - name: beamWidth
    type: SFFloat
    access: field
    default: 1.1
    hint: Defines the beam width of the spot light.
  - name: color
    type: MFColor
    access: field
    default:
    - 1
    - 0.9
    - 0.8
    hint: Defines the color of the spot light.
  - name: cutOffAngle
    type: SFFloat
    access: field
    default: 1.4
    hint: Defines the cut-off angle of the spot light.
  - name: direction
    type: SFVec3f
    access: field
    default: [0.1, 0, -1]
    hint: Defines the direction of the spot light.
  - name: radius
    type: SFFloat
    access: field
    default: 1000.0
    hint: Defines the radius of the spot light.
  - name: castShadows
    type: SFBool
    access: field
    default: false
    hint: Defines whether the spot light casts shadows.
