# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TrafficCone
  source: projects/objects/traffic/protos/TrafficCone.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/TrafficCone.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: 'A road cone: a tapered orange body carrying two reflective collars, moulded onto a square rubber base. Built
      from stacked frusta, so `scale` resizes it without distorting the taper.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
  - name: name
    type: SFString
    access: field
    default: traffic cone
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
