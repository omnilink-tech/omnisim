# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SpeedLimitSign
  source: projects/objects/traffic/protos/SpeedLimitSign.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/SpeedLimitSign.proto
    keywords: [traffic/sign]
    template_language: javascript
    description: 'A round speed-limit sign: a SignPole carrying a white disc with a red rim and a dark numeral block, all
      built from primitives so no sign artwork is needed. Any board listed in `signBoards` replaces that built-in panel.'
  extern_protos:
  - SignPole.proto
  - SpeedLimitPanel.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: speed limit
  - name: height
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the height of the sign.
  - name: radius
    type: SFFloat
    access: field
    default: 0.03
    hint: Defines the radius of the sign pole.
  - name: color
    type: SFColor
    access: field
    default: [0.576471, 0.576471, 0.576471]
    hint: Defines the color of the sign.
  - name: signBoards
    type: MFNode
    access: field
    default: '[ SpeedLimitPanel { translation 0.023 0 0 } ]'
    hint: Defines the boards.
