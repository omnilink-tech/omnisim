# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SpeedLimitPanel
  source: projects/objects/traffic/protos/SpeedLimitPanel.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/SpeedLimitPanel.proto
    keywords: [traffic/sign]
    template_language: javascript
    description: 'A sign plate with cut corners, standing on a shallow rolled edge, with a bracket to clamp it to a pole.
      The plate is built from primitives and carries NO artwork of its own: give `signImage` an image of your own and it is
      mapped across the face; leave it alone and the face is finished as a blank plate inside a raised border.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: speed limit panel
  - name: signImage
    type: MFString
    access: field
    default:
    - textures/signs/us/speed_limit_45.jpg
    hint: Defines the texture used for the sign.
  - name: color
    type: SFColor
    access: field
    default: [0.8, 0.8, 0.8]
    hint: Defines the color of the panel.
  - name: recognitionColors
    type: MFColor
    access: field
    default:
    - 1
    - 1
    - .nan
    - 0.8
    - 0.8
    - 0.8
    hint: Is `Solid.recognitionColors`.
