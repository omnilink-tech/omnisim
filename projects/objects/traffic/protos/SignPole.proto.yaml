# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SignPole
  source: projects/objects/traffic/protos/SignPole.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/SignPole.proto
    keywords: [traffic/sign]
    template_language: javascript
    description: 'A bare road-sign pole: a foot plate and a tube of the requested height and radius. Whatever is listed in
      `signBoards` is mounted at the top of the tube.'
  extern_protos:
  - DirectionPanel.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: sign pole
  - name: height
    type: SFFloat
    access: field
    default: 2.2
    hint: Defines the height of the sign.
  - name: radius
    type: SFFloat
    access: field
    default: 0.02
    hint: Defines the radius of the sign.
  - name: color
    type: SFColor
    access: field
    default: [0.8, 0.8, 0.8]
    hint: Defines the color of the pole.
  - name: signBoards
    type: MFNode
    access: field
    default: '[ DirectionPanel { } ]'
    hint: Defines the boards.
