# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PedestrianCrossing
  source: projects/objects/traffic/protos/PedestrianCrossing.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/PedestrianCrossing.proto
    keywords: [traffic/sign]
    template_language: javascript
    description: 'A zebra crossing drawn as real geometry: a thin asphalt patch plus a row of white marking slabs. The bars
      always run along the short side of the patch (the way the traffic flows) and repeat along the long side (the width of
      the road), so a 20 x 8 and an 8 x 20 crossing both read right.'
  extern_protos:
  - omnisim://projects/appearances/protos/Asphalt.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: pedestrian crossing
  - name: scale
    type: SFVec3f
    access: field
    default: [1, 1, 1]
  - name: size
    type: SFVec2f
    access: field
    default: [20, 8]
    hint: Defines the size of the pedestrian crossing.
  - name: textureFiltering
    type: SFInt32
    access: field
    default: 4
    hint: Defines the filtering level for the texture used for the pedestrian crossing.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the pedestrian crossing should have a bounding object.
