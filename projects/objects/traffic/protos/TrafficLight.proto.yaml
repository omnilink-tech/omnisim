# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TrafficLight
  source: projects/objects/traffic/protos/TrafficLight.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/TrafficLight.proto
    keywords: [traffic/sign]
    description: 'A 3.2 m kerbside traffic light: base plate, mast and a three-aspect signal head carrying red / amber / green
      LED devices. The bulbs come from the `lamp_geometry` field (none by default).'
  extern_protos:
  - omnisim://projects/appearances/protos/OldSteel.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: traffic light
  - name: red_light
    type: SFString
    access: field
    default: red light
    hint: Defines the name of the red LED device.
  - name: orange_light
    type: SFString
    access: field
    default: orange light
    hint: Defines the name of the orange LED device.
  - name: green_light
    type: SFString
    access: field
    default: green light
    hint: Defines the name of the green LED device.
  - name: lamp_geometry
    type: SFNode
    access: field
    default: null
    hint: Defines the geometry of the lamps.
  - name: lamp_rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
    hint: Defines the rotation of the lamps.
  - name: recognitionColors
    type: MFColor
    access: field
    default:
    - 0.25
    - 0.25
    - .nan
    - 0
    - 0
    - 0
    hint: Is `Solid.recognitionColors`.
