# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: DirectionPanel
  source: projects/objects/traffic/protos/DirectionPanel.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/DirectionPanel.proto
    keywords: [traffic/sign]
    template_language: javascript
    description: 'A fingerpost blade: a flat panel that runs out from the pole and comes to a point, with a dark rim and an
      independently addressable face on each side. The blade is drawn from primitives and carries NO artwork of its own. `frontTextTexture`
      and `backTextTexture` take an image for each face -- leave them alone and each face is a plain painted plate.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: direction panel
  - name: width
    type: SFFloat
    access: field
    default: 1.3
    hint: Defines the width of the panel.
  - name: height
    type: SFFloat
    access: field
    default: 0.4
    hint: Defines the height of the panel.
  - name: thickness
    type: SFFloat
    access: field
    default: 0.04
    hint: Defines the thickness of the panel.
  - name: frontTextTexture
    type: MFString
    access: field
    default:
    - textures/no_text_front.png
    hint: Defines the texture to display on the front side.
  - name: backTextTexture
    type: MFString
    access: field
    default:
    - textures/no_text_back.png
    hint: Defines the texture to display on the back side.
