# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: StreetLight
  source: projects/objects/traffic/protos/StreetLight.proto
  header:
    license: Creative Commons Attribution 3.0 United States License (original model by Andrew Kator & Jennifer Legaz).
    license_url: https://creativecommons.org/licenses/by/3.0/legalcode
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/traffic/protos/StreetLight.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: Simple model of a street light including a customizable SpotLight. This model was sponsored by the CTI project
      RO2IVSim (http://transport.epfl.ch/simulator-for-mobile-robots-and-intelligent-vehicles).
  extern_protos:
  - omnisim://projects/appearances/protos/MattePaint.proto
  - omnisim://projects/appearances/protos/OldSteel.proto
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: scale
    type: SFFloat
    access: field
    default: 1.0
  - name: name
    type: SFString
    access: field
    default: street light
  - name: beamWidth
    type: SFFloat
    access: field
    default: 1.1
    hint: Defines the beam width of the spot light.
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color of the spot light.
  - name: cutOffAngle
    type: SFFloat
    access: field
    default: 1.4
    hint: Defines the cut-off angle of the spot light.
  - name: direction
    type: SFVec3f
    access: field
    default: [0.1, 0, -1]
    hint: Defines the direction of the spot light.
  - name: 'on'
    type: SFBool
    access: field
    default: true
    hint: Defines whether the spot light is on or off.
  - name: radius
    type: SFFloat
    access: field
    default: 1000.0
    hint: Defines the radius of the spot light.
  - name: intensity
    type: SFFloat
    access: field
    default: 30.0
    hint: Defines the radius of the spot light.
  - name: castShadows
    type: SFBool
    access: field
    default: false
    hint: Defines whether the spot light casts shadows.
