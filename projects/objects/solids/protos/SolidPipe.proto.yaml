# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SolidPipe
  source: projects/objects/solids/protos/SolidPipe.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/solids/protos/SolidPipe.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: 'A hollow tube (an annular cylinder) exposed as a Solid. Graphically it is a single IndexedFaceSet: an outer
      wall, an inner wall and two end rings. Physically it is a ring of boxes -- a collision engine cannot represent a concave
      hollow shell, so the annulus is tiled with ''subdivision'' straight boxes; ''accuracy'' bounds how far that polygonal
      ring may sit from the true circular wall.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 1]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: pipe
  - name: height
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the height of the pipe.
  - name: radius
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the radius of the pipe.
  - name: thickness
    type: SFFloat
    access: field
    default: 0.1
    hint: Defines the thickness of the pipe.
  - name: subdivision
    type: SFInt32
    access: field
    default: 24
    hint: Defines the number of polygons used to represent the pipe and so its resolution.
  - name: accuracy
    type: SFFloat
    access: field
    default: 0.0001
    hint: 'Defines how far the boxes of the bounding object may sit from the true circular wall: a smaller value keeps more
      boxes and so slows the simulation down.'
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColorMap ImageTexture { url [ "omnisim://projects/default/worlds/textures/tagged_wall.jpg"
      ] } metalness 0 roughness 0.5 }
    hint: Defines the appearance of the pipe.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the solid should have a bounding object.
