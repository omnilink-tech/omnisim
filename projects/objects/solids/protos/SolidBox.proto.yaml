# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SolidBox
  source: projects/objects/solids/protos/SolidBox.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/solids/protos/SolidBox.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: A box built at the Solid level from an explicit six-quad mesh. Texture coordinates are laid out in metres
      rather than one full image per face, so a tiling texture keeps square texels on a non-cubic box instead of being stretched.
      The longest edge of the box is the reference length that maps to one texture tile.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 1]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: box
  - name: size
    type: SFVec3f
    access: field
    default: [2, 2, 2]
    hint: 'Defines the size of the box.                                                                                                             #
      Defines the number of polygons used to represent the box and so its resolution.'
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColorMap ImageTexture { url [ "omnisim://projects/default/worlds/textures/tagged_wall.jpg"
      ] } metalness 0 roughness 0.5 }
    hint: Defines the appearance of the box.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the solid should have a bounding object.
  - name: castShadows
    type: SFBool
    access: field
    default: true
    hint: Defines whether this object should cast shadows.
  - name: recognitionColors
    type: MFColor
    access: field
    default: []
    hint: Is `Solid.recognitionColors`.
