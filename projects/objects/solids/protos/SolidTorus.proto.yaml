# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SolidTorus
  source: projects/objects/solids/protos/SolidTorus.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/solids/protos/SolidTorus.proto
    keywords: [primitive/geometry]
    template_language: javascript
    description: A Solid torus lying in the XY plane, meshed from the torus surface equation and collided as a ring of spheres
      threaded along its centre circle.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 1]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: torus
  - name: majorRadius
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the major radius of the torus.
  - name: minorRadius
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the minor radius of the torus.
  - name: subdivision
    type: SFInt32
    access: field
    default: 24
    hint: Defines the number of polygons used to represent the torus and so its resolution.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
  - name: appearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColorMap ImageTexture { url [ "omnisim://projects/default/worlds/textures/tagged_wall.jpg"
      ] } metalness 0 roughness 0.5 }
    hint: Defines the appearance of the torus.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Is `Solid.physics`.
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the solid should have a bounding object.
