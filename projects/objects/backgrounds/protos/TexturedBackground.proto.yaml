# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TexturedBackground
  source: projects/objects/backgrounds/protos/TexturedBackground.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/backgrounds/protos/TexturedBackground.proto
    keywords: [primitive/background]
    template_language: javascript
    description: 'A named environment preset that drives OmniSim''s procedural atmospheric sky and the image-based lighting
      it bakes. Pair it with TexturedBackgroundLight, which places the matching sun.  The sky is generated by the engine (`Background.atmosphericSky`)
      rather than sampled from photographic cubemap images: OmniSim ray-marches a physical atmosphere and bakes the result
      into the irradiance cube that every PBRAppearance in the scene reflects. Presets therefore select an *atmosphere and
      a sun*, not a picture.  Supported values for the `texture` field:  - dusk - empty_office - entrance_hall - factory -
      mars - noon_building_overcast - noon_cloudy_countryside - noon_park_empty - mountains - music_hall - stadium - stadium_dry  Deprecated
      backgrounds:  - dawn_cloudy_empty - morning_cloudy_empty - noon_cloudy_empty - noon_cloudy_mountains - noon_stormy_empty
      - noon_sunny_empty - noon_sunny_garden - twilight_cloudy_empty'
    tags: [no3dView]
  extern_protos: []
  fields:
  - name: texture
    type: SFString
    access: field
    default: mountains
    hint: Defines the texture of the background.
    enum: [dawn_cloudy_empty, dusk, empty_office, entrance_hall, factory, mars, morning_cloudy_empty, mountains, music_hall,
      noon_building_overcast, noon_cloudy_countryside, noon_cloudy_empty, noon_cloudy_mountains, noon_park_empty, noon_stormy_empty,
      noon_sunny_empty, noon_sunny_garden, stadium, stadium_dry, twilight_cloudy_empty]
  - name: luminosity
    type: SFFloat
    access: field
    default: 1.0
    hint: Is `Background.luminosity`.
  - name: skybox
    type: SFBool
    access: field
    default: true
    hint: Specifies if the `texture` field is used to define the skybox shown in the scene background.
  - name: skyColor
    type: MFColor
    access: field
    default:
    - 0
    - 0
    - 0
    hint: Defines the background color in case the `skybox` field is `FALSE`.
