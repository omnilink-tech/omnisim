# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TexturedBackgroundLight
  source: projects/objects/backgrounds/protos/TexturedBackgroundLight.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/backgrounds/protos/TexturedBackgroundLight.proto
    keywords: [primitive/background]
    template_language: javascript
    description: 'The sun that belongs to a TexturedBackground preset: one DirectionalLight placed by time of day, weather
      and sky tint.  Use the same `texture` value on both PROTOs. OmniSim''s procedural sky scatters THIS light''s direction
      and colour through the atmosphere to produce the skybox and the image-based lighting, so the two always agree: move
      the sun and the sky follows it.  Supported values for the `texture` field:  - dusk - empty_office - entrance_hall -
      factory - mars - noon_building_overcast - noon_cloudy_countryside - noon_park_empty - mountains - music_hall - stadium
      - stadium_dry  Deprecated backgrounds:  - dawn_cloudy_empty - morning_cloudy_empty - noon_cloudy_empty - noon_cloudy_mountains
      - noon_stormy_empty - noon_sunny_empty - noon_sunny_garden - twilight_cloudy_empty'
    tags: [no3dView]
  extern_protos: []
  fields:
  - name: texture
    type: SFString
    access: field
    default: mountains
    hint: Should be equivalent to the 'texture' field of the TexturedBackground.
    enum: [dawn_cloudy_empty, dusk, empty_office, entrance_hall, factory, mars, morning_cloudy_empty, mountains, music_hall,
      noon_building_overcast, noon_cloudy_countryside, noon_cloudy_empty, noon_cloudy_mountains, noon_park_empty, noon_stormy_empty,
      noon_sunny_empty, noon_sunny_garden, stadium, stadium_dry, twilight_cloudy_empty]
  - name: luminosity
    type: SFFloat
    access: field
    default: 1.0
    hint: Multiplies the `Light.intensity` field.
  - name: castShadows
    type: SFBool
    access: field
    default: true
    hint: Defines whether the light should cast shadows.
