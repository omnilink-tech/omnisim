# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: NightSky
  source: projects/objects/backgrounds/protos/NightSky.proto
  header:
    keywords: [primitive/background]
    description: 'OmniSim default background: a dark starfield cubemap with a faint nebula. Drop-in replacement for TexturedBackground
      - just instantiate NightSky in any world. Pair with one or more lights (the cubemap is dark, so the scene needs explicit
      illumination). NightSkyLighting provides a sensible default.'
    tags: [no3dView]
  extern_protos: []
  fields:
  - name: luminosity
    type: SFFloat
    access: field
    default: 1.0
    hint: Is `Background.luminosity`. Bumps starfield brightness.
