# tags: no3dView
# keywords: primitive/background
# A named environment preset that drives OmniSim's procedural atmospheric sky and the image-based lighting it bakes.
# Pair it with TexturedBackgroundLight, which places the matching sun.
#
# The sky is generated by the engine (`Background.atmosphericSky`) rather than
# sampled from photographic cubemap images: OmniSim ray-marches a physical
# atmosphere and bakes the result into the irradiance cube that every
# PBRAppearance in the scene reflects. Presets therefore select an *atmosphere
# and a sun*, not a picture.
#
# Supported values for the `texture` field:
#
# - dusk
# - empty_office
# - entrance_hall
# - factory
# - mars
# - noon_building_overcast
# - noon_cloudy_countryside
# - noon_park_empty
# - mountains
# - music_hall
# - stadium
# - stadium_dry
#
# Deprecated backgrounds:
#
# - dawn_cloudy_empty
# - morning_cloudy_empty
# - noon_cloudy_empty
# - noon_cloudy_mountains
# - noon_stormy_empty
# - noon_sunny_empty
# - noon_sunny_garden
# - twilight_cloudy_empty
# template language: javascript

PROTO TexturedBackground [
  field SFString{"dawn_cloudy_empty", "dusk", "empty_office", "entrance_hall", "factory", "mars", "morning_cloudy_empty", "mountains", "music_hall", "noon_building_overcast", "noon_cloudy_countryside", "noon_cloudy_empty", "noon_cloudy_mountains", "noon_park_empty", "noon_stormy_empty", "noon_sunny_empty", "noon_sunny_garden", "stadium", "stadium_dry", "twilight_cloudy_empty"}
                 texture      "mountains"  # Defines the texture of the background.
  field SFFloat  luminosity   1            # Is `Background.luminosity`.
  field SFBool   skybox       TRUE         # Specifies if the `texture` field is used to define the skybox shown in the scene background.
  field MFColor  skyColor     [0 0 0]      # Defines the background color in case the `skybox` field is `FALSE`.
]
{
  %<
    // Only one preset describes a place that is not on Earth, so the whole
    // twenty-value enum collapses to a choice of two atmospheres. Everything
    // else -- how high the sun sits, how warm it is, how bright -- is a property
    // of the LIGHT, and is chosen by the matching TexturedBackgroundLight. That
    // split is deliberate: the engine's atmospheric sky reads the scene's
    // DirectionalLight and scatters ITS colour and direction through the
    // atmosphere, so the sun and the sky it produces can never disagree.
    const atmosphere = fields.texture.value === 'mars' ? 'mars' : 'earth';

    // `skybox FALSE` means "do not draw an environment, just clear to skyColor",
    // so the procedural sky has to be switched off as well -- an empty preset
    // leaves the engine on its plain-colour path.
    const sky = fields.skybox.value ? atmosphere : '';
  >%
  Background {
    skyColor IS skyColor
    luminosity IS luminosity
    atmosphericSky %<= '"' + sky + '"' >%
  }
}
