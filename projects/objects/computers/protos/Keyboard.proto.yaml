# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Keyboard
  source: projects/objects/computers/protos/Keyboard.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/computers/protos/Keyboard.proto
    keywords: [interior/office]
    template_language: javascript
    description: 'A slim desktop keyboard: a chassis box carrying a procedurally generated grid of key caps. The keys are
      real geometry, not a texture, and are tinted a lighter shade of the chassis `color`. The origin sits under the chassis.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: keyboard
  - name: color
    type: SFColor
    access: field
    default: [0.1, 0.1, 0.1]
    hint: Defines the color of the keyboard.
  - name: mass
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the mass of the keyboard in kg. A value smaller or equal to 0 removes the physics of the keyboard.
