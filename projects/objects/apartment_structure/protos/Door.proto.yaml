# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Door
  source: projects/objects/apartment_structure/protos/Door.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/apartment_structure/protos/Door.proto
    keywords: [building/component]
    template_language: javascript
    description: 'A doorway cut through a wall: a lintel wall above the opening, a three-sided lining, and a leaf hung off
      it on a hinge, carrying a handle.'
  extern_protos:
  - GenericDoorAppearance.proto
  - omnisim://projects/appearances/protos/Roughcast.proto
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - DoorLever.proto
  - omnisim://projects/objects/solids/protos/SolidBox.proto
  - omnisim://projects/objects/geometries/protos/TexturedBox.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: door
  - name: size
    type: SFVec3f
    access: field
    default: [0.2, 1, 2.4]
    hint: Defines the width, height and thickness of the door wall frame.
  - name: canBeOpen
    type: SFBool
    access: field
    default: true
    hint: Defines whether the door is connected to the frame throught a hinge-joint.
  - name: position
    type: SFFloat
    access: field
    default: 0.0
    hint: Defines the position (aperture) of the door.
  - name: jointAtLeft
    type: SFBool
    access: field
    default: true
    hint: Defines on which side the door is connected to the frame.
  - name: selfClosing
    type: SFBool
    access: field
    default: false
    hint: Defines whether the door as a spring effect that makes it closing on itself.
  - name: doorThickness
    type: SFFloat
    access: field
    default: 0.05
    hint: Defines the thickness of the door.
  - name: frameHeight
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the height of the door frame. It should be must be less than or equal to `size.y`.
  - name: frameSize
    type: SFVec3f
    access: field
    default: [0.05, 0.05, 0.05]
    hint: Defines the size of the door frame.
  - name: mainMaterialDensity
    type: SFFloat
    access: field
    default: 200.0
    hint: Defines the density of the door.
  - name: doorAppearance
    type: SFNode
    access: field
    default: GenericDoorAppearance { }
    hint: Defines the door's appearance.
  - name: wallAppearance
    type: SFNode
    access: field
    default: Roughcast { }
    hint: Defines the wall's appearance.
  - name: frameAppearance
    type: SFNode
    access: field
    default: VarnishedPine { }
    hint: Defines the frame's appearance.
  - name: doorHandle
    type: SFNode
    access: field
    default: DoorLever { }
    hint: Defines an optional door handle.
  - name: doorSlot
    type: MFNode
    access: field
    default: []
    hint: Extends the door with new nodes.
  - name: castShadows
    type: SFBool
    access: field
    default: true
    hint: Defines whether this object should cast shadows.
