# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Ceiling
  source: projects/objects/apartment_structure/protos/Ceiling.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/apartment_structure/protos/Ceiling.proto
    keywords: [interior/structure]
    description: A flat rectangular ceiling slab. The default rotation flips the plane so that its visible face looks down
      into the room.
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 2.4]
  - name: rotation
    type: SFRotation
    access: field
    default: [1, 0, 0, 3.14159]
  - name: name
    type: SFString
    access: field
    default: ceiling
  - name: contactMaterial
    type: SFString
    access: field
    default: default
  - name: size
    type: SFVec2f
    access: field
    default: [10, 10]
    hint: Defines the size of the ceiling.
  - name: appearance
    type: SFNode
    access: field
    default: Roughcast { textureTransform TextureTransform { scale 10 10 } }
    hint: Defines the appearance of the ceiling.
  - name: locked
    type: SFBool
    access: field
    default: true
    hint: Is `Solid.locked`.
  - name: castShadows
    type: SFBool
    access: field
    default: true
    hint: Defines whether this object should cast shadows.
