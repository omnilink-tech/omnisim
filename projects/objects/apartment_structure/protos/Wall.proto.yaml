# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Wall
  source: projects/objects/apartment_structure/protos/Wall.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/apartment_structure/protos/Wall.proto
    keywords: [building/component]
    template_language: javascript
    description: 'A straight wall panel: a `size` box lifted so that its foot rests on the z = 0 floor plane.'
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: wall
  - name: size
    type: SFVec3f
    access: field
    default: [0.2, 1, 2.4]
    hint: Defines the size of the wall.
  - name: appearance
    type: SFNode
    access: field
    default: Roughcast { textureTransform TextureTransform { scale 2.4 1 } }
    hint: Defines the appearance of the wall.
