# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Window
  source: projects/objects/apartment_structure/protos/Window.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/apartment_structure/protos/Window.proto
    keywords: [building/component]
    template_language: javascript
    description: 'A customizable wall segment with a window punched through it: the masonry below and above the opening, a
      glazed pane, a sill and a four-bar frame.'
  extern_protos:
  - omnisim://projects/appearances/protos/Roughcast.proto
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - omnisim://projects/objects/solids/protos/SolidBox.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: window
  - name: size
    type: SFVec3f
    access: field
    default: [0.2, 0.8, 2.4]
    hint: Defines the size of the window.
  - name: glassColor
    type: SFColor
    access: field
    default: [0.8, 0.8, 0.8]
    hint: Defines the color of the window.
  - name: glassTransparency
    type: SFFloat
    access: field
    default: 0.8
    hint: Defines the transparency of the window.
  - name: windowThickness
    type: SFFloat
    access: field
    default: 0.05
    hint: Defines the thickness of the window.
  - name: bottomWallHeight
    type: SFFloat
    access: field
    default: 0.7
    hint: Defines the height of the top wall.
  - name: windowHeight
    type: SFFloat
    access: field
    default: 1.4
    hint: Defines the height of the window.
  - name: frameSize
    type: SFVec3f
    access: field
    default: [0.05, 0.02, 0.05]
    hint: Defines the size of the window frame.
  - name: windowSillSize
    type: SFVec2f
    access: field
    default: [0.1, 0.05]
    hint: Defines the size of the sill below the window.
  - name: wallAppearance
    type: SFNode
    access: field
    default: Roughcast { }
    hint: Defines the appearance of the wall.
  - name: frameAppearance
    type: SFNode
    access: field
    default: VarnishedPine { }
    hint: Defines the appearance of the frame.
  - name: castShadows
    type: SFBool
    access: field
    default: true
    hint: Defines whether this object should cast shadows.
