# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: DoorLever
  source: projects/objects/apartment_structure/protos/DoorLever.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/apartment_structure/protos/DoorLever.proto
    keywords: [building/component]
    template_language: javascript
    description: 'A lever door handle: a rose plate sunk through the leaf, a spindle running right through it, and a lever
      arm on each face. Plug it into the `doorHandle` field of a Door.'
  extern_protos:
  - omnisim://projects/appearances/protos/BrushedAluminium.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: door lever
  - name: canTurn
    type: SFBool
    access: field
    default: false
    hint: Defines whether the lever is connected to the door using a hinge-joint.
  - name: jointAtLeft
    type: SFBool
    access: field
    default: true
    hint: Defines on which side is the lever.
  - name: doorThickness
    type: SFFloat
    access: field
    default: 0.05
    hint: Defines the thickness of the door.
  - name: handleThickness
    type: SFFloat
    access: field
    default: 0.0125
    hint: Defines the thickness of the handle.
  - name: handleLength
    type: SFFloat
    access: field
    default: 0.12
    hint: Defines the length of the handle.
  - name: distanceFromDoor
    type: SFFloat
    access: field
    default: 0.065
    hint: Defines the distance between the handle and the door.
  - name: appearance
    type: SFNode
    access: field
    default: BrushedAluminium { }
    hint: Defines the appearance of the lever.
  - name: mass
    type: SFFloat
    access: field
    default: 0.7
    hint: Defines the mass of the lever.
  - name: hasStaticParent
    type: SFBool
    access: field
    default: false
    hint: Defines whether the parent door has physics or not.
  - name: castShadows
    type: SFBool
    access: field
    default: true
    hint: Defines whether this object should cast shadows.
