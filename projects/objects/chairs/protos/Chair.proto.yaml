# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Chair
  source: projects/objects/chairs/protos/Chair.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/chairs/protos/Chair.proto
    keywords: [furniture/chair]
    template_language: javascript
    description: 'A chair (0.5 x 0.5 x 1 m): a leather-topped seat and backrest carried on a varnished pine frame of four
      legs and two rear posts.'
  extern_protos:
  - omnisim://projects/appearances/protos/VarnishedPine.proto
  - omnisim://projects/appearances/protos/ShinyLeather.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: chair
  - name: color
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Define the color of the chair.
  - name: physics
    type: SFNode
    access: field
    default: null
    hint: Define the physcis of the chair.
