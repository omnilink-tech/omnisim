# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: AdvertisingBoard
  source: projects/objects/advertising_board/protos/AdvertisingBoard.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/advertising_board/protos/AdvertisingBoard.proto
    keywords: [exterior/street furniture]
    template_language: javascript
    description: 'A double-sided display board: a rectangular frame with a poster recessed into each face, optionally back-lit,
      standing on up to four poles. The poles can be `cylinder`, `box`, or an `H-shape` mast set behind the board. No artwork
      is shipped with the board -- the two faces show whatever `frontTexture` and `backTexture` are given.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: advertising board
    hint: Defines the name of the advertising board.
  - name: frontTexture
    type: MFString
    access: field
    default:
    - omnisim://projects/default/worlds/textures/omnisim_billboard.png
    hint: Defines the front display texture.
  - name: backTexture
    type: MFString
    access: field
    default:
    - omnisim://projects/default/worlds/textures/omnisim_billboard.png
    hint: Defines the back display texture.
  - name: recognitionColors
    type: MFColor
    access: field
    default:
    - 1
    - 1
    - .nan
    - 0.75
    - 0
    - 0
    hint: Is `Solid.recognitionColors`.
  - name: displayBackLight
    type: SFBool
    access: field
    default: false
    hint: Defines wether the displays are backlit or not.
  - name: displayWidth
    type: SFFloat
    access: field
    default: 4.0
    hint: Defines the width of the displays.
  - name: displayHeight
    type: SFFloat
    access: field
    default: 3.0
    hint: Defines the height of the displays.
  - name: frameThickness
    type: SFFloat
    access: field
    default: 0.6
    hint: Defines the thickness of the frame.
  - name: frameColor
    type: SFColor
    access: field
    default: [0.886275, 0.886275, 0.886275]
    hint: Defines the color of the outer frame of the board.
  - name: poleColor
    type: SFColor
    access: field
    default: [0.886275, 0.886275, 0.886275]
    hint: Defines the color of the pole if present.
  - name: poleNumber
    type: SFInt32
    access: field
    default: 0
    hint: Defines the number of poles. Their position is defined by the number of poles. There can be up to 4 equally spaced
      poles per board.
  - name: poleType
    type: SFString
    access: field
    default: cylinder
    hint: Defines the shape and behavious of the pole(s). `box` and `cylinder` pole types are placed at the center of the
      board and `H-shape` is placed behind. In the case of `H-shape`, backTexture is null and a base is not defined.
    enum: [cylinder, box, H-shape]
  - name: poleHeight
    type: SFFloat
    access: field
    default: 5.0
    hint: Defines the height of the pole.
  - name: poleThickness
    type: SFFloat
    access: field
    default: 0.4
    hint: Defines the thickness of the pole (radius of the cylinder for `cylinder`).
  - name: baseRatio
    type: SFFloat
    access: field
    default: 3.2
    hint: Defines the size of the base for `box` and `cylinder` poles. This field is based on a ratio of `poleThickness`.
