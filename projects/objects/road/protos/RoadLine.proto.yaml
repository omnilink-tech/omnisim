# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: RoadLine
  source: projects/objects/road/protos/RoadLine.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/road/protos/RoadLine.proto
    keywords: [traffic/road]
    description: 'One painted lane marking, described but not drawn: colour, width, and whether it is dashed, continuous,
      doubled, or absent. Put one of these in the `lines` field of a Road for each boundary between two lanes. The Road reads
      these three properties and extrudes the paint itself, along the same banked cross-section it sweeps the tarmac from
      -- which is the only way a marking can stay glued to a road that climbs and rolls. So this node carries the description
      and draws nothing: it is a record, and `no3dView` says so.'
    tags: [no3dView]
  extern_protos: []
  fields: []
