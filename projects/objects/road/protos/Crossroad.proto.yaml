# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Crossroad
  source: projects/objects/road/protos/Crossroad.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/road/protos/Crossroad.proto
    keywords: [traffic/road]
    template_language: javascript
    description: 'The road surface of an intersection: the `shape` polygon is triangulated as a fan around its own centroid,
      so any convex outline works. `id` / `connectedRoadIDs` / `speedLimit` are carried for the SUMO exporter only.'
  extern_protos:
  - omnisim://projects/appearances/protos/Asphalt.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: crossroad
    hint: Defines the the crossroad name.
  - name: id
    type: SFString
    access: field
    default: ''
    hint: Optionally defines a unique ID. A unique ID is required to use the SUMO exporter.
  - name: speedLimit
    type: SFFloat
    access: field
    default: -1.0
    hint: Optionally defines the speed limit. The recommended unit is meter per seconds.
  - name: shape
    type: MFVec3f
    access: field
    default:
    - 0
    - 0
    - .nan
    - 0
    - 1
    - .nan
    - 1
    - 0
    - 0
    hint: Defines the shape of the crossroad.
  - name: connectedRoadIDs
    type: MFString
    access: field
    default: []
    hint: Optionally defines a list of the identifiers of the connected Road. This is required to use the SUMO exporter.
  - name: boundingObject
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road should have a bounding object.
  - name: bottom
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road bottom should be displayed (useful in case of bridge).
  - name: appearance
    type: SFNode
    access: field
    default: Asphalt { }
    hint: Defines the appearance of the road.
  - name: locked
    type: SFBool
    access: field
    default: true
    hint: Is `Solid.locked`.
  - name: castShadows
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road should cast shadows.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
