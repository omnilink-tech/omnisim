# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Road
  source: projects/objects/road/protos/Road.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/road/protos/Road.proto
    keywords: [traffic/road]
    template_language: javascript
    description: 'A road swept along a way-point path: the lanes, the painted markings, the raised sidewalks and the crash
      barriers are all extruded from one banked cross-section that rides the path. The path can be followed literally or smoothed
      with a cubic B-spline, and each part of the road can be given a bounding object independently of the others.'
  extern_protos:
  - RoadLine.proto
  - omnisim://projects/appearances/protos/Asphalt.proto
  - omnisim://projects/appearances/protos/Pavement.proto
  - CrashBarrier.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: road
    hint: Optionally defines the street name.
  - name: id
    type: SFString
    access: field
    default: ''
    hint: Optionally defines a unique ID. A unique ID is required to use the SUMO exporter.
  - name: startJunction
    type: SFString
    access: field
    default: ''
    hint: Optionally defines a reference to the Crossroad connected at the first Road waypoint. Setting correctly this field
      is required to use the SUMO exporter.
  - name: endJunction
    type: SFString
    access: field
    default: ''
    hint: Optionally defines a reference to the Crossroad connected at the last Road waypoint. Setting correctly this field
      is required to use the SUMO exporter.
  - name: width
    type: SFFloat
    access: field
    default: 7.0
    hint: Defines the total width of the road (excluding sidewalk).
  - name: numberOfLanes
    type: SFInt32
    access: field
    default: 2
    hint: Defines the number of lanes (used for the texture mapping).
  - name: numberOfForwardLanes
    type: SFInt32
    access: field
    default: 1
    hint: Defines the number of forward lanes. (this is an information with no impact on the graphical shape).
  - name: speedLimit
    type: SFFloat
    access: field
    default: -1.0
    hint: Optionally defines the speed limit. The recommended unit is meter per seconds.
  - name: lines
    type: MFNode
    access: field
    default: '[ RoadLine { } ]'
    hint: Defines the property of each line separating two lanes.
    enum: ['RoadLine { }']
  - name: roadBorderHeight
    type: SFFloat
    access: field
    default: 0.15
    hint: Defines the height of the sidewalk.
  - name: roadBorderWidth
    type: MFFloat
    access: field
    default:
    - 0.8
    hint: Defines the width of the sidewalk associated to each way-point (if there are less values than way-points, the last
      value is used for the last remaining way-points).
  - name: road
    type: SFBool
    access: field
    default: true
    hint: Defines whether the road surface itself should be created.
  - name: rightBorder
    type: SFBool
    access: field
    default: true
    hint: Defines whether the road should have a right sidewalk.
  - name: leftBorder
    type: SFBool
    access: field
    default: true
    hint: Defines whether the road should have a left sidewalk.
  - name: rightBarrier
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road should have a right barrier.
  - name: leftBarrier
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road should have a left barrier.
  - name: bottom
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road bottom should be displayed (useful in case of bridge).
  - name: wayPoints
    type: MFVec3f
    access: field
    default:
    - 0
    - 0
    - .nan
    - 1
    - 0
    - 0
    hint: Defines the path of the road.
  - name: roadTilt
    type: MFFloat
    access: field
    default:
    - .nan
    - 0
    hint: Defines the tilting angle corresponding to each way-point (if there are less values than way-points, 0 is used for
      the last remaining way-points).
  - name: startingAngle
    type: MFFloat
    access: field
    default: []
    hint: Optionally defines the angle of the road at the first way-point.
  - name: endingAngle
    type: MFFloat
    access: field
    default: []
    hint: Optionally defines the angle of the road at the lasst way-point.
  - name: startLine
    type: MFString
    access: field
    default: []
    hint: Optionally defines the texture used for the road line at the first way-point for each lane. If the string is empty,
      no road line will be added for the corresponding lane. The two textures `textures/road_line_dashed.png` and `textures/road_line_triangle.png`
      may be used in this field.
  - name: endLine
    type: MFString
    access: field
    default: []
    hint: Optionally defines the texture used for the road line at the last way-point for each lane. If the string is empty,
      no road line will be added for the corresponding lane.
  - name: splineSubdivision
    type: SFInt32
    access: field
    default: 4
    hint: Defines the degree of interpolation using B-Splines (if the value is lower than 0, the interpolation is disabled).
  - name: appearance
    type: SFNode
    access: field
    default: Asphalt { }
    hint: Defines the appearance of the road.
  - name: pavementAppearance
    type: SFNode
    access: field
    default: Pavement { }
    hint: Defines the appearance of the sidewalk.
  - name: bottomTexture
    type: MFString
    access: field
    default: []
    hint: Defines the texture to be used for the bottom of the road.
  - name: turnLanesForward
    type: SFString
    access: field
    default: ''
    hint: 'Defines painted arrows before the end of the lanes using the same format as the OSM "turn:lanes:forward" key (e.g.
      "through|left;through|none"). Please refer to the corresponding OSM tag: http://wiki.openstreetmap.org/wiki/Key:turn.'
  - name: turnLanesBackward
    type: SFString
    access: field
    default: ''
    hint: Same as `turnLanesForward` but for the OSM "turn:lanes:backward" key.
  - name: locked
    type: SFBool
    access: field
    default: true
    hint: Is `Solid.locked`.
  - name: roadBoundingObject
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road should have a bounding object.
  - name: rightBorderBoundingObject
    type: SFBool
    access: field
    default: false
    hint: Defines whether the right sidewalk should have a bounding object.
  - name: leftBorderBoundingObject
    type: SFBool
    access: field
    default: false
    hint: Defines whether the left sidewalk should have a bounding object.
  - name: rightBarrierBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the right crash barrier (if any) should have a bounding object.
  - name: leftBarrierBoundingObject
    type: SFBool
    access: field
    default: true
    hint: Defines whether the left crash barrier (if any) should have a bounding object.
  - name: castShadows
    type: SFBool
    access: field
    default: false
    hint: Defines whether the road should cast shadows.
  - name: contactMaterial
    type: SFString
    access: field
    default: default
    hint: Is `Solid.contactMaterial`.
