# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: CrashBarrier
  source: projects/objects/road/protos/CrashBarrier.proto
  header:
    license: Copyright 2026 OmniLink. Apache 2.0.
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/objects/road/protos/CrashBarrier.proto
    keywords: [traffic/road]
    template_language: javascript
    description: 'A guardrail: H-section posts driven along a 3D path, carrying a corrugated W-beam rail on one side of them.'
  extern_protos:
  - omnisim://projects/objects/street_furniture/protos/Fence.proto
  - omnisim://projects/objects/geometries/protos/Extrusion.proto
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: crash barrier
  - name: poleGap
    type: SFFloat
    access: field
    default: 2.0
    hint: Defines the gap between two consecutive poles.
  - name: poleAppearance
    type: SFNode
    access: field
    default: PBRAppearance { roughness 0.7 }
    hint: Defines the appearance of the poles.
  - name: path
    type: MFVec3f
    access: field
    default:
    - 0
    - 0
    - .nan
    - 5
    - 0
    - 0
    hint: Defines the 3D path of the crash barrier.
  - name: barrierOnRightSide
    type: SFBool
    access: field
    default: true
    hint: Defines the side of the barrier.
  - name: subdivision
    type: SFInt32
    access: field
    default: -1
    hint: Defines the degree of interpolation using B-Splines (if the value is lower than 0, the interpolation is disabled).
  - name: enableBoundingObject
    type: SFBool
    access: field
    default: false
    hint: Defines whether the crash barrier should have a bounding object.
