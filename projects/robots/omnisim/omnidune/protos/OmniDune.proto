# documentation url: omnisim://projects/robots/omnisim/omnidune/README.md
# keywords: robot/vehicle
#
# ============================================================================
# OmniDune -- a 4WD long-travel desert / dirt buggy for OmniSim.
#
# Self-contained: no EXTERNPROTO, no external textures, no mesh assets. Every
# collider is a primitive; every material is an inline PBRAppearance.
#
# ----------------------------------------------------------------------------
# WHY THE SUSPENSION IS A SLIDER + LinearMotor AND NOT A SPRING FIELD
# ----------------------------------------------------------------------------
# OmniSim/Newton has NO working passive spring. JointParameters.springConstant
# / dampingConstant and HingeJointParameters.suspension* are PARSED and NOT
# READ on the Newton path -- they were ODE (cfm, erp) quantities and are voided.
# A strut that declares them collapses onto its joint stop. Verified 2026-08-26.
#
# What DOES work: a SliderJoint carrying a LinearMotor is ALWAYS built
# position-controlled (OmBasicJoint.cpp:693 -- positionControlled is true for
# every slider, limits or not), and the Newton PD servo IS the spring:
#
#     k = maxForce * 10.0    [N/m]        (OmBasicJoint.cpp:707)
#     c = maxForce *  0.5    [N.s/m]      (OmBasicJoint.cpp:708)
#
# Hold the strut at setPosition(0) and it behaves as a textbook linear
# spring-damper about the design ride height. Measured on a 100 kg quarter-car
# at maxForce 1962: predicted sag 0.05000 m / zeta 0.350 / f_n 2.229 Hz;
# measured 0.050000 m / 0.340 / 2.179 Hz.
#
# ----------------------------------------------------------------------------
# THE DESIGN LAWS (mass-independent, all verified)
# ----------------------------------------------------------------------------
#     f_n   = sqrt(k / m_corner) / (2*pi)          natural frequency [Hz]
#     zeta  = 0.157 * f_n                          damping ratio is WELDED to f_n
#     sag   = g / (2*pi*f_n)^2                     static deflection [m]
#     H     = maxForce / (m_corner * g)            force headroom, in g
#           = 0.4024 * f_n^2
#
# H >= 2 is the bar for a vehicle that lands jumps (below that the actuator
# saturates and the strut degenerates into a constant-force ram), so the
# frequency floor is f_n >= 2.23 Hz.
#
# ----------------------------------------------------------------------------
# OMNIDUNE'S NUMBERS  (g = 9.81, wheelbase 2.30 m, track 1.70 m, r_wheel 0.34 m)
# ----------------------------------------------------------------------------
#   mass budget                          420.0 kg total
#     sprung  (chassis body)             292.0 kg,  COM at the Robot ORIGIN
#     unsprung, per corner                32.0 kg  (upright + knuckle + wheel)
#   sprung load split (COM 0.92 m ahead of the rear axle)   40 / 60  front/rear
#     front sprung corner mass            58.4 kg
#     rear  sprung corner mass            87.6 kg
#
#   FRONT   target f_n 2.50 Hz
#     k        = 58.4 * (2*pi*2.50)^2  = 14410 N/m
#     maxForce = k / 10                =  1441 N     <- frontStrutForce
#     c        = 1441 * 0.5            =   720.5 N.s/m
#     zeta     = 0.157 * 2.50          =  0.3925
#     sag      = 9.81 / (2*pi*2.50)^2  =  0.03976 m  (39.8 mm)
#     H        = 1441 / (58.4 * 9.81)  =  2.515      (>= 2  OK)
#
#   REAR    target f_n 2.35 Hz
#     k        = 87.6 * (2*pi*2.35)^2  = 19100 N/m
#     maxForce = k / 10                =  1910 N     <- rearStrutForce
#     c        = 1910 * 0.5            =   955.0 N.s/m
#     zeta     = 0.157 * 2.35          =  0.3690
#     sag      = 9.81 / (2*pi*2.35)^2  =  0.04500 m  (45.0 mm)
#     H        = 1910 / (87.6 * 9.81)  =  2.223      (>= 2  OK)
#
#   => 5.2 mm of nose-up rake at rest. Authored at the default translation
#      z = 0.58 (the pose at which the struts sit at EXACTLY zero deflection
#      and the tyres just kiss z = 0), the chassis origin settles to
#      0.58 - (0.0398 + 0.0450)/2 = 0.5376 m. Strut travel is +/-0.20 m
#      (400 mm total, which is the low end of "long travel" for this class),
#      so static sag consumes only 20-22 % of bump travel.
#
# ----------------------------------------------------------------------------
# WEIGHT DISTRIBUTION IS SET BY GEOMETRY, NOT BY Physics.centerOfMass
# ----------------------------------------------------------------------------
# ⚠ On the Newton path a Solid's declared `Physics.centerOfMass` is IGNORED
# unless OMNISIM_NEWTON_USE_LINK_COM is set (OmSolid.cpp:3753, default OFF).
# The body's centre of mass is its LINK ORIGIN. This was measured, not assumed:
# an earlier revision declared centerOfMass [-0.23 0 -0.05] and the four struts
# settled to a 50.0/50.0 front/rear load split, not the intended 40/60 -- the
# per-corner spring forces read 716.8 / 715.5 N against a 2864.5 N sprung
# weight, i.e. the moment balance saw the COM at the wheelbase centre.
#
# So OmniDune's Robot ORIGIN *is* its sprung centre of mass, and the axles are
# placed around it: front x = +1.38, rear x = -0.92 (wheelbase still 2.30 m,
# front load fraction 0.92 / 2.30 = 0.400). Every chassis VISUAL is wrapped in
# one Pose shifted +0.23 m along x, so the bodywork remains centred in the
# wheelbase and the vehicle looks exactly as it did -- only the origin moved.
#
# ----------------------------------------------------------------------------
# TOPOLOGY -- PURE TREE, NO LOOPS. A loop-closing SolidReference gives the
# ENTIRE WORLD no physics: SolverMuJoCo raises "Multiple joints lead to body N"
# and no Newton world is built at all. So: no double wishbone, no 4-link, no
# anti-roll bar, no Watt's link. Each corner is one chain:
#
#   chassis --SliderJoint(strut, axis +Z)--> upright
#             [front only] --HingeJoint(steer, axis +Z)--> knuckle
#                          --HingeJoint(spin, axis +Y)--> wheel
#
# The A-arms, shock bodies and coil-overs are VISUAL geometry hung off the
# upright. Visual children never collide, so they cost nothing and cannot
# close a loop.
#
# MOTOR CONFIGURATION RULES (both are silent failures if you get them wrong):
#   * The STEER motors DECLARE minPosition/maxPosition. A RotationalMotor with
#     no position limits is built as a ke=0 VELOCITY WHEEL and setPosition() on
#     it is silently ignored (OmBasicJoint.cpp:741).
#   * The DRIVE motors deliberately DO NOT declare them -- that ke=0/kd=500
#     velocity-wheel config is exactly what setVelocity() needs (the Husky
#     configuration). The engine logs one "declares no position limits" WARNING
#     per drive motor; that is expected and correct here.
#   * Hinge2Joint and BallJoint motors DO NOT ACTUATE on Newton (measured
#     "broken"), and a Cone boundingObject kills the whole world (KeyError in
#     the MuJoCo converter). Neither is used.
#   * Every collider is a primitive: a mesh / IndexedFaceSet boundingObject is
#     silently convexified by MuJoCo's hull path.
#
# ----------------------------------------------------------------------------
# WHAT THE HOST WORLD MUST DECLARE
# ----------------------------------------------------------------------------
#   WorldInfo {
#     coordinateSystem "ENU"   basicTimeStep 8      newtonSolver "mujoco"
#     newtonGroundMu 1.2       newtonCondim 6       newtonCone "elliptic"
#     newtonImpratio 10        newtonRobotColliders TRUE
#     newtonNjmax 1024         newtonNconmax 1024
#   }
# newtonRobotColliders TRUE is REQUIRED: without it the Robot wrapper body gets
# a 1 mm placeholder shape instead of its own boundingObject and the chassis
# phases straight through terrain. OmniDune's chassis collider is a
# 2.10 x 0.86 x 0.62 box that sits 0.33 m off the ground and 0.27 m inboard of
# the tyres, so it never short-circuits the wheels (the P3.10i/j failure mode).
# newtonCondim 6 matters too: at the stock condim 3 the rolling and torsional
# friction coefficients are never consulted and a wheel rolls forever.
#
# ----------------------------------------------------------------------------
# DEVICES  (wb_robot_get_device names)
#   fl_strut  fr_strut  rl_strut  rr_strut            LinearMotor  (hold at 0)
#   fl_strut_sensor ... rr_strut_sensor               PositionSensor (deflection)
#   fl_steer  fr_steer                                RotationalMotor (+/-0.60 rad)
#   fl_steer_sensor  fr_steer_sensor                  PositionSensor
#   fl_wheel  fr_wheel  rl_wheel  rr_wheel            RotationalMotor (velocity)
#   fl_wheel_sensor ... rr_wheel_sensor               PositionSensor
#   imu                                               InertialUnit (roll/pitch/yaw)
# ============================================================================

PROTO OmniDune [
  field SFVec3f    translation       0 0 0.58    # design ride height: struts at zero deflection, tyres kissing z = 0
  field SFRotation rotation          0 0 1 0
  field SFString   name              "omnidune"
  field SFString   controller        "omnidune_driver"
  field MFString   controllerArgs    [ ]
  field SFString   customData        ""
  field SFBool     supervisor        TRUE        # the shipped controller uses getSelf() for MEASURED pose/velocity telemetry
  field SFColor    bodyColor         0.85 0.33 0.07
  field SFColor    cageColor         0.60 0.61 0.64
  field SFColor    accentColor       0.93 0.78 0.12
  field SFFloat    frontStrutForce   1441        # N -- see the design block above; k = 10x this, c = 0.5x this
  field SFFloat    rearStrutForce    1910        # N
  field SFFloat    strutTravel       0.20        # m, +/- about the design ride height (400 mm total wheel travel)
  field SFFloat    driveTorque       250         # N.m per wheel (traction-limited at ~420 N.m with mu = 1.2)
  field SFFloat    driveMaxVelocity  60          # rad/s -> 20.4 m/s at r = 0.34 m
  field SFFloat    steerLimit        0.60        # rad (+/-34.4 deg) -- MUST be non-zero or the steer motors become velocity wheels
  field SFFloat    steerTorque       800         # N.m
  field SFBool     lightBar          TRUE
  field SFString   physicsBackend    "newton"
]
{
  %<
    // ---------------------------------------------------------------------
    // Geometry constants.
    //
    // ⚠ THE ROBOT ORIGIN IS THE SPRUNG CENTRE OF MASS, NOT THE TUB CENTRE.
    // On the Newton path a Solid's declared Physics.centerOfMass is IGNORED
    // unless OMNISIM_NEWTON_USE_LINK_COM is set (OmSolid.cpp:3753, default
    // OFF): the body's COM is its LINK ORIGIN. Measured on this vehicle with
    // centerOfMass [-0.23 0 -0.05] declared, the four struts settled to a
    // 50.0/50.0 front/rear load split instead of the intended 40/60 -- the
    // field simply never reached the solver. Weight distribution here is
    // therefore set by GEOMETRY: the origin is the COM, and the axles are
    // placed around it. The bodywork is shifted by XCOM so the vehicle still
    // sits centred in its own wheelbase and looks identical.
    //
    //   front axle  x = +HALF_WB + XCOM = +1.38     rear axle  x = -0.92
    //   front load fraction = 0.92 / 2.30 = 0.400   (40 / 60, as designed)
    // ---------------------------------------------------------------------
    const HALF_WB   = 1.15;    // wheelbase 2.30
    const HALF_TR   = 0.85;    // track 1.70
    const XCOM      = 0.23;    // wheelbase centre, measured from the COM origin
    const HUB_Z     = -0.24;
    const WHEEL_R   = 0.34;
    const WHEEL_W   = 0.30;

    const travel    = Math.max(0.02, fields.strutTravel.value);
    const fForce    = Math.max(1.0, fields.frontStrutForce.value);
    const rForce    = Math.max(1.0, fields.rearStrutForce.value);
    const dTorque   = Math.max(1.0, fields.driveTorque.value);
    const dVel      = Math.max(0.1, fields.driveMaxVelocity.value);
    const sTorque   = Math.max(1.0, fields.steerTorque.value);
    let   sLimit    = fields.steerLimit.value;
    if (sLimit <= 0.0) {
      console.error('OmniDune: steerLimit must be > 0 -- a limit-less RotationalMotor is built as a ke=0 velocity wheel and ignores setPosition(). Reset to 0.6.');
      sLimit = 0.6;
    }

    const bc = fields.bodyColor.value;
    const cc = fields.cageColor.value;
    const ac = fields.accentColor.value;
    const CAGE   = cc.r + ' ' + cc.g + ' ' + cc.b;
    const ACCENT = ac.r + ' ' + ac.g + ' ' + ac.b;
    const RUBBER = '0.055 0.055 0.062';
    const RIM    = '0.70 0.68 0.63';
    const SHOCK  = '0.20 0.21 0.24';
    const DARK   = '0.14 0.145 0.155';

    const r = function (v) { return Math.round(v * 1e6) / 1e6; };
    const app = function (col, rough, metal) {
      return 'PBRAppearance { baseColor ' + col + ' roughness ' + rough + ' metalness ' + metal + ' }';
    };
    const box = function (p, s, col, rough, metal) {
      return 'Pose { translation ' + r(p[0]) + ' ' + r(p[1]) + ' ' + r(p[2]) +
             ' children [ Shape { appearance ' + app(col, rough, metal) +
             ' geometry Box { size ' + r(s[0]) + ' ' + r(s[1]) + ' ' + r(s[2]) + ' } } ] }\n';
    };
    // A cylinder whose local +Z axis is mapped onto an arbitrary direction --
    // used for every cage tube, shock body, coil spring and link.
    const tube = function (a, b, rad, col, rough, metal, subdiv) {
      const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
      const L = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (L < 1e-9) return '';
      let ax = -dy, ay = dx;
      let an = Math.sqrt(ax * ax + ay * ay);
      let ang = Math.acos(Math.max(-1, Math.min(1, dz / L)));
      if (an < 1e-9) { ax = 1; ay = 0; an = 1; ang = (dz >= 0) ? 0 : Math.PI; }
      ax = ax / an; ay = ay / an;
      return 'Pose { translation ' + r((a[0] + b[0]) / 2) + ' ' + r((a[1] + b[1]) / 2) + ' ' + r((a[2] + b[2]) / 2) +
             ' rotation ' + r(ax) + ' ' + r(ay) + ' 0 ' + r(ang) +
             ' children [ Shape { appearance ' + app(col, rough, metal) +
             ' geometry Cylinder { height ' + r(L) + ' radius ' + r(rad) + ' subdivision ' + (subdiv || 12) + ' } } ] }\n';
    };
    // A disc lying in the local XY plane (axis along local +Z).
    const disc = function (p, rad, h, col, rough, metal, subdiv) {
      return 'Pose { translation ' + r(p[0]) + ' ' + r(p[1]) + ' ' + r(p[2]) +
             ' children [ Shape { appearance ' + app(col, rough, metal) +
             ' geometry Cylinder { height ' + r(h) + ' radius ' + r(rad) + ' subdivision ' + (subdiv || 24) + ' } } ] }\n';
    };

    // =====================================================================
    // ROLL CAGE -- a desert-race cage, purely visual (no collider). A cage
    // built from colliders would need a Group boundingObject, which silently
    // drops every child but the first unless the world opts into
    // WorldInfo.newtonCompoundColliders.
    // =====================================================================
    const CY  = 0.44;      // cage rail half-width
    const TRR = 0.032;     // tube radius
    let cage = '';
    const sides = [1, -1];
    for (let i = 0; i < 2; i++) {
      const s = sides[i];
      cage += tube([ 0.62, s * CY, -0.19], [ 0.62, s * CY,  0.44], TRR, CAGE, 0.35, 0.85);    // front hoop leg
      cage += tube([-0.32, s * CY, -0.19], [-0.32, s * CY,  0.70], TRR, CAGE, 0.35, 0.85);    // main hoop leg
      cage += tube([ 0.62, s * CY,  0.44], [-0.32, s * CY,  0.70], TRR, CAGE, 0.35, 0.85);    // roof rail
      cage += tube([-0.32, s * CY,  0.70], [-1.22, s * CY, -0.15], TRR, CAGE, 0.35, 0.85);    // rear stay
      cage += tube([ 0.62, s * CY, -0.13], [-0.32, s * CY,  0.12], TRR, CAGE, 0.35, 0.85);    // door bar
      cage += tube([ 0.62, s * CY,  0.12], [-0.32, s * CY, -0.10], TRR, CAGE, 0.35, 0.85);    // door X-brace
      cage += tube([ 0.62, s * CY, -0.19], [ 1.36, s * 0.33, -0.24], TRR, CAGE, 0.35, 0.85);  // nose bar
      cage += tube([-1.22, s * CY, -0.15], [-1.22, s * 0.30, -0.24], TRR, CAGE, 0.35, 0.85);  // tail bar
    }
    cage += tube([ 0.62, -CY,  0.44 ], [ 0.62,  CY,  0.44 ], TRR,   CAGE, 0.35, 0.85);  // windscreen header
    cage += tube([-0.32, -CY,  0.70 ], [-0.32,  CY,  0.70 ], TRR,   CAGE, 0.35, 0.85);  // main hoop top
    cage += tube([ 0.15, -CY,  0.575], [ 0.15,  CY,  0.575], TRR,   CAGE, 0.35, 0.85);  // roof cross
    cage += tube([-0.32, -CY,  0.70 ], [-0.32,  CY,  0.10 ], 0.026, CAGE, 0.35, 0.85);  // harness diagonal
    cage += tube([-1.22, -CY, -0.15 ], [-1.22,  CY, -0.15 ], TRR,   CAGE, 0.35, 0.85);  // rear cross
    cage += tube([ 1.36, -0.33, -0.24], [ 1.36, 0.33, -0.24], TRR,  CAGE, 0.35, 0.85);  // bash bar
    cage += tube([ 0.62, -CY, -0.19 ], [ 0.62,  CY, -0.19 ], TRR,   CAGE, 0.35, 0.85);  // front floor cross

    // Shock towers: outriggers from the tub side rail out to each upper shock
    // eye, so the corners read as attached to the chassis instead of floating
    // beside it. Chassis-fixed (the shock top itself rides with the upright, so
    // they meet exactly at design ride height and part slightly at full travel).
    // Coordinates are in the shifted chassis frame, hence +/-HALF_WB, not the
    // corner's absolute hub x.
    for (let i = 0; i < 2; i++) {
      for (let j = 0; j < 2; j++) {
        const tx = sides[i] * HALF_WB, ty = sides[j];
        cage += tube([tx - sides[i] * 0.34, ty * 0.42,  0.30], [tx, ty * 0.79, 0.27], 0.026, CAGE, 0.35, 0.85);
        cage += tube([tx - sides[i] * 0.34, ty * 0.42, -0.09], [tx, ty * 0.79, 0.27], 0.026, CAGE, 0.35, 0.85);
      }
    }

    // Roof light bar.
    let lights = '';
    if (fields.lightBar.value) {
      lights += tube([0.15, -0.30, 0.575], [0.15, -0.30, 0.755], 0.018, DARK, 0.4, 0.8);
      lights += tube([0.15,  0.30, 0.575], [0.15,  0.30, 0.755], 0.018, DARK, 0.4, 0.8);
      lights += box([0.15, 0, 0.79], [0.09, 0.96, 0.10], DARK, 0.45, 0.7);
      const lys = [-0.36, -0.18, 0.0, 0.18, 0.36];
      for (let i = 0; i < lys.length; i++) {
        lights += 'Pose { translation 0.205 ' + lys[i] + ' 0.79 rotation 0 1 0 1.5708' +
                  ' children [ Shape { appearance PBRAppearance { baseColor 1 0.96 0.86 roughness 0.15 metalness 0' +
                  ' emissiveColor 0.55 0.5 0.36 } geometry Cylinder { height 0.03 radius 0.058 subdivision 16 } } ] }\n';
      }
    }

    // =====================================================================
    // ONE SUSPENSION CORNER.
    //   sx  +1 front / -1 rear      sy  +1 left / -1 right
    // =====================================================================
    const corner = function (tag, sx, sy, steerable, force, upMass, upIn) {
      const hx = sx * HALF_WB + XCOM, hy = sy * HALF_TR;
      const T = tag.toUpperCase();

      // ---- wheel. It is rotated 1 0 0 1.5708, so its LOCAL +Z is the axle
      //      and treads/spokes are laid out in the local XY plane. ----
      let wheelKids = '';
      wheelKids += disc([0, 0, 0], WHEEL_R - 0.005, WHEEL_W, RUBBER, 0.95, 0.0, 28);          // carcass
      wheelKids += disc([0, 0, 0], WHEEL_R - 0.055, WHEEL_W + 0.008, RUBBER, 0.9, 0.0, 28);   // shoulder
      wheelKids += disc([0, 0, 0], 0.225, WHEEL_W + 0.012, RIM, 0.28, 1.0, 24);               // beadlock rim
      wheelKids += disc([0, 0, 0], 0.235, 0.030, '0.55 0.53 0.50', 0.35, 1.0, 24);            // beadlock ring
      wheelKids += disc([0, 0, 0], 0.105, WHEEL_W + 0.030, '0.42 0.42 0.44', 0.4, 0.9, 16);   // hub
      for (let i = 0; i < 6; i++) {                                                            // spokes
        const a = i * Math.PI / 3.0;
        wheelKids += 'Pose { translation ' + r(0.165 * Math.cos(a)) + ' ' + r(0.165 * Math.sin(a)) + ' 0' +
                     ' rotation 0 0 1 ' + r(a) +
                     ' children [ Shape { appearance ' + app(RIM, 0.3, 1.0) +
                     ' geometry Box { size 0.13 0.055 ' + r(WHEEL_W + 0.014) + ' } } ] }\n';
      }
      for (let i = 0; i < 18; i++) {                                                           // tread blocks
        const a = i * 2.0 * Math.PI / 18.0;
        const rr = WHEEL_R - 0.012;
        wheelKids += 'Pose { translation ' + r(rr * Math.cos(a)) + ' ' + r(rr * Math.sin(a)) + ' ' +
                     r((i % 2 === 0) ? 0.055 : -0.055) +
                     ' rotation 0 0 1 ' + r(a) +
                     ' children [ Shape { appearance ' + app('0.09 0.09 0.10', 0.98, 0.0) +
                     ' geometry Box { size 0.055 0.085 0.17 } } ] }\n';
      }

      const wheel =
        'HingeJoint {\n' +
        '  jointParameters HingeJointParameters { axis 0 1 0 anchor 0 0 0 }\n' +
        '  device [\n' +
        //  NO minPosition/maxPosition here ON PURPOSE: their absence is what
        //  selects the ke=0 / kd=500 velocity-wheel config setVelocity() needs.
        '    RotationalMotor { name "' + tag + '_wheel" maxTorque ' + r(dTorque) + ' maxVelocity ' + r(dVel) + ' }\n' +
        '    PositionSensor { name "' + tag + '_wheel_sensor" }\n' +
        '  ]\n' +
        '  endPoint DEF ' + T + '_WHEEL Solid {\n' +
        '    translation 0 0 0\n' +
        '    rotation 1 0 0 1.5708\n' +
        '    name "' + tag + '_wheel"\n' +
        '    children [\n' + wheelKids + '    ]\n' +
        '    boundingObject Cylinder { height ' + r(WHEEL_W) + ' radius ' + r(WHEEL_R) + ' }\n' +
        '    physics Physics { density -1 mass 14 }\n' +
        '  }\n' +
        '}\n';

      // ---- brake disc + caliper, carried by whatever body the wheel hangs on
      const brake =
        'Pose { translation 0 ' + r(sy * 0.02) + ' 0 rotation 1 0 0 1.5708 children [\n' +
        '  Shape { appearance ' + app('0.35 0.33 0.31', 0.55, 0.9) +
        ' geometry Cylinder { height 0.028 radius 0.20 subdivision 24 } }\n] }\n' +
        box([-0.13, sy * 0.02, 0.10], [0.11, 0.09, 0.13], '0.80 0.30 0.06', 0.35, 0.7);

      let inner;
      if (steerable) {
        inner =
          'HingeJoint {\n' +
          '  jointParameters HingeJointParameters { axis 0 0 1 anchor 0 0 0 minStop ' +
                r(-sLimit - 0.08) + ' maxStop ' + r(sLimit + 0.08) + ' }\n' +
          '  device [\n' +
          //  Position limits are MANDATORY here -- without them setPosition() is
          //  silently ignored because the motor is built as a velocity wheel.
          '    RotationalMotor { name "' + tag + '_steer" maxTorque ' + r(sTorque) +
                ' maxVelocity 4 minPosition ' + r(-sLimit) + ' maxPosition ' + r(sLimit) + ' }\n' +
          '    PositionSensor { name "' + tag + '_steer_sensor" }\n' +
          '  ]\n' +
          '  endPoint DEF ' + T + '_KNUCKLE Solid {\n' +
          '    translation 0 0 0\n' +
          '    name "' + tag + '_knuckle"\n' +
          '    children [\n' +
          box([0, 0, 0.06], [0.10, 0.10, 0.24], SHOCK, 0.4, 0.85) +
          brake + wheel +
          '    ]\n' +
          //  A non-colliding link still needs an EXPLICIT boundingObject: a
          //  Solid with mass and no boundingObject gets a r=0.12 fallback
          //  sphere at its origin, which here sits INSIDE the wheel it is the
          //  grandparent of (MuJoCo only auto-excludes immediate parent/child
          //  pairs, so upright-vs-wheel is a live contact). This 30 mm stub is
          //  parked 0.26 m inboard of the hub: clear of the wheel's 0.15 m
          //  half-width, clear of the chassis box's 0.43 m half-width, and
          //  0.30 m off the ground. It exists to NOT collide.
          '    boundingObject Pose { translation 0 ' + r(-sy * 0.26) + ' 0 children [ Sphere { radius 0.03 } ] }\n' +
          //  Explicit tensor: the stub above is not the real geometry, and an
          //  explicit inertiaMatrix suppresses the geometry-derived composer.
          '    physics Physics { density -1 mass 6 centerOfMass [ 0 0 0.02 ] inertiaMatrix [ 0.030 0.028 0.020, 0 0 0 ] }\n' +
          '  }\n' +
          '}\n';
      } else {
        inner = brake + wheel;
      }

      // ---- upright: coil-over, A-arms, links (all visual) ----
      // ⚠ `arm` is an INBOARD offset, so it belongs in the Y slot of the
      // endpoint, not the X slot. An earlier revision had it in X and every
      // A-arm, tie rod and half shaft ran fore-and-aft, poking out of the
      // wheels like spikes. The upright frame is un-rotated, so y = arm lands
      // the inboard end on the tub side rail at |y| = 0.85 - 0.42 = 0.43.
      const arm = -sy * 0.42;   // inboard, to the tub side rail
      let vis = '';
      vis += tube([0, 0, 0.02], [-sy * 0.05, 0, 0.50], 0.048, SHOCK, 0.25, 0.9, 14);              // shock body
      vis += tube([-sy * 0.012, 0, 0.10], [-sy * 0.042, 0, 0.44], 0.082, ACCENT, 0.40, 0.75, 14); // coil-over spring
      vis += disc([-sy * 0.05, 0, 0.505], 0.055, 0.04, SHOCK, 0.3, 0.9, 14);                      // upper shock eye
      vis += box([0, 0, -0.06], [0.12, 0.13, 0.30], SHOCK, 0.45, 0.85);                           // hub carrier
      vis += tube([ 0.16, 0, -0.11], [0, arm,        -0.15], 0.030, CAGE, 0.4, 0.85);  // lower A-arm, fore leg
      vis += tube([-0.16, 0, -0.11], [0, arm,        -0.15], 0.030, CAGE, 0.4, 0.85);  // lower A-arm, aft leg
      vis += tube([ 0.12, 0,  0.15], [0, arm * 0.85,  0.19], 0.024, CAGE, 0.4, 0.85);  // upper A-arm, fore leg
      vis += tube([-0.12, 0,  0.15], [0, arm * 0.85,  0.19], 0.024, CAGE, 0.4, 0.85);  // upper A-arm, aft leg
      if (steerable) {
        vis += tube([-0.13, 0, 0.02], [-0.05, arm * 0.95, 0.02], 0.020, '0.55 0.56 0.58', 0.35, 0.9);  // steering tie rod
      } else {
        vis += tube([0, 0, -0.01], [0, arm * 0.95, -0.01], 0.030, DARK, 0.4, 0.85);              // half shaft
        vis += tube([0.02, 0, 0.06], [sx * 0.42, arm * 0.30, 0.10], 0.026, CAGE, 0.4, 0.85);     // trailing link
      }

      return '' +
        'SliderJoint {\n' +
        '  jointParameters JointParameters {\n' +
        '    axis 0 0 1\n' +
        '    minStop ' + r(-travel) + '\n' +
        '    maxStop ' + r(travel) + '\n' +
        //  springConstant / dampingConstant are deliberately ABSENT: they are
        //  parsed and not read on Newton. The LinearMotor PD servo IS the spring.
        '  }\n' +
        '  device [\n' +
        '    LinearMotor { name "' + tag + '_strut" maxForce ' + r(force) +
              ' maxVelocity 8 minPosition ' + r(-travel) + ' maxPosition ' + r(travel) + ' }\n' +
        '    PositionSensor { name "' + tag + '_strut_sensor" }\n' +
        '  ]\n' +
        '  endPoint DEF ' + T + '_UPRIGHT Solid {\n' +
        '    translation ' + r(hx) + ' ' + r(hy) + ' ' + r(HUB_Z) + '\n' +
        '    name "' + tag + '_upright"\n' +
        '    children [\n' + vis + inner + '    ]\n' +
        //  Same reasoning as the knuckle stub: an explicit non-colliding
        //  collider, parked inboard and high, instead of the r=0.12 fallback
        //  sphere that would sit inside this corner's own wheel.
        '    boundingObject Pose { translation 0 ' + r(-sy * 0.26) + ' 0.30 children [ Sphere { radius 0.03 } ] }\n' +
        '    physics Physics { density -1 mass ' + r(upMass) +
              ' centerOfMass [ 0 0 0.06 ] inertiaMatrix [ ' + upIn + ', 0 0 0 ] }\n' +
        '  }\n' +
        '}\n';
    };

    const corners =
      corner('fl',  1,  1, true,  fForce, 12, '0.222 0.215 0.039') +
      corner('fr',  1, -1, true,  fForce, 12, '0.222 0.215 0.039') +
      corner('rl', -1,  1, false, rForce, 18, '0.342 0.332 0.077') +
      corner('rr', -1, -1, false, rForce, 18, '0.342 0.332 0.077');
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    physicsBackend IS physicsBackend
    model "OmniDune desert buggy"
    children [
      # ====================================================================
      # ALL CHASSIS VISUALS live inside ONE Pose shifted +XCOM along x. That
      # keeps the bodywork centred in the wheelbase while the Robot origin --
      # which IS the sprung centre of mass, because Newton puts a body's COM
      # at its link origin and ignores Physics.centerOfMass -- sits 0.23 m
      # behind the wheelbase centre, giving the 40/60 split. Nothing in here
      # collides; the single chassis collider is the boundingObject below.
      # ====================================================================
      Pose {
      translation %<= XCOM >% 0 0
      children [
      # ---------------------- chassis structure -------------------------
      # Belly / skid pan
      Pose {
        translation 0 0 -0.195
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.30 0.31 0.33 roughness 0.55 metalness 0.85 }
            geometry Box { size 2.16 0.90 0.05 }
          }
        ]
      }
      # Body side pods
      Pose {
        translation -0.05 0.455 -0.02
        children [
          DEF OD_PAINT Shape {
            appearance PBRAppearance { baseColor IS bodyColor roughness 0.42 metalness 0.20 }
            geometry Box { size 1.62 0.06 0.30 }
          }
        ]
      }
      Pose {
        translation -0.05 -0.455 -0.02
        children [ USE OD_PAINT ]
      }
      # Nose cowl + skid plate
      Pose {
        translation 1.16 0 -0.05
        children [
          Shape {
            appearance PBRAppearance { baseColor IS bodyColor roughness 0.42 metalness 0.20 }
            geometry Box { size 0.56 0.74 0.26 }
          }
        ]
      }
      Pose {
        translation 1.16 0 -0.205
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.36 0.37 0.39 roughness 0.5 metalness 0.9 }
            geometry Box { size 0.62 0.80 0.04 }
          }
        ]
      }
      # Rear engine bay + intake scoop
      Pose {
        translation -0.92 0 0.02
        children [
          Shape {
            appearance PBRAppearance { baseColor IS bodyColor roughness 0.42 metalness 0.20 }
            geometry Box { size 0.60 0.78 0.36 }
          }
        ]
      }
      Pose {
        translation -0.82 0 0.24
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.16 0.16 0.17 roughness 0.5 metalness 0.6 }
            geometry Box { size 0.30 0.44 0.12 }
          }
        ]
      }
      # Firewall behind the seats
      Pose {
        translation -0.40 0 0.02
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.24 0.25 0.27 roughness 0.6 metalness 0.8 }
            geometry Box { size 0.05 0.84 0.42 }
          }
        ]
      }
      # Dash, steering column and wheel
      Pose {
        translation 0.50 0 0.10
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.13 0.13 0.14 roughness 0.75 metalness 0.1 }
            geometry Box { size 0.10 0.82 0.22 }
          }
        ]
      }
      Pose {
        translation 0.36 0.20 0.145
        rotation 0 1 0 1.05
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.10 0.10 0.11 roughness 0.8 metalness 0.1 }
            geometry Cylinder { height 0.20 radius 0.018 subdivision 10 }
          }
        ]
      }
      Pose {
        translation 0.28 0.20 0.19
        rotation 0 1 0 1.05
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.85 metalness 0.05 }
            geometry Cylinder { height 0.035 radius 0.155 subdivision 20 }
          }
        ]
      }
      # Seats (driver left, co-driver right)
      Pose {
        translation -0.06 0.20 -0.115
        children [
          DEF OD_SEAT_BASE Shape {
            appearance PBRAppearance { baseColor 0.11 0.11 0.12 roughness 0.9 metalness 0.05 }
            geometry Box { size 0.46 0.38 0.10 }
          }
        ]
      }
      Pose { translation -0.06 -0.20 -0.115 children [ USE OD_SEAT_BASE ] }
      Pose {
        translation -0.26 0.20 0.12
        children [
          DEF OD_SEAT_BACK Shape {
            appearance PBRAppearance { baseColor 0.11 0.11 0.12 roughness 0.9 metalness 0.05 }
            geometry Box { size 0.10 0.38 0.52 }
          }
        ]
      }
      Pose { translation -0.26 -0.20 0.12 children [ USE OD_SEAT_BACK ] }
      Pose {
        translation -0.27 0.20 0.44
        children [
          DEF OD_HEADREST Shape {
            appearance PBRAppearance { baseColor IS accentColor roughness 0.8 metalness 0.1 }
            geometry Box { size 0.10 0.24 0.14 }
          }
        ]
      }
      Pose { translation -0.27 -0.20 0.44 children [ USE OD_HEADREST ] }
      # Spare tyre on the tail
      Pose {
        translation -1.34 0 0.08
        rotation 0 1 0 1.5708
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.055 0.055 0.062 roughness 0.95 metalness 0 }
            geometry Cylinder { height 0.28 radius 0.335 subdivision 24 }
          }
          Shape {
            appearance PBRAppearance { baseColor 0.70 0.68 0.63 roughness 0.3 metalness 1 }
            geometry Cylinder { height 0.30 radius 0.20 subdivision 20 }
          }
        ]
      }
      # Fuel cell under the rear deck
      Pose {
        translation -0.62 0 -0.08
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.22 0.23 0.25 roughness 0.6 metalness 0.7 }
            geometry Box { size 0.34 0.62 0.26 }
          }
        ]
      }

      # ---------------------- roll cage + light bar ---------------------
      %<= cage >%
      %<= lights >%
      ]
      }
      # -------------------- end of the chassis-visual Pose --------------

      # ==================== suspension corners ====================
      %<= corners >%

      # ==================== sensors ====================
      InertialUnit { name "imu" }
    ]
    # The chassis collider clears the tyres by 0.27 m in Y and sits 0.33 m off
    # the ground, so it cannot short-circuit the wheels (P3.10i/j). It is only
    # registered at all when the world declares newtonRobotColliders TRUE.
    boundingObject Pose {
      translation %<= XCOM >% 0 0.06
      children [ Box { size 2.10 0.86 0.62 } ]
    }
    # Sprung mass. The COM is the Robot ORIGIN (Newton ignores the field below
    # unless OMNISIM_NEWTON_USE_LINK_COM is set), which the geometry places
    # 0.23 m behind the wheelbase centre -> 40/60 front/rear, and 0.58 m above
    # the ground -> a 1.47 g static rollover threshold on the 1.70 m track.
    # centerOfMass is declared as the origin so the file states what the solver
    # actually does, and because an inertiaMatrix without one is flagged.
    physics Physics {
      density -1
      mass 292
      centerOfMass [ 0 0 0 ]
      inertiaMatrix [
        52 187 216,
        0 0 0
      ]
    }
  }
}
