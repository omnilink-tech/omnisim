# keywords: samples/rendering
# A display stand that presents one PBR material as a lit specimen on a plinth.
# Its purpose is to show a COMPLETE PBRAppearance map set - base colour,
# roughness, metalness, normal and occlusion - on real geometry, which the
# metalness/roughness sphere grids in this sample deliberately do not do
# (they sweep the scalar parameters with every map set to NULL).
#
# Pass any appearance PROTO from projects/appearances/protos/ as
# `specimenAppearance`; pass `specimenGeometry` a Sphere for curved-surface
# response, or a Box for flat faces, where normal and occlusion maps read most
# clearly.
#
# PROVENANCE: authored for OmniSim by OmniLink. Primitive geometry only
# (Cylinder + the caller's geometry node) and no bundled texture of its own, so
# it carries no third-party asset. It replaces two imported meshes whose
# licences could not be established - see PROVENANCE.md in this directory.
#
# Visual prop: no boundingObject and no physics, per the kinematic-prop rule.

PROTO PbrMaterialSpecimen [
  field SFVec3f    translation        0 0 0
  field SFRotation rotation           0 0 1 0
  field SFString   name               "pbr material specimen"
  field SFNode     specimenAppearance PBRAppearance { }
  field SFNode     specimenGeometry   Sphere { radius 0.17 subdivision 24 ico FALSE }
  field SFNode     plinthAppearance   PBRAppearance { baseColor 0.22 0.22 0.24 roughness 0.85 metalness 0 }
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "pbr material specimen"
    children [
      Pose {
        translation 0 0 0.15
        children [
          Shape {
            appearance IS plinthAppearance
            geometry Cylinder {
              radius 0.16
              height 0.3
              subdivision 32
            }
          }
        ]
      }
      Pose {
        translation 0 0 0.47
        children [
          Shape {
            appearance IS specimenAppearance
            geometry IS specimenGeometry
          }
        ]
      }
    ]
  }
}
