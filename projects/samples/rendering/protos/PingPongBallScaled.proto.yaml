    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/samples/rendering/protos/PingPongBallScaled.proto
    keywords: [samples/rendering]
    description: A ping pong ball 4 times bigger than a real one. A Sphere primitive plus one in-tree texture; bundles no
