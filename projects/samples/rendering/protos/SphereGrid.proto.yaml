# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: SphereGrid
  source: projects/samples/rendering/protos/SphereGrid.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/samples/rendering/protos/SphereGrid.proto
    keywords: [samples/rendering]
    template_language: javascript
    description: A grid of spheres for testing material properties. Procedurally generated Sphere primitives; bundles no mesh
      or texture. See PROVENANCE.md in this directory.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: sphere grid
  - name: color
    type: SFColor
    access: field
    default: [1, 0, 0]
  - name: normalMap
    type: SFNode
    access: field
    default: ImageTexture { }
  - name: baseColorMap
    type: SFNode
    access: field
    default: ImageTexture { }
  - name: roughnessMap
    type: SFNode
    access: field
    default: ImageTexture { }
  - name: transparency
    type: SFFloat
    access: field
    default: 0.01
  - name: widthAndHeight
    type: SFInt32
    access: field
    default: 10
