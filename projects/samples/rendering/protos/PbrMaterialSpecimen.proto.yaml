# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: PbrMaterialSpecimen
  source: projects/samples/rendering/protos/PbrMaterialSpecimen.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/samples/rendering/protos/PbrMaterialSpecimen.proto
    keywords: [samples/rendering]
    description: 'A display stand that presents one PBR material as a lit specimen on a plinth. Its purpose is to show a COMPLETE
      PBRAppearance map set - base colour, roughness, metalness, normal and occlusion - on real geometry, which the metalness/roughness
      sphere grids in this sample deliberately do not do (they sweep the scalar parameters with every map set to NULL).  Pass
      any appearance PROTO from projects/appearances/protos/ as `specimenAppearance`; pass `specimenGeometry` a Sphere for
      curved-surface response, or a Box for flat faces, where normal and occlusion maps read most clearly.  PROVENANCE: authored
      for OmniSim by OmniLink. Primitive geometry only (Cylinder + the caller''s geometry node) and no bundled texture of
      its own, so it carries no third-party asset. It replaces two imported meshes whose licences could not be established
      - see PROVENANCE.md in this directory.  Visual prop: no boundingObject and no physics, per the kinematic-prop rule.'
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
  - name: name
    type: SFString
    access: field
    default: pbr material specimen
  - name: specimenAppearance
    type: SFNode
    access: field
    default: PBRAppearance { }
  - name: specimenGeometry
    type: SFNode
    access: field
    default: Sphere { radius 0.17 subdivision 24 ico FALSE }
  - name: plinthAppearance
    type: SFNode
    access: field
    default: PBRAppearance { baseColor 0.22 0.22 0.24 roughness 0.85 metalness 0 }
