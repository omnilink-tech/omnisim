# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: OmniSimDemoPipeProp
  source: projects/samples/protogen/protos/OmniSimDemoPipeProp.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/samples/protogen/protos/OmniSimDemoPipeProp.proto.py
    keywords: [object/primitive]
    description: Hollow pipe prop with an author-time boundingObject (no JS template, no EXTERNPROTO trampoline). Useful as
      a reference for the protogen.bounding helpers.
  extern_protos: []
  fields:
  - name: translation
    type: SFVec3f
    access: field
    default: [0, 0, 0]
    hint: Pose translation.
  - name: rotation
    type: SFRotation
    access: field
    default: [0, 0, 1, 0]
    hint: Pose rotation.
  - name: name
    type: SFString
    access: field
    default: pipe prop
    hint: Solid name.
