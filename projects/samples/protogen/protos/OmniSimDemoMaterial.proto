# keywords: appearance/mineral
# OmniSim protogen demo: a PBR material parameterized by base color, roughness, and an optional texture transform.

PROTO OmniSimDemoMaterial [
  field SFColor baseColor        0.8 0.8 0.8  # Base color of the material.
  field SFFloat roughness        0.5  # PBR roughness in [0, 1].
  field SFFloat metalness        0  # PBR metalness in [0, 1].
  field SFNode  textureTransform NULL  # Optional 2D texture transform.
  field SFFloat IBLStrength      1  # Strength of ambient lighting from the Background node.
]
{

  PBRAppearance {
    baseColor IS baseColor
    roughness IS roughness
    metalness IS metalness
    textureTransform IS textureTransform
    IBLStrength IS IBLStrength
  }
}
