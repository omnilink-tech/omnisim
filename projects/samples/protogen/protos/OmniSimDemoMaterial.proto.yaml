# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: OmniSimDemoMaterial
  source: projects/samples/protogen/protos/OmniSimDemoMaterial.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/samples/protogen/protos/OmniSimDemoMaterial.proto.py
    keywords: [appearance/mineral]
    description: 'OmniSim protogen demo: a PBR material parameterized by base color, roughness, and an optional texture transform.'
  extern_protos: []
  fields:
  - name: baseColor
    type: SFColor
    access: field
    default: [0.8, 0.8, 0.8]
    hint: Base color of the material.
  - name: roughness
    type: SFFloat
    access: field
    default: 0.5
    hint: PBR roughness in [0, 1].
  - name: metalness
    type: SFFloat
    access: field
    default: 0.0
    hint: PBR metalness in [0, 1].
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Optional 2D texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Strength of ambient lighting from the Background node.
