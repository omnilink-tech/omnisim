          Pose { translation 0  1.2 2 children [ Shape { appearance USE SCAFP geometry Box { size 2.4 0.05 0.05 } } ] }
          Pose { translation 0 -1.2 4 children [ Shape { appearance USE SCAFP geometry Box { size 2.4 0.05 0.05 } } ] }
          Pose { translation 0  1.2 4 children [ Shape { appearance USE SCAFP geometry Box { size 2.4 0.05 0.05 } } ] }
