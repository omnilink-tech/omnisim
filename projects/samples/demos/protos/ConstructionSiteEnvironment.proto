      Pose { translation 2.3 -9.5 0.013 children [ Shape { appearance USE RUT geometry Box { size 0.5 12 0.008 } } ] }
      Pose { translation 1.1 -6.8 0.014 children [ Shape { appearance DEF PUDDLE PBRAppearance { baseColor 0.16 0.18 0.20 roughness 0.07 metalness 0.1 } geometry Box { size 1.5 0.9 0.006 } } ] }
      Pose { translation 2.4 -12 0.014 children [ Shape { appearance USE PUDDLE geometry Box { size 1.0 1.4 0.006 } } ] }
      Pose { translation 13 4 0 children [ Shape { appearance DEF SPOIL DryMud { textureTransform TextureTransform { scale 3 3 } } geometry Cone { bottomRadius 2.3 height 1.5 } } ] }
      Pose { translation 11.5 6.5 0 children [ Shape { appearance USE SPOIL geometry Cone { bottomRadius 1.6 height 1.1 } } ] }

      # ── Concrete mixer truck (serving the tower) ──
      ConcreteMixer { translation 4 14 0 rotation 0 0 1 -1.25 name "site_mixer" }

      # ── Standalone scaffold tower (by the building) ──
      Pose {
        translation 3 20 0
        children [
          Pose { translation -1.2 -1.2 3 children [ Shape { appearance DEF SCAFP GalvanizedMetal { textureTransform TextureTransform { scale 0.3 0.3 } } geometry Box { size 0.07 0.07 6 } } ] }
          Pose { translation  1.2 -1.2 3 children [ Shape { appearance USE SCAFP geometry Box { size 0.07 0.07 6 } } ] }
          Pose { translation -1.2  1.2 3 children [ Shape { appearance USE SCAFP geometry Box { size 0.07 0.07 6 } } ] }
