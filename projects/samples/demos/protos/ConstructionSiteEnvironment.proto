# ConstructionSiteEnvironment — a large, sprawling construction-site
# backdrop bundled as one reusable node. Drop a single instance into a
# world and it provides the dirt ground (with collision), perimeter
# safety fencing + cones, buildings under construction, a hand-built
# tower crane, site office / storage containers, material laydown yards
# (pallet stacks, barrels, pipe + girder racks, sand piles), site
# lighting, a parked forklift, and welfare facilities.
#
# Everything sits OUTSIDE the central work cell (roughly x in [-2.5, 5.5],
# y in [-3, 3]) so it never fouls a robot workspace or a transport lane.
# The ground is an infinite collision Plane at z=0; the dirt visual sits
# 2 cm lower so it does not z-fight a host world's central work pad.
#
# All decorative geometry is static (no physics): props stay put and the
# scene is cheap to simulate.

EXTERNPROTO "omnisim://projects/objects/buildings/protos/Warehouse.proto"
EXTERNPROTO "omnisim://projects/objects/street_furniture/protos/Fence.proto"
EXTERNPROTO "omnisim://projects/objects/traffic/protos/TrafficCone.proto"
EXTERNPROTO "omnisim://projects/objects/traffic/protos/WorkBarrier.proto"
EXTERNPROTO "omnisim://projects/objects/freight/protos/IntermodalContainer.proto"
EXTERNPROTO "omnisim://projects/objects/freight/protos/IntermodalOfficeContainer.proto"
EXTERNPROTO "omnisim://projects/objects/factory/pallet/protos/WoodenPalletStack.proto"
EXTERNPROTO "omnisim://projects/objects/obstacles/protos/OilBarrel.proto"
EXTERNPROTO "omnisim://projects/objects/factory/forklift/protos/Forklift.proto"
EXTERNPROTO "omnisim://projects/objects/lights/protos/ConstructionLamp.proto"
EXTERNPROTO "omnisim://projects/objects/street_furniture/protos/WorkTrashContainer.proto"
EXTERNPROTO "omnisim://projects/objects/street_furniture/protos/PublicToilet.proto"
EXTERNPROTO "omnisim://projects/samples/demos/protos/TowerCrane.proto"
EXTERNPROTO "omnisim://projects/samples/demos/protos/ConstructionFrameBuilding.proto"
EXTERNPROTO "omnisim://projects/samples/demos/protos/DumpTruck.proto"
EXTERNPROTO "omnisim://projects/samples/demos/protos/Excavator.proto"
EXTERNPROTO "omnisim://projects/samples/demos/protos/ConcreteMixer.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/SandyGround.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/DryMud.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/Sand.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/RustyMetal.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/GalvanizedMetal.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/OldPlywood.proto"
EXTERNPROTO "omnisim://projects/appearances/protos/RoughConcrete.proto"

PROTO ConstructionSiteEnvironment [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "construction site environment"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "construction site environment"
    children [

      # ── Dirt ground (visual). Top sits 2 cm below z=0 so a host world's
      #    central work pad reads as a poured slab proud of the dirt. ──
      Pose {
        translation 0 0 -0.22
        children [
          Shape {
            appearance SandyGround {
              colorOverride 0.78 0.72 0.60
              textureTransform TextureTransform { scale 150 150 }
            }
            geometry Box { size 400 400 0.4 }
          }
        ]
      }
      # Churned-mud patches for a worked-in look.
      Pose {
        translation -6 -2 -0.019
        children [
          Shape {
            appearance DryMud { textureTransform TextureTransform { scale 6 6 } }
            geometry Box { size 7 5 0.004 }
          }
        ]
      }
      Pose {
        translation 9 6 -0.019
        children [
          Shape {
            appearance DryMud { textureTransform TextureTransform { scale 5 5 } }
            geometry Box { size 6 5 0.004 }
          }
        ]
      }

      # ── The hero structure: a concrete-frame high-rise under construction,
      #    set north of the work cell so the tower crane appears to serve it
      #    (shots read work cell -> crane -> rising tower). ──
      ConstructionFrameBuilding {
        translation -4 26 0
        rotation 0 0 1 1.5708
        floors 11
        wrapFloors 5
        wrapColor 0.74 0.74 0.70
        name "hero_tower"
      }
      # More frame towers in varied states — an under-construction skyline.
      ConstructionFrameBuilding { translation 14 40 0 rotation 0 0 1 0.2 floors 14 baysX 3 baysY 3 bay 4.0 wrapFloors 9 wrapColor 0.70 0.70 0.66 name "tower_north" }
      ConstructionFrameBuilding { translation -30 26 0 rotation 0 0 1 0.5 floors 8 baysX 4 baysY 2 bay 4.2 wrapFloors 2 wrapColor 0.74 0.74 0.70 name "tower_west" }
      ConstructionFrameBuilding { translation 32 16 0 rotation 0 0 1 -0.6 floors 10 baysX 3 baysY 3 bay 4.2 wrapFloors 6 wrapColor 0.72 0.72 0.68 name "tower_east" }
      ConstructionFrameBuilding { translation 6 64 0 rotation 0 0 1 0.1 floors 16 baysX 3 baysY 3 bay 4.0 wrapFloors 12 wrapColor 0.68 0.69 0.66 name "tower_far" }
      Warehouse {
        translation 48 -28 0
        rotation 0 0 1 1.5708
        name "backdrop_warehouse"
      }

      # ── Tower crane (procedural lattice). Base NW of the cell; the jib
      #    reaches east and the hoist hook hangs over the work zone. ──
