      # ── Perimeter site hoarding (solid mesh panels) with W & E gate gaps.
      #    Blue boards on a galvanised frame, yellow top rail. ──
      Pose { translation 1.5 -4 0.95 children [ Shape { appearance DEF HOARDING PBRAppearance { baseColor 0.18 0.40 0.56 roughness 0.75 metalness 0.1 } geometry Box { size 10.2 0.08 1.8 } } ] }
      Pose { translation 1.5  4 0.95 children [ Shape { appearance USE HOARDING geometry Box { size 10.2 0.08 1.8 } } ] }
      Pose { translation -3.5 -2.75 0.95 children [ Shape { appearance USE HOARDING geometry Box { size 0.08 2.6 1.8 } } ] }
      Pose { translation -3.5  2.75 0.95 children [ Shape { appearance USE HOARDING geometry Box { size 0.08 2.6 1.8 } } ] }
      Pose { translation  6.5 -2.75 0.95 children [ Shape { appearance USE HOARDING geometry Box { size 0.08 2.6 1.8 } } ] }
      Pose { translation  6.5  2.75 0.95 children [ Shape { appearance USE HOARDING geometry Box { size 0.08 2.6 1.8 } } ] }
      # Yellow top rails (south & north runs)
