      # ── Hazard board at the south gate ──
      Pose { translation 1.5 -4.2 1.2 children [ Shape { appearance PBRAppearance { baseColor 0.92 0.1 0.1 roughness 0.6 metalness 0 } geometry Box { size 1.4 0.06 0.9 } } ] }

      # ── Site safety information board (south, by the gate) ──
