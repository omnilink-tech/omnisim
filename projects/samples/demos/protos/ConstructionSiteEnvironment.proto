        Pose { translation 0 -0.03 1.78 children [ Shape { appearance PBRAppearance { baseColor 0.95 0.85 0.1 roughness 0.7 } geometry Box { size 1.8 0.02 0.18 } } ] }
      ] }

      # ── Hi-vis workers (scale + life) ──
      Pose { translation 2.6 -1.6 0 rotation 0 0 1 1.1 children [
        Pose { translation 0 0 0.45 children [ Shape { appearance DEF TROUSER PBRAppearance { baseColor 0.12 0.15 0.3 roughness 0.9 } geometry Box { size 0.32 0.26 0.9 } } ] }
        Pose { translation 0 0 1.16 children [ Shape { appearance DEF HIVIS PBRAppearance { baseColor 0.96 0.55 0.05 roughness 0.85 } geometry Capsule { height 0.5 radius 0.22 } } ] }
        Pose { translation 0 0 1.62 children [ Shape { appearance DEF SKIN PBRAppearance { baseColor 0.78 0.6 0.46 roughness 0.8 } geometry Sphere { radius 0.11 } } ] }
        Pose { translation 0 0 1.72 children [ Shape { appearance DEF HELMET PBRAppearance { baseColor 0.95 0.85 0.1 roughness 0.45 } geometry Cylinder { radius 0.13 height 0.12 } } ] }
      ] }
      Pose { translation -1.0 15.5 0 rotation 0 0 1 -2.4 children [
        Pose { translation 0 0 0.45 children [ Shape { appearance USE TROUSER geometry Box { size 0.32 0.26 0.9 } } ] }
        Pose { translation 0 0 1.16 children [ Shape { appearance USE HIVIS geometry Capsule { height 0.5 radius 0.22 } } ] }
