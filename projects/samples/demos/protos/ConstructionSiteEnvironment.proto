        translation 11 8 0.25
        rotation 0 0 1 0.4
        children [
          Pose { translation 0  0.18 0 rotation 0 1 0 1.5708 children [ Shape { appearance DEF REBARM RustyMetal { textureTransform TextureTransform { scale 0.5 0.5 } } geometry Cylinder { radius 0.04 height 5 } } ] }
          Pose { translation 0  0.06 0.1 rotation 0 1 0 1.5708 children [ Shape { appearance USE REBARM geometry Cylinder { radius 0.04 height 5 } } ] }
          Pose { translation 0 -0.06 0 rotation 0 1 0 1.5708 children [ Shape { appearance USE REBARM geometry Cylinder { radius 0.04 height 5 } } ] }
