# keywords: vehicle/car/sedan/traffic
# Car — a clean procedural rigid sedan: lower body, hood, trunk, glazed
# greenhouse, body-colour roof, bumpers, grille, head/tail lights, door
# mirrors and four wheels with hubs. Parametric paint colour. Forward is
# +X; the wheels sit on z=0 so the car drops straight onto a road at z=0.
# Static decoration (no physics) — matches DumpTruck.proto.

PROTO Car [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "car"
  field SFColor    color       0.70 0.10 0.10   # Body paint colour.
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "car"
    children [
      Group { children [
        # ── body shell (paint) ──
        Pose { translation  0.00 0 0.52 children [ Shape { appearance DEF CAR_BODY PBRAppearance { baseColor IS color metalness 0.6 roughness 0.35 } geometry Box { size 4.30 1.80 0.46 } } ] }   # lower body
        Pose { translation  1.35 0 0.80 children [ Shape { appearance USE CAR_BODY geometry Box { size 1.55 1.74 0.14 } } ] }   # hood
        Pose { translation -1.55 0 0.82 children [ Shape { appearance USE CAR_BODY geometry Box { size 1.20 1.74 0.16 } } ] }   # trunk lid
        Pose { translation -0.15 0 1.36 children [ Shape { appearance USE CAR_BODY geometry Box { size 1.70 1.56 0.10 } } ] }   # roof

        # ── greenhouse (glass band, all around) ──
        Pose { translation -0.05 0 1.10 children [ Shape { appearance DEF CAR_GLASS PBRAppearance { baseColor 0.08 0.10 0.13 metalness 0.5 roughness 0.12 } geometry Box { size 2.00 1.62 0.46 } } ] }
        Pose { translation  1.02 0 1.06 rotation 0 1 0 0.55 children [ Shape { appearance USE CAR_GLASS geometry Box { size 0.06 1.58 0.52 } } ] }   # raked windscreen
        Pose { translation -1.18 0 1.08 rotation 0 1 0 -0.5 children [ Shape { appearance USE CAR_GLASS geometry Box { size 0.06 1.58 0.50 } } ] }   # raked rear glass

        # ── bumpers, grille, trim ──
        Pose { translation  2.10 0 0.55 children [ Shape { appearance DEF CAR_TRIM PBRAppearance { baseColor 0.06 0.06 0.07 metalness 0.3 roughness 0.6 } geometry Box { size 0.18 1.80 0.42 } } ] }   # front bumper
        Pose { translation -2.10 0 0.58 children [ Shape { appearance USE CAR_TRIM geometry Box { size 0.18 1.80 0.42 } } ] }   # rear bumper
        Pose { translation  2.13 0 0.72 children [ Shape { appearance USE CAR_TRIM geometry Box { size 0.06 1.10 0.18 } } ] }   # grille
        Pose { translation  1.00  0.96 1.00 children [ Shape { appearance USE CAR_TRIM geometry Box { size 0.16 0.16 0.12 } } ] }   # mirror L
        Pose { translation  1.00 -0.96 1.00 children [ Shape { appearance USE CAR_TRIM geometry Box { size 0.16 0.16 0.12 } } ] }   # mirror R

        # ── lights ──
        Pose { translation  2.07  0.62 0.66 children [ Shape { appearance DEF CAR_HEAD PBRAppearance { baseColor 0.90 0.92 0.85 roughness 0.2 emissiveColor 0.35 0.35 0.30 } geometry Box { size 0.08 0.34 0.20 } } ] }
        Pose { translation  2.07 -0.62 0.66 children [ Shape { appearance USE CAR_HEAD geometry Box { size 0.08 0.34 0.20 } } ] }
        Pose { translation -2.07  0.66 0.74 children [ Shape { appearance DEF CAR_TAIL PBRAppearance { baseColor 0.50 0.04 0.04 roughness 0.3 emissiveColor 0.45 0.03 0.03 } geometry Box { size 0.06 0.30 0.20 } } ] }
        Pose { translation -2.07 -0.66 0.74 children [ Shape { appearance USE CAR_TAIL geometry Box { size 0.06 0.30 0.20 } } ] }
      ] }

      # ── wheels (visual): radius 0.33, sit on z=0 ──
      DEF CAR_WHEEL Pose { translation 1.42 0.84 0.33 rotation 1 0 0 1.5708 children [
        Shape { appearance DEF CAR_TIRE PBRAppearance { baseColor 0.04 0.04 0.05 roughness 0.9 } geometry Cylinder { radius 0.33 height 0.22 } }
        Pose { translation 0 0.12 0 children [ Shape { appearance DEF CAR_HUB PBRAppearance { baseColor 0.62 0.62 0.64 metalness 0.8 roughness 0.4 } geometry Cylinder { radius 0.15 height 0.04 } } ] }
      ] }
      Pose { translation 1.42 -0.84 0.33 rotation 1 0 0 1.5708 children [
        Shape { appearance USE CAR_TIRE geometry Cylinder { radius 0.33 height 0.22 } }
        Pose { translation 0 -0.12 0 children [ Shape { appearance USE CAR_HUB geometry Cylinder { radius 0.15 height 0.04 } } ] }
      ] }
      Pose { translation -1.42 0.84 0.33 rotation 1 0 0 1.5708 children [
        Shape { appearance USE CAR_TIRE geometry Cylinder { radius 0.33 height 0.22 } }
        Pose { translation 0 0.12 0 children [ Shape { appearance USE CAR_HUB geometry Cylinder { radius 0.15 height 0.04 } } ] }
      ] }
      Pose { translation -1.42 -0.84 0.33 rotation 1 0 0 1.5708 children [
        Shape { appearance USE CAR_TIRE geometry Cylinder { radius 0.33 height 0.22 } }
        Pose { translation 0 -0.12 0 children [ Shape { appearance USE CAR_HUB geometry Cylinder { radius 0.15 height 0.04 } } ] }
      ] }
    ]
  }
}
