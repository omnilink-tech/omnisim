# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ThreadMetalPlate
  source: projects/appearances/protos/ThreadMetalPlate.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/appearances/protos/ThreadMetalPlate.proto
    keywords: [appearance/metal]
    template_language: javascript
    description: A worn paint layer on a metal surface. The type of metal surface can be set using the `type` field.
  extern_protos: []
  fields:
  - name: type
    type: SFString
    access: field
    default: oval
    hint: Defines the motif type on the material.
    enum: [oval, square]
  - name: colorOverride
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color to be multiplied with the texture color.
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
