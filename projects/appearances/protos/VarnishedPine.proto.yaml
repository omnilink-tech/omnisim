# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: VarnishedPine
  source: projects/appearances/protos/VarnishedPine.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/appearances/protos/VarnishedPine.proto
    keywords: [appearance/wood]
    description: A pine wood material covered with a layer of varnish. The color can be overridden using the `colorOverride`
      field.
  extern_protos: []
  fields:
  - name: colorOverride
    type: SFColor
    access: field
    default: [0.8039, 0.6745, 0.5764]
    hint: Defines the color to be multiplied with the texture color.
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
