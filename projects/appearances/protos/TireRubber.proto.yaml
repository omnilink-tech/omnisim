# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: TireRubber
  source: projects/appearances/protos/TireRubber.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/appearances/protos/TireRubber.proto
    keywords: [appearance/rubber]
    template_language: javascript
    description: A tire rubber material. It can be a car tire or a bike tire.
  extern_protos: []
  fields:
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
  - name: type
    type: SFString
    access: field
    default: car
    hint: Defines the type of tire.
    enum: [bike, car]
