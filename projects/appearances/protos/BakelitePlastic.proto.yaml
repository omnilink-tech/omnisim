# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: BakelitePlastic
  source: projects/appearances/protos/BakelitePlastic.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/appearances/protos/BakelitePlastic.proto
    keywords: [appearance/plastic]
    template_language: javascript
    description: A bakelite plastic.
  extern_protos: []
  fields:
  - name: color
    type: SFString
    access: field
    default: red
    hint: Defines the color of the plastic.
    enum: [red, braun]
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
