# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: RustyMetal
  source: projects/appearances/protos/RustyMetal.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/appearances/protos/RustyMetal.proto
    keywords: [appearance/metal]
    template_language: javascript
    description: An old battered steel material. The color can be overridden using the `colorOverride` field and the amount
      of rust can be set using the `rustLevel` field.
  extern_protos: []
  fields:
  - name: rustLevel
    type: SFInt32
    access: field
    default: 1
    hint: Defines how much the metal is rusted.
    enum: [1, 2]
  - name: colorOverride
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color to be multiplied with the texture color.
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
