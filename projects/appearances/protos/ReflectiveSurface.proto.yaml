# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: ReflectiveSurface
  source: projects/appearances/protos/ReflectiveSurface.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://webots.cloud/run?url=https://github.com/cyberbotics/webots/blob/released/projects/appearances/protos/ReflectiveSurface.proto
    keywords: [appearance/other]
    template_language: javascript
    description: A reflective surface material.
  extern_protos: []
  fields:
  - name: metalness
    type: SFFloat
    access: field
    default: 0.5
  - name: emissiveColor
    type: SFColor
    access: field
    default: [0, 0, 0]
  - name: emissiveIntensity
    type: SFFloat
    access: field
    default: 1.0
  - name: colorOverride
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color to be multiplied with the texture color.
  - name: useBaseColorMap
    type: SFBool
    access: field
    default: true
    hint: Defines wheather the base color texture should be used or not.
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
