# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: Leather
  source: projects/appearances/protos/Leather.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/appearances/protos/Leather.proto
    keywords: [appearance/leather]
    template_language: javascript
    description: A leather material. The color can be overridden using the `colorOverride` field.
  extern_protos: []
  fields:
  - name: colorOverride
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color to be multiplied with the texture color.
  - name: tone
    type: SFString
    access: field
    default: dark
    hint: Defines the tone of the leather.
    enum: [dark, light]
  - name: type
    type: SFString
    access: field
    default: dollaro
    hint: Defines the type of the leather.
    enum: [dollaro, grain]
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
