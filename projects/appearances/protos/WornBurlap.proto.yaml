# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: WornBurlap
  source: projects/appearances/protos/WornBurlap.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/appearances/protos/WornBurlap.proto
    keywords: [appearance/fabric]
    description: A worn burlap material. The color can be selected using the `colorOverride` field.
  extern_protos: []
  fields:
  - name: colorOverride
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the burlap's color.
  - name: textureTransform
    type: SFNode
    access: field
    default: TextureTransform { scale 4 4 }
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Cubemap node.
