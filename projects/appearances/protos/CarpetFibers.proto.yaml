# OmniSim PROTO schema sidecar.
# `auto:` is regenerated by `python -m omnisim proto schema`; edits there are lost.
# `extra:` is hand-curated and preserved across regeneration.
auto:
  proto: CarpetFibers
  source: projects/appearances/protos/CarpetFibers.proto
  header:
    license: Apache License 2.0
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    documentation_url: https://github.com/omnilink-tech/omnisim/blob/main/projects/appearances/protos/CarpetFibers.proto
    keywords: [appearance/fabric]
    template_language: javascript
    description: A woolen carpet material.
  extern_protos: []
  fields:
  - name: colorOverride
    type: SFColor
    access: field
    default: [1, 1, 1]
    hint: Defines the color to be multiplied with the texture color.
  - name: type
    type: SFString
    access: field
    default: wooly
    hint: Defines the carpet type.
    enum: [wooly, synthetic, pattern]
  - name: textureTransform
    type: SFNode
    access: field
    default: null
    hint: Defines an optional 2d texture transform.
  - name: IBLStrength
    type: SFFloat
    access: field
    default: 1.0
    hint: Defines the strength of ambient lighting from the Background node.
