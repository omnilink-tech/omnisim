; OmniSim pytest configuration.
;
; WHY THIS FILE EXISTS: a bare `pytest` at the repo root used to collect ~131 of
; the ~900 tests and stop, WITHOUT reporting that it had stopped. Four files in
; this tree are standalone scripts, not pytest modules, and pytest imported them
; during collection:
;
;   tests/command_test.py        matches pytest's *other* default pattern,
;                                `*_test.py`. At MODULE scope it writes a
;                                `slave.py` fixture into the current working
;                                directory, spawns it, and reassigns
;                                `sys.stdout` to a raw fd -- which destroys
;                                pytest's captured stdout. Collection then dies
;                                with `OSError: [Errno 9] Bad file descriptor`
;                                and the remaining ~90% of the suite is silently
;                                skipped.
;   tests/test_suite.py          the upstream Webots suite runner; its argparse
;                                sees pytest's argv and raises SystemExit at
;                                import (INTERNALERROR).
;   tests/test_sources.py        runs unittest discover + sys.exit() at import.
;   tests/default/controllers/…  a controller with sys.exit(0) in a class body.
;
; Dropping the `*_test.py` pattern excludes the first; norecursedirs excludes the
; rest.
;
; `tests/default` is an engine-driven suite reached by `python -m omnisim
; test-group`. ⚠ `tests/sources` is NOT, and must not be wired up that way: the
; group runner globs tests/<group>/worlds/, and tests/sources has no worlds/, so
; a `sources` group would resolve to an empty world list and PASS having checked
; nothing. It is a pure-python lint suite, excluded here for COST (it walks the
; whole tree, ~10 min), not because it cannot be collected.
;
; `docs/tests` is excluded for the same reason and runs via `make tests-docs`
; (~2 s). Both are excluded from BARE pytest only -- norecursedirs never blocks
; an explicit path argument, so `pytest docs/tests` works.
;
; This block previously claimed `tests/sources` was "run by test-group". It was
; not, and nothing else ran it either, so 28 lint tests sat un-executed while
; two dev scripts carried comments assuming they were green.
;
; Explicit paths still work as usual: `pytest tests/harness` and the CI
; workflow's named files are unaffected by testpaths.

[pytest]
python_files = test_*.py

; `engine` is applied AT COLLECTION by tests/conftest.py to every module whose
; source launches or requires the simulator binary (pattern list there), so
; `pytest -m "not engine"` is the engine-free unit lane (`make tests-unit`).
; The same conftest fails a session whose engine bring-up skips exceed
; OMNISIM_BRINGUP_SKIP_CAP (default 2): an engine that never came up must not
; read as a green suite.
markers =
    engine: launches or requires the simulator binary

; Two standalone runners live directly under tests/ and cannot be excluded by
; directory: both parse argv / exit at import time, which aborts collection
; for the whole run (pytest reports INTERNALERROR, not a per-file error).
; Run them the way they are meant to be run: `python tests/test_suite.py`.
addopts =
    --ignore=tests/test_suite.py
    --ignore=tests/test_sources.py
    ; DESTRUCTIVE. tests/test_worlds.py is 'test and SAVE all the released
    ; worlds' -- it loads each one through the engine and writes it back,
    ; expanding every PROTO inline. A bare `pytest` therefore rewrote 163
    ; tracked .wbt files in place (thousands of inserted lines each) and left
    ; the tree dirty. It also needs a built binary. Run it deliberately:
    ;     python -m omnisim test-world <world>      (one world)
    ;     python -m pytest tests/test_worlds.py     (all, expect rewrites)
    --ignore=tests/test_worlds.py
    ; Two packages each ship a tests/test_smoke.py and neither tests dir is
    ; a package, so the default prepend import mode sees one basename twice
    ; and errors. importlib imports by location and does not care.
    --import-mode=importlib
norecursedirs =
    ; Every world-test directory ships a `controllers/` tree. Those are ENGINE
    ; controllers -- they import `controller`/`Supervisor`, and several call
    ; sys.exit() at class scope -- so collecting them is always wrong. Ten of
    ; them are named test_suite_supervisor/test_suite_supervisor.py, which
    ; matches the default test pattern exactly.
    controllers
    tests/sources
    docs/tests
    ; A git worktree under .claude/ is a second full copy of this tree, so
    ; collecting it makes every test basename ambiguous ("import file mismatch").
    ; Dev-only -- .claude/ never ships -- but it breaks the dev run.
    .claude
    ; Dev-only trees that never ship (see scripts/release/publish_deny.txt).
    social
    cloud
    .build_tmp
    _scratch
    msys64
    dependencies
    src/glm
    src/stb
