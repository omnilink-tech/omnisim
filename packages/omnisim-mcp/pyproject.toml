[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisim-mcp"
version = "0.2.0"
description = "Model Context Protocol server over the OmniSim World Harness — give an agent a robotics workshop from Claude Desktop, Cursor, and other MCP clients: load a world, run it, pause and break on an event, inspect the scene, talk to the robot over its gate-vetted command surface, and ask what actually happened. Zero runtime dependencies (pure stdlib)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OmniLink", email = "info@omnilink-agents.com" }]
requires-python = ">=3.9"
keywords = ["omnisim", "mcp", "model-context-protocol", "robotics", "agents", "harness", "debugging", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Robotics",
]
# Intentionally NO runtime dependencies: the MCP stdio protocol and the harness
# HTTP client are both implemented on the stdlib so this runs on a fresh clone
# (and under OmniSim's embedded interpreter) with nothing installed.
dependencies = []

[project.scripts]
omnisim-mcp = "omnisim_mcp.server:main"

[project.urls]
Homepage      = "https://github.com/omnilink-tech/omnisim"
Repository    = "https://github.com/omnilink-tech/omnisim"
Documentation = "https://github.com/omnilink-tech/omnisim/tree/main/packages/omnisim-mcp"
Issues        = "https://github.com/omnilink-tech/omnisim/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# The server intentionally catches the broad boundary around each JSON-RPC
# request so a buggy tool cannot terminate the stdio process. Long adjacent
# description strings keep the MCP schema readable next to each handler.
ignore = ["BLE001", "ISC004"]
