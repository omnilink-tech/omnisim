<!--
  OmniSim transmittance-LUT visualiser.

  Runs the same GLSL math that lives in
  resources/wren/shaders/sky_transmittance.frag, but in a browser
  against a fullscreen quad, so the LUT can be validated visually
  before / independently of the OmniSim rebuild.

  What you should see:
    - Earth: blue-tinted band at the top (zenith rays, thin air -> high
      transmittance for short wavelengths), pinching to nearly black
      at the horizon (long path, blue absorbed first by Rayleigh, then
      red), pitch black for sub-horizon rays (planet blocks the sun).
    - Mars: warm beige-tinted band at the top (Rayleigh ~1% of Earth's
      AND red-biased -> reddish high transmittance), softer transition
      to dark at the horizon than Earth (atmosphere is thinner).

  Parameterisation:
    x axis: mu = cos(view-from-zenith), maps linearly to [-1, 1].  Left
            edge = looking down, right edge = looking up.
    y axis: altitude h in [0, atmosphereHeightKm].  Bottom = on the
            ground, top = at the atmosphere boundary.

  This is exactly the same parameterisation the OmniSim transmittance
  LUT will use, so the visual pattern here is the reference for
  whether the in-OmniSim LUT bake came out right.

  Keep this shader byte-equivalent to sky_transmittance.frag.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniSim transmittance LUT — preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ccc;
               font-family: ui-monospace, "Cascadia Code", Consolas, monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 10px 14px;
         background: rgba(0,0,0,0.55); border: 1px solid #333; border-radius: 6px;
         font-size: 12px; line-height: 1.55; backdrop-filter: blur(6px); user-select: none; min-width: 260px; }
  #hud h1 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: #fff;
            text-transform: uppercase; letter-spacing: 0.05em; }
  #hud .seg { display: inline-flex; gap: 2px; margin-top: 4px; }
  #hud .seg button { background: #1a1a1a; color: #888; border: 1px solid #333;
                     padding: 4px 10px; font: inherit; font-size: 11px; cursor: pointer; }
  #hud .seg button.on { background: #fff; color: #000; border-color: #fff; }
  #hud .legend { color: #888; font-size: 11px; margin-top: 8px; line-height: 1.6; }
  #hud .legend span { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Transmittance LUT</h1>
  <div class="seg" id="preset">
    <button data-preset="earth" class="on">Earth</button>
    <button data-preset="mars">Mars</button>
  </div>
  <div class="legend">
    x-axis: <span>&mu;</span> = cos(view from zenith), &minus;1 (down) to +1 (up)<br>
    y-axis: altitude, 0 (ground) to atmosphere top<br>
    colour: per-channel transmittance from sample &rarr; atmosphere exit
  </div>
</div>
<script>
"use strict";

const VERT = `#version 300 es
in vec2 vPos;
out vec2 vUv;
void main() {
  vUv = vPos * 0.5 + 0.5;
  gl_Position = vec4(vPos, 0.0, 1.0);
}`;

// Identical to resources/wren/shaders/sky_transmittance.frag — keep
// in sync.  When you change the math in one place, copy it to the
// other before committing.
const FRAG = `#version 300 es
precision highp float;

in  vec2 vUv;
out vec4 outColor;

uniform float bottomRadiusKm;
uniform float topRadiusKm;
uniform vec3  rayleighScattering;
uniform float rayleighDensityExpScale;
uniform vec3  mieScattering;
uniform vec3  mieAbsorption;
uniform float mieDensityExpScale;
uniform vec3  absorptionExtinction;

const int OPTICAL_DEPTH_STEPS = 40;
const float METRES_PER_KM = 1000.0;

float raySphereExit(vec3 origin, vec3 dir, float radius) {
  float b = dot(origin, dir);
  float c = dot(origin, origin) - radius * radius;
  float d = b*b - c;
  if (d < 0.0) return -1.0;
  return -b + sqrt(d);
}
float raySphereEnter(vec3 origin, vec3 dir, float radius) {
  float b = dot(origin, dir);
  float c = dot(origin, origin) - radius * radius;
  float d = b*b - c;
  if (d < 0.0) return -1.0;
  float t = -b - sqrt(d);
  return (t < 0.0) ? -1.0 : t;
}

void main() {
  float mu = vUv.x * 2.0 - 1.0;
  float h  = vUv.y * (topRadiusKm - bottomRadiusKm);

  vec3 origin = vec3(0.0, bottomRadiusKm + h, 0.0);
  vec3 dir = vec3(sqrt(max(0.0, 1.0 - mu*mu)), mu, 0.0);

  if (raySphereEnter(origin, dir, bottomRadiusKm) > 0.0) {
    outColor = vec4(0.0, 0.0, 0.0, 1.0);
    return;
  }

  float tEnd = raySphereExit(origin, dir, topRadiusKm);
  float dt = tEnd / float(OPTICAL_DEPTH_STEPS);

  vec3 tau = vec3(0.0);
  for (int i = 0; i < OPTICAL_DEPTH_STEPS; ++i) {
    vec3 p = origin + dir * (dt * (float(i) + 0.5));
    float alt = max(0.0, length(p) - bottomRadiusKm);
    float rayleighDensity = exp(alt * rayleighDensityExpScale);
    float mieDensity      = exp(alt * mieDensityExpScale);
    vec3 extinction = rayleighScattering * rayleighDensity
                    + (mieScattering + mieAbsorption) * mieDensity
                    + absorptionExtinction * rayleighDensity;
    tau += extinction * dt * METRES_PER_KM;
  }

  outColor = vec4(exp(-tau), 1.0);
}`;

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
if (!gl) {
  document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:20px;">WebGL2 not available.</p>';
  throw new Error("WebGL2 required");
}
function compile(t, s) {
  const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(sh)); throw new Error("compile"); }
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); throw new Error("link"); }
gl.useProgram(prog);

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "vPos");
gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const n of ["bottomRadiusKm","topRadiusKm","rayleighScattering","rayleighDensityExpScale",
                 "mieScattering","mieAbsorption","mieDensityExpScale","absorptionExtinction"])
  U[n] = gl.getUniformLocation(prog, n);

const PRESETS = {
  earth: {
    bottomRadiusKm: 6360.0, topRadiusKm: 6460.0,
    rayleighScattering: [5.802e-6, 13.558e-6, 33.1e-6],
    rayleighDensityExpScale: -1.0/8.0,
    mieScattering: [3.996e-6, 3.996e-6, 3.996e-6],
    mieAbsorption: [4.4e-6, 4.4e-6, 4.4e-6],
    mieDensityExpScale: -1.0/1.2,
    absorptionExtinction: [0.65e-6, 1.881e-6, 0.085e-6],
  },
  mars: {
    bottomRadiusKm: 3389.5, topRadiusKm: 3489.5,
    rayleighScattering: [1.9918e-6, 1.357e-6, 0.575e-6],
    rayleighDensityExpScale: -1.0/11.1,
    mieScattering: [2.0e-5, 1.7e-5, 1.4e-5],
    mieAbsorption: [1.0e-5, 1.2e-5, 1.5e-5],
    mieDensityExpScale: -1.0/11.0,
    absorptionExtinction: [0.15e-6, 0.3e-6, 0.85e-6],
  },
};

function setPreset(name) {
  const p = PRESETS[name];
  gl.uniform1f(U.bottomRadiusKm, p.bottomRadiusKm);
  gl.uniform1f(U.topRadiusKm, p.topRadiusKm);
  gl.uniform3fv(U.rayleighScattering, p.rayleighScattering);
  gl.uniform1f(U.rayleighDensityExpScale, p.rayleighDensityExpScale);
  gl.uniform3fv(U.mieScattering, p.mieScattering);
  gl.uniform3fv(U.mieAbsorption, p.mieAbsorption);
  gl.uniform1f(U.mieDensityExpScale, p.mieDensityExpScale);
  gl.uniform3fv(U.absorptionExtinction, p.absorptionExtinction);
  for (const b of document.querySelectorAll("#preset button"))
    b.classList.toggle("on", b.dataset.preset === name);
  draw();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
function draw() { gl.drawArrays(gl.TRIANGLES, 0, 3); }

window.addEventListener("resize", () => { resize(); draw(); });
for (const b of document.querySelectorAll("#preset button"))
  b.addEventListener("click", () => setPreset(b.dataset.preset));

resize();
setPreset("earth");
</script>
</body>
</html>
