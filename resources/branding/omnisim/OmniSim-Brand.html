  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

D-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"14d5a3b0-af54-418c-858b-3bc108a2421f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   OmniSim — Brand Identity\n   Black surfaces, mimosa accent, mono labels everywhere.\n   ════════════════════════════════════════════════════════════ */\n\n:root {\n  --bg: #0a0a06;\n  --bg-elev: #14140d;\n  --bg-sunk: #060604;\n  --line: #2a2a1f;\n  --line-strong: #3f3f2e;\n  --ink: #f6f4ef;\n  --ink-mute: #b4b3a4;\n  --ink-faint: #6f6e60;\n  --mimosa: #f6e905;\n  --mimosa-dim: #d4c500;\n  --mimosa-soft: #faf6a4;\n\n  --sans: \"Space Grotesk\", ui-sans-serif, system-ui, sans-serif;\n  --mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nhtml { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--mimosa) 40%, transparent); }\na:hover { border-bottom-color: var(--mimosa); color: var(--mimosa); }\n\n.mono {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink-faint);\n}\n\n.bk {\n  display: grid;\n  gap: 0;\n  max-width: 1280px;\n  margin: 0 auto;\n  border-left: 1px solid var(--line);\n  border-right: 1px solid var(--line);\n}\n\n/* ───────────── Cover ───────────── */\n.cover {\n  position: relative;\n  min-height: 92vh;\n  display: grid;\n  grid-template-rows: auto 1fr auto;\n  padding: 36px clamp(28px, 5vw, 56px);\n  background: var(--bg);\n  border-bottom: 1px solid var(--line);\n  overflow: hidden;\n}\n.cover__grid {\n  position: absolute;\n  inset: 0;\n  background-image:\n    linear-gradient(to right, color-mix(in srgb, var(--line) 60%, transparent) 1px, transparent 1px),\n    linear-gradient(to bottom, color-mix(in srgb, var(--line) 60%, transparent) 1px, transparent 1px);\n  background-size: 80px 80px;\n  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);\n  opacity: 0.5;\n  pointer-events: none;\n}\n.cover__top, .cover__bottom {\n  display: flex;\n  justify-content: space-between;\n  position: relative;\n  z-index: 1;\n}\n.cover__center {\n  position: relative;\n  z-index: 1;\n  display: grid;\n  place-items: center;\n  align-content: center;\n  gap: 28px;\n  text-align: center;\n}\n.cover__globe {\n  width: clamp(280px, 36vw, 480px);\n  aspect-ratio: 1/1;\n  filter: drop-shadow(0 0 60px rgba(246, 233, 5, 0.18));\n  animation: globe-breathe 8s ease-in-out infinite;\n  transform-origin: center;\n}\n@media (prefers-reduced-motion: no-preference) {\n  .cover__globe { animation: globe-breathe 8s ease-in-out infinite; }\n}\n.cover__globe--sm {\n  width: 140px;\n  filter: drop-shadow(0 0 30px rgba(246, 233, 5, 0.14));\n}\n@keyframes globe-breathe {\n  0%, 100% { filter: drop-shadow(0 0 60px rgba(246, 233, 5, 0.15)); }\n  50%      { filter: drop-shadow(0 0 90px rgba(246, 233, 5, 0.28)); }\n}\n.cover__wordmark {\n  margin: 0;\n  font-size: clamp(56px, 9vw, 120px);\n  font-weight: 500;\n  letter-spacing: 0.08em;\n  line-height: 1;\n}\n.cover__wordmark-omni { color: var(--ink); }\n.cover__wordmark-sim { color: var(--mimosa); text-shadow: 0 0 24px color-mix(in srgb, var(--mimosa) 40%, transparent); }\n.cover__tagline {\n  margin: 0;\n  font-size: clamp(15px, 1.5vw, 19px);\n  color: var(--ink-mute);\n  letter-spacing: 0.01em;\n}\n\n.cover--back {\n  min-height: 60vh;\n}\n.cover__back-note {\n  margin: 0;\n  font-size: 14px;\n  color: var(--ink-mute);\n}\n\n/* ───────────── Page sections ───────────── */\n.page {\n  padding: clamp(56px, 7vw, 96px) clamp(28px, 5vw, 56px);\n  border-bottom: 1px solid var(--line);\n  background: var(--bg);\n}\n.page--ruled {\n  background:\n    linear-gradient(to right, color-mix(in srgb, var(--line) 40%, transparent) 1px, transparent 1px) 0 0 / 80px 100%,\n    var(--bg);\n}\n.page__head {\n  display: grid;\n  gap: 12px;\n  max-width: 70ch;\n  margin-bottom: clamp(36px, 5vw, 56px);\n  padding-bottom: 24px;\n  border-bottom: 1px solid var(--line);\n}\n.page__num {\n  margin: 0;\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--mimosa);\n}\n.page__title {\n  margin: 0;\n  font-size: clamp(28px, 3.6vw, 48px);\n  letter-spacing: -0.02em;\n  font-weight: 500;\n  line-height: 1.05;\n}\n.page__lede {\n  margin: 8px 0 0;\n  color: var(--ink-mute);\n  font-size: 15px;\n  line-height: 1.6;\n  max-width: 64ch;\n}\n.page__lede em { color: var(--mimosa-soft); font-style: normal; }\n\n/* ───────────── The mark ───────────── */\n.mark-stage {\n  position: relative;\n  aspect-ratio: 16/10;\n  background: var(--bg-elev);\n  border: 1px solid var(--line);\n  border-radius: 24px;\n  overflow: hidden;\n  display: grid;\n  place-items: center;\n}\n.mark-stage__rules {\n  position: absolute;\n  inset: 0;\n  background-image:\n    linear-gradient(to right, color-mix(in srgb, var(--line) 60%, transparent) 1px, transparent 1px),\n    linear-gradient(to bottom, color-mix(in srgb, var(--line) 60%, transparent) 1px, transparent 1px);\n  background-size: 40px 40px;\n  background-position: center;\n  mask-image: radial-gradient(ellipse at center, #000 0%, transparent 80%);\n  opacity: 0.6;\n}\n.mark-stage__globe {\n  position: relative;\n  width: 56%;\n  max-width: 460px;\n  aspect-ratio: 1/1;\n  filter: drop-shadow(0 0 50px rgba(246,233,5,0.18));\n}\n.mark-stage__corners span {\n  position: absolute;\n  width: 14px;\n  height v>\n        <svg class=\"mark-stage__globe\" viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-globe\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n        <div class=\"mark-stage__corners\" aria-hidden=\"true\">\n          <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"mark-stage__labels mono\">\n          <span class=\"lab lab--tl\">R · 100<\u002Fspan>\n          <span class=\"lab lab--tr\">tilt · 18°<\u002Fspan>\n          <span class=\"lab lab--bl\">360 pts · fib-sphere<\u002Fspan>\n          <span class=\"lab lab--br\">spin · −12°<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"mark-meta\">\n        <div><span class=\"mono\">Asset<\u002Fspan><b>orb.svg<\u002Fb><\u002Fdiv>\n        <div><span class=\"mono\">Format<\u002Fspan><b>SVG · ~28 KB<\u002Fb><\u002Fdiv>\n        <div><span class=\"mono\">Color<\u002Fspan><b>Mimosa · #f6e905<\u002Fb><\u002Fdiv>\n        <div><span class=\"mono\">Min size<\u002Fspan><b>20 px → use glyph<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── Anatomy ──────────────────── -->\n    <section class=\"page page--ruled\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">03 · Anatomy<\u002Fp>\n        <h2 class=\"page__title\">What's in there.<\u002Fh2>\n      <\u002Fheader>\n\n      <div class=\"anatomy\">\n        <div class=\"anatomy__stage\">\n          <svg class=\"anatomy__globe\" viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-globe\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <!-- Annotation lines + labels -->\n          <svg class=\"anatomy__lines\" viewBox=\"0 0 800 800\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\">\n            <g stroke=\"#3f3f2e\" stroke-width=\"1\" fill=\"none\">\n              <line x1=\"200\" y1=\"380\" x2=\"80\" y2=\"380\"><\u002Fline>\n              <line x1=\"540\" y1=\"190\" x2=\"700\" y2=\"120\"><\u002Fline>\n              <line x1=\"420\" y1=\"120\" x2=\"540\" y2=\"60\"><\u002Fline>\n              <line x1=\"400\" y1=\"400\" x2=\"400\" y2=\"500\"><\u002Fline>\n              <line x1=\"595\" y1=\"280\" x2=\"720\" y2=\"220\"><\u002Fline>\n              <line x1=\"395\" y1=\"690\" x2=\"395\" y2=\"760\"><\u002Fline>\n            <\u002Fg>\n            <g fill=\"#f6e905\">\n              <circle cx=\"200\" cy=\"380\" r=\"2.5\"><\u002Fcircle>\n              <circle cx=\"540\" cy=\"190\" r=\"2.5\"><\u002Fcircle>\n              <circle cx=\"420\" cy=\"120\" r=\"2.5\"><\u002Fcircle>\n              <circle cx=\"400\" cy=\"400\" r=\"2.5\"><\u002Fcircle>\n              <circle cx=\"595\" cy=\"280\" r=\"2.5\"><\u002Fcircle>\n              <circle cx=\"395\" cy=\"690\" r=\"2.5\"><\u002Fcircle>\n            <\u002Fg>\n          <\u002Fsvg>\n          <span class=\"ano-tag ano-tag--equator mono\">— particle field<\u002Fspan>\n          <span class=\"ano-tag ano-tag--silhouette mono\">limb taper —<\u002Fspan>\n          <span class=\"ano-tag ano-tag--pole mono\">— halo<\u002Fspan>\n          <span class=\"ano-tag ano-tag--core mono\">— core glow<\u002Fspan>\n          <span class=\"ano-tag ano-tag--pin mono\">front dot —<\u002Fspan>\n          <span class=\"ano-tag ano-tag--axis mono\">lit from upper-left<\u002Fspan>\n        <\u002Fdiv>\n\n        <ul class=\"anatomy__list\">\n          <li><span class=\"mono\">01<\u002Fspan><b>Silhouette<\u002Fb><p>No hard outline — the orb's edge emerges from the limb dots tapering to ~0.5 px.<\u002Fp><\u002Fli>\n          <li><span class=\"mono\">02<\u002Fspan><b>Particle field<\u002Fb><p>360 points on a Fibonacci sphere (golden-ratio spacing). Even distribution, no clumps.<\u002Fp><\u002Fli>\n          <li><span class=\"mono\">03<\u002Fspan><b>Depth ramp<\u002Fb><p>Front dots: 1.3 → 2.4 px, opacity 0.7 → 1.0. Back dots: 0.5 → 0.9 px, opacity 0.15 → 0.4.<\u002Fp><\u002Fli>\n          <li><span class=\"mono\">04<\u002Fspan><b>Directional shading<\u002Fb><p>Dots in the upper-left quadrant get a small size + brightness boost. Implies a light source.<\u002Fp><\u002Fli>\n          <li><span class=\"mono\">05<\u002Fspan><b>Core glow<\u002Fb><p>Radial mimosa @ 18% → 0%, centered 42/40%. Pulls the eye to the lit pole.<\u002Fp><\u002Fli>\n          <li><span class=\"mono\">06<\u002Fspan><b>Halo<\u002Fb><p>Thin mimosa ring at 92–100% radius, 8% opacity. Keeps the orb anchored on dark surfaces.<\u002Fp><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── Wordmark ──────────────────── -->\n    <section class=\"page\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">04 · Wordmark<\u002Fp>\n        <h2 class=\"page__title\">OMNISIM, in type.<\u002Fh2>\n        <p class=\"page__lede\">Space Grotesk Medium, uppercase, tracked +20. The <em>OMNI<\u002Fem> half stays neutral; the <em>SIM<\u002Fem> half carries the mimosa accent — quietly tying the wordmark back to the parent brand.<\u002Fp>\n      <\u002Fheader>\n\n      <div class=\"wm\">\n        <div class=\"wm__big\">\n          <span class=\"wm__big-omni\">OMNI<\u002Fspan><span class=\"wm__big-sim\">SIM<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"wm__grid\">\n          <div class=\"wm__cell\">\n            <p class=\"wm__label mono\">Primary · on dark<\u002Fp>\n            <div class=\"wm__sample wm__sample--dark\">\n              <span class=\"wm__big-omni\">OMNI<\u002Fspan><span class=\"wm__big-sim\">SIM<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"wm__cell\">\n            <p class=\"wm__label mono\">Primary · on light<\u002Fp>\n            <div class=\"wm__sample wm__sample--light\">\n              <span class=\"wm__big-omni\" style=\"color:#0a0a06\">OMNI<\u002Fspan><span class=\"wm__big-sim\" style=\"color:#a89800\">SIM<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"wm__cell\">\n            <p class=\"wm__label mono\">Monochrome<\u002Fp>\n            <div class=\"wm__sample wm__sample--dark\">\n              <span style=\"color:#f6f4ef\">OMNISIM<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"wm__cell\">\n            <p class=\"wm__label mono\">Inverse<\u002Fp>\n            <div class=\"wm__sample wm__sample--mimosa\">\n              <span style=\"color:#0a0a06\">OMNISIM<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── Lockups ──────────────────── -->\n    <section class=\"page page--ruled\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">05 · Lockups<\u002Fp>\n        <h2 class=\"page__title\">Orb + wordmark.<\u002Fh2>\n        <p class=\"page__lede\">Two locked configurations — horizontal for navs and headers, stacked for app icons, splash screens, posters. Both maintain a 1× clear space equal to the orb's radius..<\u002Fp>\n      <\u002Fheader>\n\n      <div class=\"lockups\">\n        <figure class=\"lockup lockup--horiz\">\n          <div class=\"lockup__pad\">\n            <svg class=\"lockup__globe\" viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-globe\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n            <span class=\"lockup__wm\">\n              <span class=\"cover__wordmark-omni\">OMNI<\u002Fspan><span class=\"cover__wordmark-sim\">SIM<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">Horizontal · default<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <figure class=\"lockup lockup--stack\">\n          <div class=\"lockup__pad lockup__pad--stack\">\n            <svg class=\"lockup__globe lockup__globe--lg\" viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-globe\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n            <span class=\"lockup__wm\">\n              <span class=\"cover__wordmark-omni\">OMNI<\u002Fspan><span class=\"cover__wordmark-sim\">SIM<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"lockup__sub mono\">— an open-world simulator for agents<\u002Fspan>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">Stacked · splash / poster<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <figure class=\"lockup lockup--link\">\n          <div class=\"lockup__pad\">\n            <span class=\"lockup__omnilink\">\n              <svg class=\"lockup__omnilink-mark\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"#f6e905\" stroke-width=\"2.5\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"#f6e905\"><\u002Fcircle><\u002Fsvg>\n              OmniLink\n            <\u002Fspan>\n            <span class=\"lockup__sep\">/<\u002Fspan>\n            <svg class=\"lockup__globe lockup__globe--sm\" viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-globe\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n            <span class=\"lockup__wm lockup__wm--sm\">\n              <span class=\"cover__wordmark-omni\">OMNI<\u002Fspan><span class=\"cover__wordmark-sim\">SIM<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">OmniLink · product lockup<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── Monogram ──────────────────── -->\n    <section class=\"page\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">06 · Monogram<\u002Fp>\n        <h2 class=\"page__title\">When 24 pixels is all you've got.<\u002Fh2>\n        <p class=\"page__lede\">Below 24 px the 360-dot orb starts to dissolve. Drop in the 100-dot glyph — bolder dots, fewer of them, same visual DNA.<\u002Fp>\n      <\u002Fheader>\n\n      <div class=\"glyphs\">\n        <figure class=\"gl gl--xl\">\n          <div class=\"gl__frame\" style=\"--s:160px\">\n            <svg viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-glyph\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">96 px · macOS app icon<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure class=\"gl\">\n          <div class=\"gl__frame\" style=\"--s:96px\">\n            <svg viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-glyph\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">64 px<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure class=\"gl\">\n          <div class=\"gl__frame\" style=\"--s:48px\">\n            <svg viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-glyph\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">32 px<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure class=\"gl\">\n          <div class=\"gl__frame\" style=\"--s:32px\">\n            <svg viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-glyph\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n          <figcaption class=\"mono\">16 px · favicon<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n\n      <div class=\"compare\">\n        <div class=\"compare__cell\">\n          <p class=\"mono\">Full orb · 24 px<\u002Fp>\n          <div class=\"compare__frame\" style=\"--s:64px\">\n            <svg viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-globe\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n          <p class=\"compare__verdict compare__verdict--bad mono\">× dissolves at this size<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"compare__cell\">\n          <p class=\"mono\">Glyph · 24 px<\u002Fp>\n          <div class=\"compare__frame\" style=\"--s:64px\">\n            <svg viewBox=\"-120 -120 240 240\"><use href=\"#omnisim-glyph\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n          <p class=\"compare__verdict compare__verdict--good mono\">✓ legible<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── Color ──────────────────── -->\n    <section class=\"page page--ruled\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">07 · Color<\u002Fp>\n        <h2 class=\"page__title\">Two notes. One accent.<\u002Fh2>\n        <p class=\"page__lede\">Mimosa over near-black. No gradients in the brand surface itself — gradients live inside the mark.<\u002Fp>\n      <\u002Fheader>\n\n      <div class=\"swatches\">\n        <div class=\"sw sw--mimosa\">\n          <span class=\"sw__name\">Mimosa<\u002Fspan>\n          <span class=\"sw__hex mono\">#F6E905<\u002Fspan>\n          <span class=\"sw__role mono\">Accent · marks · CTAs<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--mimosa-dim\">\n          <span class=\"sw__name\">Mimosa · dim<\u002Fspan>\n          <span class=\"sw__hex mono\">#D4C500<\u002Fspan>\n          <span class=\"sw__role mono\">Hover · pressed<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--soft\">\n          <span class=\"sw__name\">Mimosa · soft<\u002Fspan>\n          <span class=\"sw__hex mono\">#FAF6A4<\u002Fspan>\n          <span class=\"sw__role mono\">Captions on dark<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--ink\">\n          <span class=\"sw__name\">Ink<\u002Fspan>\n          <span class=\"sw__hex mono\">#F6F4EF<\u002Fspan>\n          <span class=\"sw__role mono\">Body · headings<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--mute\">\n          <span class=\"sw__name\">Ink · mute<\u002Fspan>\n          <span class=\"sw__hex mono\">#B4B3A4<\u002Fspan>\n          <span class=\"sw__role mono\">Secondary text<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--surface\">\n          <span class=\"sw__name\">Surface<\u002Fspan>\n          <span class=\"sw__hex mono\">#14140D<\u002Fspan>\n          <span class=\"sw__role mono\">Cards · panels<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--bg\">\n          <span class=\"sw__name\">Bg<\u002Fspan>\n          <span class=\"sw__hex mono\">#0A0A06<\u002Fspan>\n          <span class=\"sw__role mono\">Canvas<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"sw sw--sunk\">\n          <span class=\"sw__name\">Sunk<\u002Fspan>\n          <span class=\"sw__hex mono\">#060604<\u002Fspan>\n          <span class=\"sw__role mono\">Wells · code<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── Type ──────────────────── -->\n    <section class=\"page\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">08 · Type<\u002Fp>\n        <h2 class=\"page__title\">Display, body, mono.<\u002Fh2>\n      <\u002Fheader>\n\n      <div class=\"type\">\n        <div class=\"type__row\">\n          <div class=\"type__label\">\n            <p class=\"mono\">Display<\u002Fp>\n            <h3>Space Grotesk<\u002Fh3>\n            <p class=\"type__weights mono\">300 · 400 · 500 · 600 · 700<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"type__sample type__sample--display\">\n            <span class=\"type__big\">Talk to a simulator.<\u002Fspan>\n            <span class=\"type__med\">An open-world simulator for agents.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"type__row\">\n          <div class=\"type__label\">\n            <p class=\"mono\">Body<\u002Fp>\n            <h3>Space Grotesk<\u002Fh3>\n            <p class=\"type__weights mono\">400 · 500<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"type__sample\">\n            <p>OmniSim is the open-source robotics simulator built by OmniLink — the first simulator designed from the ground up around agentic authoring and runtime control.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"type__row\">\n          <div class=\"type__label\">\n            <p class=\"mono\">Mono<\u002Fp>\n            <h3>JetBrains Mono<\u002Fh3>\n            <p class=\"type__weights mono\">400 · 500 · letter-spacing 0.18em uppercase for labels<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"type__sample\">\n            <p class=\"mono\" style=\"font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:#f6e905\">PROTO_NOT_FOUND · :6060 · seed 0xA1C<\u002Fp>\n            <p class=\"mono\" style=\"font-size:13px;color:#b4b3a4;margin-top:8px\">curl http://127.0.0.1:6060/state<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ──────────────────── In context ──────────────────── -->\n    <section class=\"page page--ruled\">\n      <header class=\"page__head\">\n        <p class=\"page__num\">09 · In context<\u002Fp>\n        <h2 class=\"page__title\">Where it lives.<\u002Fh2>\n      <\u002Fheader>\n\n      <div class=\"ctx\">\n        <!-- Browser favicon -->\n        <figure class=\"ctx__card\">\n          <div class=\"ctx__browser\">\n            <div class=\"ctx__tabs\">\n              <div class=\"ctx__tab ctx__tab--active\">\n                <svg viewBox=\"-120 -120 240 240\" class=\"ctx__favicon\"><use href=\"#omnisim-glyph\" x=\"-120\" y=\"-120\" width=\"240\" height=\"240\"><\u002Fuse><\u002Fsvg>\n                <span>OmniSim — for agents<\u002Fspan>\n                <span class=\"ctx__tab-x\">×<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"ctx__tab\">\n                <span class=\"ctx__tab-dot\"><\u002Fspan>\n                <span>OmniLink Docs<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"ctx__urlbar\">\n              <span class=\"mono\">omnilink.tech/omnisim<\u002Fspan>\n
