<?xml version="1.0" encoding="UTF-8"?>
<!--
  OmniSim wordmark — OMNI in ink (#F6F4EF), SIM in mimosa (#F6E905).
  Space Grotesk Medium, uppercase, +0.08em tracking. The font is *not* embedded —
  this SVG depends on Space Grotesk being available system-wide or via @font-face
  in the consuming surface. For prints / packaging where the font may be missing,
  use the rasterized PNG generated by scripts/branding/render_omnisim_orb.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="OMNISIM">
  <title>OMNISIM wordmark</title>
  <style>
    .wm { font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
          font-weight: 500; font-size: 130px; letter-spacing: 10.4px; }
    .omni { fill: #F6F4EF; }
    .sim  { fill: #F6E905; }
  </style>
  <text class="wm" x="0" y="125">
    <tspan class="omni">OMNI</tspan><tspan class="sim">SIM</tspan>
  </text>
</svg>
