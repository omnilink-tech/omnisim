<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>%title%</title>
    <link rel="stylesheet" href="%cssName%">
    <script type="module" src="https://cyberbotics.com/wwi/R2025a/WebotsView.js"></script>
  </head>
  <body>
    <div class="title-container">
      <h1>Web %type%: <strong>%title%</strong></h1>
    </div>
    <div class="omnisim-view-container">
      <omnisim-view data-thumbnail=%jpgName% data-scene=%w3dName% data-animation=%jsonName%></omnisim-view>
    </div>
    <div class="description-container">
      <p><strong>Description:</strong><br><br>%description%</p>
    </div>
    <div class="bottom-container">
      <p>If the animation is not loading correctly, your browser may be preventing local-file CORS requests.
         Try opening the file via a local web server, or open it from a different browser.</p>
    </div>
  </body>
</html>
