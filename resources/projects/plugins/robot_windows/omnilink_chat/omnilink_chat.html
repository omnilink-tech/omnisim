<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>OmniLink — Robot Console</title>
    <link rel="stylesheet" href="omnilink_chat.css">
  </head>
  <body>
    <aside id="omnilink-side-menu">
      <div id="ol-header">
        <div id="ol-brand">
          <span class="ol-orb"></span>
          <span class="ol-brand-text">OmniLink</span>
        </div>
        <div id="ol-status">
          <span id="ol-status-dot" class="ol-dot ol-dot--idle"></span>
          <span id="ol-status-text">connecting…</span>
        </div>
      </div>

      <!-- Persona hero. Shows a name + tagline + avatar when the bridge
           sends a display_name; otherwise it reads as the generic robot
           card. -->
      <div id="ol-hero">
        <div id="ol-avatar" aria-hidden="true"><span id="ol-avatar-initial">·</span></div>
        <div id="ol-hero-text">
          <div id="ol-robot-name">—</div>
          <div id="ol-robot-tagline">connecting…</div>
          <div id="ol-agent-line">
            <span class="ol-label">agent</span>
            <span id="ol-agent-name" class="ol-value">local intent</span>
          </div>
        </div>
        <button type="button" id="ol-popout" class="ol-icon-btn"
                title="Open this chat in a browser tab">⤴</button>
        <button type="button" id="ol-speaker" class="ol-icon-btn"
                title="Mute the agent's voice" aria-pressed="false" hidden>🔊</button>
      </div>

      <div id="ol-chat">
        <div id="ol-log" aria-live="polite"></div>
      </div>

      <!-- Clickable example prompts. Populated from the bridge's
           suggestions list; each chip submits itself. -->
      <div id="ol-suggest-bar" hidden></div>

      <form id="ol-composer" autocomplete="off">
        <textarea id="ol-input"
                  placeholder="Tell the robot what to do…"
                  rows="2"
                  aria-label="prompt"></textarea>
        <div id="ol-composer-actions">
          <button type="button" id="ol-mic" class="ol-btn ol-btn--mic"
                  title="Click to talk, click again to send" hidden>🎙 Talk</button>
          <button type="submit" id="ol-send" class="ol-btn ol-btn--primary">Send</button>
          <button type="button" id="ol-stop" class="ol-btn ol-btn--stop" title="Emergency halt">Stop</button>
        </div>
      </form>
    </aside>

    <script type="module" src="omnilink_chat.js"></script>
  </body>
</html>
